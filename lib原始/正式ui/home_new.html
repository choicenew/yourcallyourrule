<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .feature-card {
            @apply bg-white rounded-xl p-6 shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #FFB74D;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #FFB74D;
        }
        .swiper-container {
            overflow: hidden;
            position: relative;
        }
        .swiper-wrapper {
            display: flex;
            transition: transform 0.5s ease;
        }
        .swiper-slide {
            flex-shrink: 0;
            width: 100%;
        }
        .swiper-pagination {
            display: flex;
            justify-content: center;
            margin-top: 12px;
        }
        .swiper-pagination-bullet {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #e2e8f0;
            margin: 0 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .swiper-pagination-bullet-active {
            background-color: #FFB74D;
            width: 10px;
            height: 10px;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-16">
    <!-- 顶部导航栏 -->
    <nav class="bg-primary text-white sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex flex-col items-center py-4">
                <div class="flex items-center space-x-2 mb-4 w-full justify-between">
                    <div class="flex items-center">
                        <i class="fas fa-shield-alt text-white text-2xl mr-2"></i>
                        <span class="text-xl font-bold">Your Call Your Rule</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button id="searchToggle" class="text-white hover:text-white/80 transition">
                            <i class="fas fa-search text-xl"></i>
                        </button>
                        <a href="settings.html" class="text-white hover:text-white/80 transition">
                            <i class="fas fa-cog text-xl"></i>
                        </a>
                    </div>
                </div>
                
                <!-- 搜索栏 -->
                <div id="searchBar" class="w-full max-w-md relative hidden">
                    <input type="text" placeholder="搜索号码、联系人或规则..." class="w-full py-2 px-4 pl-10 rounded-full bg-white/10 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-white/50">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-white/70"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- 轮播卡片 -->
    <section class="py-4">
        <div class="container mx-auto px-4">
            <div class="swiper-container w-full max-w-lg mx-auto rounded-xl overflow-hidden shadow-lg">
                <div class="swiper-wrapper" id="swiperWrapper">
                    <!-- 卡片1：来电识别 -->
                    <div class="swiper-slide bg-gradient-to-r from-blue-500 to-purple-600 text-white p-6">
                        <h3 class="text-xl font-semibold mb-2">来电识别</h3>
                        <p class="mb-4">智能识别未知来电，保护您的通话安全</p>
                        <div class="flex justify-between items-center">
                            <span class="text-sm opacity-75">智能防护</span>
                            <button class="bg-white text-purple-600 px-4 py-1 rounded-full text-sm font-medium">了解更多</button>
                        </div>
                    </div>
                    <!-- 卡片2：短信过滤 -->
                    <div class="swiper-slide bg-gradient-to-r from-green-500 to-teal-500 text-white p-6">
                        <h3 class="text-xl font-semibold mb-2">短信过滤</h3>
                        <p class="mb-4">智能过滤垃圾短信，让您的收件箱更整洁</p>
                        <div class="flex justify-between items-center">
                            <span class="text-sm opacity-75">智能分类</span>
                            <button class="bg-white text-teal-600 px-4 py-1 rounded-full text-sm font-medium">了解更多</button>
                        </div>
                    </div>
                    <!-- 卡片3：骚扰拦截 -->
                    <div class="swiper-slide bg-gradient-to-r from-orange-500 to-red-500 text-white p-6">
                        <h3 class="text-xl font-semibold mb-2">骚扰拦截</h3>
                        <p class="mb-4">一键拦截骚扰电话，还您一个安静的环境</p>
                        <div class="flex justify-between items-center">
                            <span class="text-sm opacity-75">高效拦截</span>
                            <button class="bg-white text-red-600 px-4 py-1 rounded-full text-sm font-medium">了解更多</button>
                        </div>
                    </div>
                </div>
                <!-- 轮播指示器 -->
                <div class="swiper-pagination py-2"></div>
            </div>
        </div>
    </section>

    <!-- 验证规则设置 -->
    <section class="py-4">
        <div class="container mx-auto px-4">
            <div class="bg-white rounded-xl p-6 shadow-lg max-w-lg mx-auto">
                <h2 class="text-xl font-semibold mb-4">验证规则设置</h2>
                <div class="space-y-4">
                    <div class="flex flex-col space-y-2">
                        <label class="text-sm font-medium text-gray-700">国家代码</label>
                        <input type="text" placeholder="例如：US, CN, JP" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <div class="flex flex-col space-y-2">
                        <label class="text-sm font-medium text-gray-700">电话号码</label>
                        <input type="tel" placeholder="输入需要验证的号码" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <button class="w-full bg-primary text-white py-2 rounded-lg hover:bg-primary/90 transition duration-300">验证号码</button>
                </div>
                <!-- 验证结果区域 -->
                <div class="mt-6 space-y-3 hidden" id="verificationResults">
                    <h3 class="font-medium text-gray-800">验证结果：</h3>
                    <div class="space-y-2">
                        <div class="flex items-center justify-between p-2 bg-gray-50 rounded-lg">
                            <span class="text-sm">全局拒绝</span>
                            <span class="px-2 py-1 text-xs rounded-full bg-red-100 text-red-800">已拦截</span>
                        </div>
                        <!-- 更多结果项... -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 规则管理 -->
    <section class="py-4">
        <div class="container mx-auto px-4">
            <div class="bg-white rounded-xl p-6 shadow-lg max-w-lg mx-auto">
                <h2 class="text-xl font-semibold mb-4">规则管理</h2>
                <div class="space-y-4">
                    <!-- 拒绝所有号码 -->
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                        <div>
                            <h3 class="font-medium text-gray-800">拒绝所有号码</h3>
                            <p class="text-sm text-gray-500">启用后将拒绝所有来电</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer" id="rejectAllNumbers">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/50 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>

                    <!-- 允许白名单号码 -->
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                        <div>
                            <h3 class="font-medium text-gray-800">允许白名单号码</h3>
                            <p class="text-sm text-gray-500">允许来自白名单中的号码</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer" id="allowWhitelist">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/50 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>

                    <!-- 允许正则匹配 -->
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                        <div>
                            <h3 class="font-medium text-gray-800">允许正则匹配</h3>
                            <p class="text-sm text-gray-500">启用正则表达式匹配规则</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer" id="allowRegex">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/50 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 功能卡片 -->
    <section class="py-6">
        <div class="container mx-auto px-4">
            <h2 class="text-xl font-bold mb-4">功能中心</h2>
            <div class="grid grid-cols-2 gap-4 max-w-lg mx-auto">
                <!-- 黑名单 -->
                <a href="blacklist.html" class="feature-card">
                    <div class="bg-red-100 text-red-600 w-12 h-12 rounded-full flex items-center justify-center mb-3">
                        <i class="fas fa-ban text-xl"></i>
                    </div>
                    <h3 class="font-semibold text-gray-800 mb-1">黑名单</h3>
                    <p class="text-sm text-gray-500">管理黑名单号码</p>
                </a>
                
                <!-- 白名单 -->
                <a href="whitelist.html" class="feature-card">
                    <div class="bg-green-100 text-green-600 w-12 h-12 rounded-full flex items-center justify-center mb-3">
                        <i class="fas fa-check-circle text-xl"></i>
                    </div>
                    <h3 class="font-semibold text-gray-800 mb-1">白名单</h3>
                    <p class="text-sm text-gray-500">管理白名单号码</p>
                </a>
                
                <!-- 通话记录 -->
                <a href="call_history.html" class="feature-card">
                    <div class="bg-blue-100 text-blue-600 w-12 h-12 rounded-full flex items-center justify-center mb-3">
                        <i class="fas fa-history text-xl"></i>
                    </div>
                    <h3 class="font-semibold text-gray-800 mb-1">通话记录</h3>
                    <p class="text-sm text-gray-500">查看拦截记录</p>
                </a>
                
                <!-- 设置 -->
                <a href="settings.html" class="feature-card">
                    <div class="bg-purple-100 text-purple-600 w-12 h-12 rounded-full flex items-center justify-center mb-3">
                        <i class="fas fa-cog text-xl"></i>
                    </div>
                    <h3 class="font-semibold text-gray-800 mb-1">设置</h3>
                    <p class="text-sm text-gray-500">系统设置</p>
                </a>
            </div>
        </div>
    </section>

    <!-- 底部导航栏 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white shadow-lg border-t border-gray-200">
        <div class="container mx-auto">
            <div class="flex justify-around items-center py-2">
                <a href="home_new.html" class="flex flex-col items-center text-primary">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="rules.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-list-alt text-xl"></i>
                    <span class="text-xs mt-1">规则</span>
                </a>
                <a href="history.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">历史</span>
                </a>
                <a href="settings.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </nav>

    <script>
        // 搜索栏切换
        const searchToggle = document.getElementById('searchToggle');
        const searchBar = document.getElementById('searchBar');

        searchToggle.addEventListener('click', () => {
            searchBar.classList.toggle('hidden');
            if (!searchBar.classList.contains('hidden')) {
                searchBar.querySelector('input').focus();
            }
        });

        // 轮播功能
        const swiperWrapper = document.getElementById('swiperWrapper');
        const slides = swiperWrapper.querySelectorAll('.swiper-slide');
        const paginationContainer = document.querySelector('.swiper-pagination');
        let currentIndex = 0;
        
        // 创建分页指示器
        slides.forEach((_, index) => {
            const bullet = document.createElement('span');
            bullet.classList.add('swiper-pagination-bullet');
            if (index === 0) {
                bullet.classList.add('swiper-pagination-bullet-active');
            }
            bullet.addEventListener('click', () => {
                goToSlide(index);
            });
            paginationContainer.appendChild(bullet);
        });

        function goToSlide(index) {
            currentIndex = index;
            swiperWrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
            
            // 更新分页指示器
            document.querySelectorAll('.swiper-pagination-bullet').forEach((bullet, i) => {
                if (i === currentIndex) {
                    bullet.classList.add('swiper-pagination-bullet-active');
                } else {
                    bullet.classList.remove('swiper-pagination-bullet-active');
                }
            });
        }
        
        // 自动轮播
        setInterval(() => {
            currentIndex = (currentIndex + 1) % slides.length;
            goToSlide(currentIndex);
        }, 5000);

        // 规则管理开关事件处理
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                // 这里可以添加开关状态变更的处理逻辑
                console.log(this.id + ' changed to: ' + this.checked);
            });
        });
    </script>
</body>
</html>

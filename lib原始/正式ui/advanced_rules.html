<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级规则设置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">
    <div class="app-frame rounded-3xl shadow-xl max-w-2xl mx-auto">
        <!-- 头部 -->
        <div class="bg-white shadow-md">
            <div class="container mx-auto px-4 py-4">
                <div class="flex items-center space-x-4">
                    <a href="settings.html" class="text-gray-600">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <h1 class="text-xl font-semibold">高级规则设置</h1>
                </div>
            </div>
        </div>

        <!-- 主体内容 -->
        <div class="p-6 space-y-6">
            <!-- 正则编辑器 -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <h2 class="text-lg font-semibold mb-4">正则表达式编辑器</h2>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <span>规则名称</span>
                        <input type="text" class="w-48 px-3 py-2 border rounded-lg" placeholder="我的正则规则">
                    </div>
                    
                    <div class="relative">
                        <textarea 
                            class="w-full h-32 p-3 border rounded-lg font-mono text-sm"
                            placeholder="输入正则表达式（例如：^\d{4}-\d{2}-\d{2}$）"
                        ></textarea>
                        <button class="absolute bottom-2 right-2 px-3 py-1 bg-primary/10 text-primary rounded-lg text-sm">
                            <i class="fas fa-vial mr-1"></i>测试
                        </button>
                    </div>

                    <!-- 正则示例 -->
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <h3 class="text-sm font-medium mb-2">常用正则模板：</h3>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <button class="text-left p-2 hover:bg-gray-100 rounded">
                                <div class="font-mono">^1[3-9]\d{9}$</div>
                                <div class="text-gray-500">手机号码</div>
                            </button>
                            <button class="text-left p-2 hover:bg-gray-100 rounded">
                                <div class="font-mono">^\d{17}[\dXx]$</div>
                                <div class="text-gray-500">身份证号</div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 规则管理 -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <h2 class="text-lg font-semibold mb-4">规则管理</h2>
                <div class="divide-y">
                    <div class="py-3 flex items-center justify-between">
                        <div>
                            <p class="font-medium">银行短信验证码</p>
                            <p class="text-sm text-gray-500">匹配模式：^\d{6}$</p>
                        </div>
                        <div class="flex space-x-2">
                            <button class="w-8 h-8 bg-success/10 text-success rounded-full">
                                <i class="fas fa-toggle-on"></i>
                            </button>
                            <button class="w-8 h-8 bg-danger/10 text-danger rounded-full">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

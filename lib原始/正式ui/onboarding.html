<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎使用 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .onboarding-slide {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .progress-dot {
            transition: background-color 0.3s ease;
        }
        .slide-enter {
            opacity: 0;
            transform: translateX(50px);
        }
        .slide-enter-active {
            opacity: 1;
            transform: translateX(0);
        }
        .slide-exit {
            opacity: 1;
            transform: translateX(0);
        }
        .slide-exit-active {
            opacity: 0;
            transform: translateX(-50px);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-primary/10 to-white min-h-screen">
    <div class="container mx-auto px-4 py-8 flex flex-col min-h-screen">
        <!-- 顶部进度条 -->
        <div class="w-full max-w-md mx-auto mb-8">
            <div class="relative pt-1">
                <div class="flex mb-2 items-center justify-between">
                    <div>
                        <span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded-full text-primary bg-primary bg-opacity-20">
                            设置进度
                        </span>
                    </div>
                    <div class="text-right">
                        <span id="progressPercentage" class="text-xs font-semibold inline-block text-primary">
                            20%
                        </span>
                    </div>
                </div>
                <div class="overflow-hidden h-2 mb-4 text-xs flex rounded bg-gray-200">
                    <div id="progressBar" style="width: 20%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-primary transition-all duration-500"></div>
                </div>
            </div>
        </div>

        <!-- 跳过按钮 -->
        <div class="absolute top-8 right-8">
            <button id="skipButton" class="text-primary font-medium hover:text-primary/80 transition">跳过</button>
        </div>

        <!-- 引导页内容 -->
        <div class="flex-1 flex items-center justify-center">
            <div class="w-full max-w-md">
                <!-- 轮播内容 -->
                <div class="relative overflow-hidden bg-white rounded-2xl shadow-xl p-8">
                    <div id="slidesContainer" class="transition-all duration-500">
                        <!-- 语言选择页 -->
                        <div class="onboarding-slide" id="slide1">
                            <div class="text-center">
                                <div class="w-20 h-20 bg-primary/20 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i class="fas fa-globe text-primary text-3xl"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-6">选择您的语言</h2>
                                <div class="mb-8">
                                    <select class="w-full max-w-xs mx-auto py-3 px-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                                        <option value="zh">简体中文</option>
                                        <option value="en">English</option>
                                        <option value="ja">日本語</option>
                                        <option value="ko">한국어</option>
                                        <option value="fr">Français</option>
                                        <option value="de">Deutsch</option>
                                        <option value="es">Español</option>
                                    </select>
                                </div>
                                <p class="text-gray-600 mb-4">选择您偏好的语言以获得最佳体验</p>
                            </div>
                        </div>

                        <!-- 功能介绍页1 -->
                        <div class="onboarding-slide hidden" id="slide2">
                            <div class="text-center">
                                <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i class="fas fa-phone-alt text-blue-500 text-3xl"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">智能来电识别</h2>
                                <p class="text-gray-600 mb-6">自动识别未知来电，标记可疑号码，保护您的通话安全</p>
                                <div class="flex justify-center">
                                    <img src="https://via.placeholder.com/300x180/E3F2FD/2196F3?text=来电识别" alt="来电识别" class="rounded-lg shadow-md">
                                </div>
                            </div>
                        </div>

                        <!-- 权限请求页 -->
                        <div class="onboarding-slide hidden" id="slide3">
                            <div class="text-center">
                                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i class="fas fa-shield-alt text-green-500 text-3xl"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">应用权限</h2>
                                <p class="text-gray-600 mb-6">为了提供完整功能，我们需要以下权限：</p>
                                
                                <div class="space-y-4 mb-6">
                                    <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                                        <div class="w-10 h-10 bg-primary/20 rounded-full flex items-center justify-center mr-3">
                                            <i class="fas fa-phone text-primary"></i>
                                        </div>
                                        <div class="flex-1 text-left">
                                            <h3 class="font-medium">电话权限</h3>
                                            <p class="text-xs text-gray-500">用于识别和管理来电</p>
                                        </div>
                                        <button class="bg-primary text-white px-3 py-1 rounded-full text-sm">
                                            授权
                                        </button>
                                    </div>
                                    
                                    <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mr-3">
                                            <i class="fas fa-comment text-blue-500"></i>
                                        </div>
                                        <div class="flex-1 text-left">
                                            <h3 class="font-medium">短信权限</h3>
                                            <p class="text-xs text-gray-500">用于过滤垃圾短信</p>
                                        </div>
                                        <button class="bg-primary text-white px-3 py-1 rounded-full text-sm">
                                            授权
                                        </button>
                                    </div>
                                    
                                    <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                                        <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center mr-3">
                                            <i class="fas fa-address-book text-purple-500"></i>
                                        </div>
                                        <div class="flex-1 text-left">
                                            <h3 class="font-medium">联系人权限</h3>
                                            <p class="text-xs text-gray-500">用于管理联系人和白名单</p>
                                        </div>
                                        <button class="bg-primary text-white px-3 py-1 rounded-full text-sm">
                                            授权
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 功能介绍页2 -->
                        <div class="onboarding-slide hidden" id="slide4">
                            <div class="text-center">
                                <div class="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i class="fas fa-comment-slash text-orange-500 text-3xl"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">智能短信过滤</h2>
                                <p class="text-gray-600 mb-6">自动过滤垃圾短信，分类整理重要信息，让您的收件箱更整洁</p>
                                <div class="flex justify-center">
                                    <img src="https://via.placeholder.com/300x180/FFF3E0/FF9800?text=短信过滤" alt="短信过滤" class="rounded-lg shadow-md">
                                </div>
                            </div>
                        </div>

                        <!-- 默认来电识别设置页 -->
                        <div class="onboarding-slide hidden" id="slide5">
                            <div class="text-center">
                                <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i class="fas fa-ban text-red-500 text-3xl"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">骚扰电话拦截</h2>
                                <p class="text-gray-600 mb-6">一键拦截骚扰电话和短信，自定义拦截规则，还您一个安静的环境</p>
                                <div class="flex justify-center">
                                    <img src="https://via.placeholder.com/300x180/FFEBEE/F44336?text=骚扰拦截" alt="骚扰拦截" class="rounded-lg shadow-md">
                                </div>
                            </div>
                        </div>

                        <!-- 完成页面 -->
                        <div class="onboarding-slide hidden" id="slide6">
                            <div class="text-center">
                                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i class="fas fa-check text-green-500 text-3xl"></i>
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">设置完成！</h2>
                                <p class="text-gray-600 mb-8">恭喜您完成了所有设置，现在开始享受安全的通讯体验吧！</p>
                                <button id="finishButton" class="bg-primary text-white py-3 px-8 rounded-lg font-medium text-lg shadow-md hover:bg-opacity-90 transition duration-300 w-full">
                                    开始使用
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 进度指示器 -->
                <div class="flex justify-center mt-8 mb-4">
                    <div class="flex space-x-2">
                        <span class="progress-dot h-3 w-3 rounded-full bg-primary cursor-pointer" data-slide="1"></span>
                        <span class="progress-dot h-3 w-3 rounded-full bg-gray-300 cursor-pointer" data-slide="2"></span>
                        <span class="progress-dot h-3 w-3 rounded-full bg-gray-300 cursor-pointer" data-slide="3"></span>
                        <span class="progress-dot h-3 w-3 rounded-full bg-gray-300 cursor-pointer" data-slide="4"></span>
                        <span class="progress-dot h-3 w-3 rounded-full bg-gray-300 cursor-pointer" data-slide="5"></span>
                        <span class="progress-dot h-3 w-3 rounded-full bg-gray-300 cursor-pointer" data-slide="6"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部导航按钮 -->
        <div class="container mx-auto px-4 py-8 flex justify-between max-w-md">
            <button id="prevButton" class="bg-white text-primary py-2 px-6 rounded-lg font-medium shadow-md hover:bg-gray-50 transition duration-300 hidden">
                上一步
            </button>
            <button id="nextButton" class="bg-primary text-white py-2 px-8 rounded-lg font-medium shadow-md hover:bg-opacity-90 transition duration-300 ml-auto">
                下一步
            </button>
        </div>
    </div>

    <script>
        // 引导页轮播功能
        const slides = document.querySelectorAll('.onboarding-slide');
        const dots = document.querySelectorAll('.progress-dot');
        const nextButton = document.getElementById('nextButton');
        const prevButton = document.getElementById('prevButton');
        const skipButton = document.getElementById('skipButton');
        const finishButton = document.getElementById('finishButton');
        const slidesContainer = document.getElementById('slidesContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercentage = document.getElementById('progressPercentage');
        let currentSlide = 0;
        const totalSlides = slides.length;

        // 初始化显示第一个slide
        showSlide(0);

        // 点击下一步按钮
        nextButton.addEventListener('click', () => {
            if (currentSlide < totalSlides - 1) {
                showSlide(currentSlide + 1);
            } else {
                // 最后一页，跳转到主页
                window.location.href = 'index_new.html';
            }
        });

        // 点击上一步按钮
        prevButton.addEventListener('click', () => {
            if (currentSlide > 0) {
                showSlide(currentSlide - 1);
            }
        });

        // 点击跳过按钮
        skipButton.addEventListener('click', () => {
            window.location.href = 'index_new.html';
        });

        // 点击完成按钮
        if (finishButton) {
            finishButton.addEventListener('click', () => {
                window.location.href = 'index_new.html';
            });
        }

        // 点击进度点
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                showSlide(index);
            });
        });

        // 显示指定页面
        function showSlide(index) {
            // 隐藏所有slide
            slides.forEach(slide => {
                slide.classList.add('hidden');
            });
            
            // 显示当前slide
            slides[index].classList.remove('hidden');
            
            // 更新进度点
            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.remove('bg-gray-300');
                    dot.classList.add('bg-primary');
                } else {
                    dot.classList.remove('bg-primary');
                    dot.classList.add('bg-gray-300');
                }
            });
            
            // 更新当前页索引
            currentSlide = index;
            
            // 更新进度条
            const progress = Math.round((currentSlide + 1) / totalSlides * 100);
            progressBar.style.width = `${progress}%`;
            progressPercentage.textContent = `${progress}%`;
            
            // 更新按钮状态
            if (currentSlide === 0) {
                prevButton.classList.add('hidden');
            } else {
                prevButton.classList.remove('hidden');
            }
            
            // 更新按钮文本
            if (currentSlide === totalSlides - 1) {
                nextButton.textContent = '完成';
            } else {
                nextButton.textContent = '下一步';
            }
        }
    </script>
</body>
</html>

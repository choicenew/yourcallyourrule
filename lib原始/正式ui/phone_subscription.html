<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电话规则订阅 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
    <style>
        .subscription-card {
            @apply bg-white rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow mb-6;
        }
        .badge-whitelist {
            @apply bg-success/10 text-success;
        }
        .badge-blacklist {
            @apply bg-danger/10 text-danger;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="contacts_management.html" class="text-gray-600 hover:text-primary mr-2">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <i class="fas fa-phone-alt text-primary text-xl"></i>
                    <h1 class="text-xl font-semibold text-dark">电话规则订阅</h1>
                </div>
                <div class="flex items-center">
                    <button class="text-primary hover:text-opacity-80">
                        <i class="fas fa-plus text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-6">
        <!-- 订阅说明 -->
        <div class="bg-white rounded-xl p-4 shadow-sm mb-6">
            <div class="flex items-start">
                <i class="fas fa-info-circle text-info mt-1 mr-3"></i>
                <div>
                    <h3 class="text-lg font-medium text-dark">关于电话订阅规则</h3>
                    <p class="text-sm text-gray-600 mt-1">通过URL订阅电话规则列表，自动更新黑白名单规则。支持JSON格式规则文件。</p>
                </div>
            </div>
        </div>

        <!-- 订阅列表 -->
        <h3 class="text-lg font-medium text-dark mb-4">当前订阅</h3>

        <!-- 订阅项 1 -->
        <div class="subscription-card">
            <div class="flex justify-between items-start">
                <div>
                    <div class="flex items-center space-x-2">
                        <h4 class="font-medium text-dark">营销电话黑名单</h4>
                        <span class="badge-blacklist text-xs px-2 py-1 rounded">黑名单</span>
                    </div>
                    <p class="text-sm text-gray-500 mt-1">https://example.com/blocklist/telemarketing.json</p>
                    <div class="flex items-center mt-2">
                        <span class="bg-success/10 text-success text-xs px-2 py-1 rounded mr-2">已同步</span>
                        <span class="text-xs text-gray-500">最后更新: 2023-07-20 14:30</span>
                    </div>
                </div>
                <div class="relative inline-block w-12 align-middle select-none">
                    <input type="checkbox" id="phone-sub-1" checked class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-2 appearance-none cursor-pointer right-0">
                    <label for="phone-sub-1" class="toggle-label block overflow-hidden h-6 rounded-full bg-primary cursor-pointer"></label>
                </div>
            </div>
            <div class="mt-4 flex space-x-3">
                <button class="bg-primary hover:bg-opacity-90 text-white px-4 py-2 rounded-lg transition text-sm">
                    <i class="fas fa-sync-alt mr-2"></i>立即同步
                </button>
                <button class="border border-primary text-primary hover:bg-primary/10 px-4 py-2 rounded-lg transition text-sm">
                    <i class="fas fa-cog mr-2"></i>设置
                </button>
                <button class="border border-danger text-danger hover:bg-danger/10 px-4 py-2 rounded-lg transition text-sm ml-auto">
                    <i class="fas fa-trash-alt mr-2"></i>删除
                </button>
            </div>
        </div>
    </main>
</body>
</html>

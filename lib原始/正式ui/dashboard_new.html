<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
        }
        .app-frame {
            max-width: 430px;
            margin: 0 auto;
            background: white;
            position: relative;
            overflow-y: auto;
        }
        .stat-card {
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .chart-container {
            position: relative;
            margin: auto;
            height: 200px;
        }
        .ad-placeholder {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: white;
            text-align: center;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="app-frame rounded-3xl shadow-xl">
        <!-- 顶部导航 -->
        <div class="bg-white shadow-md">
            <div class="container mx-auto px-4">
                <div class="flex justify-between items-center py-4">
                    <div class="flex items-center">
                        <a href="home.html" class="text-gray-600 mr-4">
                            <i class="fas fa-arrow-left text-lg"></i>
                        </a>
                        <h1 class="text-xl font-semibold text-gray-800">数据分析</h1>
                    </div>
                    <div class="flex space-x-2">
                        <button class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-calendar text-gray-600"></i>
                        </button>
                        <button class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-bell text-gray-600"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主要内容 -->
        <div class="p-6 space-y-6">
            <!-- 总览卡片 -->
            <div class="bg-gradient-to-r from-primary to-accent rounded-2xl p-6 text-white shadow-lg">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-white/80 text-sm">本月总计</p>
                        <h2 class="text-3xl font-bold mt-1">89</h2>
                        <p class="text-sm mt-1">已拦截通讯</p>
                    </div>
                    <span class="text-white/80 bg-white/20 px-3 py-1 rounded-full text-sm">
                        +12.5%
                    </span>
                </div>
                <div class="h-[60px]">
                    <canvas id="miniChart"></canvas>
                </div>
            </div>

            <!-- 广告位 -->
            <div class="ad-placeholder">
                <p class="text-lg font-bold">Google Ad 展示位置</p>
                <p class="text-sm">这里可以集成 Google AdMob 广告</p>
            </div>

            <!-- 统计卡片网格 -->
            <div class="grid grid-cols-2 gap-4">
                <div class="stat-card bg-blue-500/10 p-4 rounded-2xl shadow-md">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-blue-500"><i class="fas fa-phone-slash"></i></span>
                        <span class="text-xs text-blue-500/70">本周</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">24</h3>
                    <p class="text-sm text-gray-600">拦截电话</p>
                </div>

                <div class="stat-card bg-purple-500/10 p-4 rounded-2xl shadow-md">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-purple-500"><i class="fas fa-comment-slash"></i></span>
                        <span class="text-xs text-purple-500/70">本周</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">56</h3>
                    <p class="text-sm text-gray-600">过滤短信</p>
                </div>

                <div class="stat-card bg-green-500/10 p-4 rounded-2xl shadow-md">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-green-500"><i class="fas fa-user-check"></i></span>
                        <span class="text-xs text-green-500/70">总计</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">15</h3>
                    <p class="text-sm text-gray-600">白名单</p>
                </div>

                <div class="stat-card bg-red-500/10 p-4 rounded-2xl shadow-md">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-red-500"><i class="fas fa-user-slash"></i></span>
                        <span class="text-xs text-red-500/70">总计</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">65</h3>
                    <p class="text-sm text-gray-600">黑名单</p>
                </div>
            </div>

            <!-- 详细图表 -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold text-gray-800">拦截趋势</h3>
                    <div class="flex space-x-2">
                        <button class="px-3 py-1 text-sm bg-primary/10 text-primary rounded-full">周</button>
                        <button class="px-3 py-1 text-sm text-gray-500 rounded-full">月</button>
                        <button class="px-3 py-1 text-sm text-gray-500 rounded-full">年</button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- 拦截类型分析 -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">拦截类型分析</h3>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-robot text-red-500 text-sm"></i>
                            </div>
                            <span class="text-gray-700">骚扰电话</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-gray-500">45%</span>
                            <div class="w-24 h-2 bg-gray-100 rounded-full overflow-hidden">
                                <div class="w-[45%] h-full bg-red-500 rounded-full"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 bg-yellow-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-ad text-yellow-500 text-sm"></i>
                            </div>
                            <span class="text-gray-700">推销电话</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-gray-500">30%</span>
                            <div class="w-24 h-2 bg-gray-100 rounded-full overflow-hidden">
                                <div class="w-[30%] h-full bg-yellow-500 rounded-full"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 bg-purple-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-comment-slash text-purple-500 text-sm"></i>
                            </div>
                            <span class="text-gray-700">垃圾短信</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-gray-500">25%</span>
                            <div class="w-24 h-2 bg-gray-100 rounded-full overflow-hidden">
                                <div class="w-[25%] h-full bg-purple-500 rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 导出数据按钮 -->
            <div class="flex justify-center">
                <button class="bg-primary text-white px-6 py-3 rounded-full shadow-lg hover:bg-primary/90 transition flex items-center">
                    <i class="fas fa-file-export mr-2"></i>
                    导出统计数据
                </button>
            </div>
        </div>

        <!-- 底部导航栏 -->
        <div class="bg-white shadow-md border-t border-gray-200 py-2">
            <div class="container mx-auto">
                <div class="flex justify-around items-center">
                    <a href="home.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                        <i class="fas fa-home text-xl"></i>
                        <span class="text-xs mt-1">首页</span>
                    </a>
                    <a href="rules_management.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                        <i class="fas fa-list-alt text-xl"></i>
                        <span class="text-xs mt-1">规则</span>
                    </a>
                    <a href="call_history.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                        <i class="fas fa-history text-xl"></i>
                        <span class="text-xs mt-1">历史</span>
                    </a>
                    <a href="settings.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                        <i class="fas fa-cog text-xl"></i>
                        <span class="text-xs mt-1">设置</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 迷你图表
        const miniCtx = document.getElementById('miniChart').getContext('2d');
        new Chart(miniCtx, {
            type: 'line',
            data: {
                labels: ['一月', '二月', '三月', '四月', '五月', '六月'],
                datasets: [{
                    data: [30, 45, 35, 50, 40, 60],
                    borderColor: 'rgba(255, 255, 255, 0.8)',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        display: false
                    },
                    y: {
                        display: false
                    }
                }
            }
        });

        // 趋势图表
        const trendCtx = document.getElementById('trendChart').getContext('2d');
        new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                datasets: [{
                    label: '拦截电话',
                    data: [12, 19, 15, 17, 14, 23, 18],
                    borderColor: '#FFB74D',
                    backgroundColor: 'rgba(255, 183, 77, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        }
                    },
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知设置 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
    <style>
        .settings-card {
            @apply bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow mb-4;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="settings.html" class="text-gray-600 hover:text-primary mr-2">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <i class="fas fa-bell text-primary text-xl"></i>
                    <h1 class="text-xl font-semibold text-dark">通知设置</h1>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-6">
        <div class="settings-card">
            <h3 class="text-lg font-medium mb-4">推送规则</h3>
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="font-medium">拦截通知</p>
                        <p class="text-sm text-gray-500">显示被拦截通话的通知</p>
                    </div>
                    <label class="relative inline-block w-12 align-middle select-none">
                        <input type="checkbox" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-2 appearance-none cursor-pointer" checked>
                        <label class="toggle-label block h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                    </label>
                </div>
                <!-- 更多设置项 -->
            </div>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>标签服务组件演示</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --gradient-start: #64B5F6;
            --gradient-end: #2196F3;
        }

        .service-card {
            width: 400px;
            margin: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            background: white;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .card-header {
            padding: 20px;
            background: linear-gradient(to right, var(--gradient-start), var(--gradient-end));
            border-radius: 16px 16px 0 0;
            color: white;
            display: flex;
            align-items: center;
        }

        .header-icon {
            font-size: 28px;
            margin-right: 15px;
        }

        .card-body {
            padding: 20px;
        }

        .labels-container {
            margin: 15px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .label-chip {
            background: #e3f2fd;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: #1976d2;
        }

        .refresh-button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            margin-left: auto;
        }

        /* 交互效果 */
        .service-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .service-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="service-card" onclick="showLabelSelection()">
        <div class="card-header">
            <i class="fas fa-phone header-icon"></i>
            <div>
                <h2>来电识别服务</h2>
                <p>识别未知来电，标记骚扰电话</p>
            </div>
            <button class="refresh-button" onclick="refreshLabels(event)">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <div class="card-body">
            <div class="labels-container">
                <span class="label-chip">快递外卖</span>
                <span class="label-chip">骚扰电话</span>
                <span class="label-chip">重要来电</span>
            </div>
        </div>
    </div>

    <script>
        function refreshLabels(e) {
            e.stopPropagation();
            alert('正在刷新标签...');
        }

        function showLabelSelection() {
            alert('打开标签选择对话框');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>规则验证 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="flex items-center">
                        <i class="fas fa-arrow-left text-gray-600 mr-4"></i>
                        <i class="fas fa-check-double text-primary text-xl mr-2"></i>
                        <span class="text-xl font-bold">规则验证</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-6">
        <div class="max-w-2xl mx-auto">
            <!-- 验证表单 -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-6">
                <h2 class="text-2xl font-bold mb-6">测试规则</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">电话号码</label>
                        <input type="tel" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" placeholder="请输入要验证的电话号码">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">国家代码</label>
                        <input type="text" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary" placeholder="请输入国家代码（如：US）" value="US">
                    </div>
                    <button class="w-full bg-primary text-white py-3 rounded-lg hover:bg-opacity-90 transition">
                        验证
                    </button>
                </div>
            </div>

            <!-- 验证结果 -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-6">
                <h3 class="text-xl font-semibold mb-4">验证结果</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <span>拒绝所有号码</span>
                        <i class="fas fa-check text-success"></i>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <span>允许白名单号码</span>
                        <i class="fas fa-times text-danger"></i>
                    </div>
                    <!-- 更多规则结果... -->
                </div>
            </div>

            <!-- 来电数据 -->
            <div class="bg-white rounded-xl shadow-md p-6 mb-6">
                <h3 class="text-xl font-semibold mb-4">来电数据</h3>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">姓名</span>
                        <span class="font-medium">John Doe</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">号码</span>
                        <span class="font-medium">+1 234 567 8900</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">国家</span>
                        <span class="font-medium">United States</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">运营商</span>
                        <span class="font-medium">Example Carrier</span>
                    </div>
                </div>
            </div>

            <!-- 测试来电显示 -->
            <button class="w-full bg-accent text-white py-3 rounded-lg hover:bg-opacity-90 transition mb-6">
                测试来电显示
            </button>
        </div>
    </div>

    <script>
        // 这里可以添加验证和测试逻辑
    </script>
</body>
</html>

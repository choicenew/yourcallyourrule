<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通配符规则 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="flex items-center">
                        <i class="fas fa-arrow-left text-gray-600 mr-4"></i>
                        <i class="fas fa-star text-primary text-xl mr-2"></i>
                        <span class="text-xl font-bold">通配符规则</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="bg-primary text-white px-4 py-2 rounded-full hover:bg-opacity-90 transition">
                        <i class="fas fa-plus mr-2"></i>添加
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-6">
        <!-- 搜索栏 -->
        <div class="mb-6">
            <div class="relative">
                <input type="text" placeholder="搜索规则..." class="w-full px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                <button class="absolute right-3 top-3 text-gray-500 hover:text-primary">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="flex flex-wrap gap-2 mb-6">
            <button class="bg-white text-gray-700 px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition flex items-center">
                <i class="fas fa-file-export text-gray-600 mr-2"></i>导出
            </button>
            <button class="bg-white text-gray-700 px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition flex items-center">
                <i class="fas fa-file-import text-gray-600 mr-2"></i>导入
            </button>
            <button class="bg-white text-gray-700 px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition flex items-center">
                <i class="fas fa-trash text-danger mr-2"></i>清空
            </button>
            <button class="bg-white text-gray-700 px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition flex items-center">
                <i class="fas fa-vial text-info mr-2"></i>测试
            </button>
        </div>

        <!-- 规则列表 -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="font-semibold">规则列表</h3>
                <span class="text-sm text-gray-600">共 12 条规则</span>
            </div>
            <div class="divide-y divide-gray-100">
                <!-- 规则项目 -->
                <div class="p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="flex items-center">
                                <span class="font-medium">^\+1.*</span>
                                <span class="ml-3 px-2 py-1 bg-success text-white text-xs rounded-full">白名单</span>
                            </div>
                            <div class="text-sm text-gray-600 mt-1">匹配所有美国号码</div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button class="text-gray-500 hover:text-primary transition">
                                <i class="fas fa-toggle-on"></i>
                            </button>
                            <button class="text-gray-500 hover:text-primary transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="text-danger hover:text-opacity-80 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="flex items-center">
                                <span class="font-medium">^\d{3}456.*</span>
                                <span class="ml-3 px-2 py-1 bg-danger text-white text-xs rounded-full">黑名单</span>
                            </div>
                            <div class="text-sm text-gray-600 mt-1">匹配特定前缀号码</div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button class="text-gray-500 hover:text-primary transition">
                                <i class="fas fa-toggle-on"></i>
                            </button>
                            <button class="text-gray-500 hover:text-primary transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="text-danger hover:text-opacity-80 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加规则模态框 -->
    <div class="fixed inset-0 bg-black bg-opacity-50 hidden" id="add-rule-modal">
        <div class="bg-white rounded-xl max-w-md mx-auto mt-20 overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b border-gray-200">
                <h3 class="text-lg font-bold">添加规则</h3>
                <button class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">规则名称</label>
                    <input type="text" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">规则模式</label>
                    <input type="text" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">规则类型</label>
                    <div class="flex space-x-4">
                        <label class="flex items-center">
                            <input type="radio" name="rule-type" class="mr-2">
                            <span>白名单</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="rule-type" class="mr-2">
                            <span>黑名单</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 flex justify-end">
                <button class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg mr-2 hover:bg-gray-300 transition">取消</button>
                <button class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-opacity-90 transition">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 这里可以添加交互逻辑
    </script>
</body>
</html>

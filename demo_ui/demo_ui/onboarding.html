<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎使用 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 欢迎页面 -->
    <div class="min-h-screen flex flex-col">
        <!-- 语言选择 -->
        <div class="flex-1 flex flex-col items-center justify-center p-8">
            <div class="text-4xl font-bold text-primary mb-8">Your Call Your Rule</div>
            
            <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full mb-8">
                <h2 class="text-2xl font-semibold mb-6 text-center">选择语言</h2>
                <select class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                    <option value="zh">简体中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                </select>
            </div>

            <!-- 功能介绍轮播 -->
            <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full mb-8">
                <div class="text-center">
                    <i class="fas fa-shield-alt text-6xl text-primary mb-4"></i>
                    <h3 class="text-xl font-semibold mb-2">智能来电防护</h3>
                    <p class="text-gray-600">自动识别和拦截骚扰电话，保护您的通话安全</p>
                </div>
            </div>

            <!-- 权限请求 -->
            <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full mb-8">
                <h2 class="text-2xl font-semibold mb-6">所需权限</h2>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="font-medium">悬浮窗权限</h3>
                            <p class="text-sm text-gray-500">用于显示来电信息</p>
                        </div>
                        <button class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-opacity-90">
                            授权
                        </button>
                    </div>
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="font-medium">默认来电识别应用</h3>
                            <p class="text-sm text-gray-500">用于识别和拦截来电</p>
                        </div>
                        <button class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-opacity-90">
                            设置
                        </button>
                    </div>
                </div>
            </div>

            <!-- 开始使用按钮 -->
            <button class="bg-primary text-white px-8 py-3 rounded-full text-lg font-semibold hover:bg-opacity-90 transition shadow-lg">
                开始使用
            </button>
        </div>
    </div>

    <script>
        // 这里可以添加页面切换和权限请求的逻辑
    </script>
</body>
</html>

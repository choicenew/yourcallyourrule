<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云同步设置 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
    <style>
        .toggle-checkbox:checked {
            right: 0;
            border-color: #FFB74D;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #FFB74D;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="flex items-center">
                        <i class="fas fa-arrow-left text-gray-600 mr-4"></i>
                        <i class="fas fa-cloud text-secondary text-xl mr-2"></i>
                        <span class="text-xl font-bold">云同步设置</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="bg-primary text-white px-4 py-2 rounded-full hover:bg-opacity-90 transition">
                        <i class="fas fa-save mr-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-6">
        <!-- 云同步开关 -->
        <div class="bg-white rounded-xl shadow-md p-4 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-semibold">启用云同步</h2>
                    <p class="text-gray-600 text-sm">开启后将自动同步您的规则和设置</p>
                </div>
                <div class="relative inline-block w-14 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="cloud-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer right-8">
                    <label for="cloud-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                </div>
            </div>
        </div>

        <!-- 云服务选择 -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
            <div class="p-4 border-b border-gray-100 bg-gray-50">
                <h3 class="font-semibold">选择云服务提供商</h3>
            </div>
            <div class="p-4">
                <div class="space-y-4">
                    <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition cursor-pointer">
                        <input type="radio" name="cloud-provider" class="mr-3">
                        <div class="flex items-center">
                            <div class="bg-blue-500 bg-opacity-10 p-2 rounded-full mr-3">
                                <i class="fab fa-google-drive text-blue-500 text-xl"></i>
                            </div>
                            <div>
                                <div class="font-medium">Google Drive</div>
                                <div class="text-sm text-gray-600">使用Google账号同步数据</div>
                            </div>
                        </div>
                    </label>
                    <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition cursor-pointer">
                        <input type="radio" name="cloud-provider" class="mr-3">
                        <div class="flex items-center">
                            <div class="bg-blue-600 bg-opacity-10 p-2 rounded-full mr-3">
                                <i class="fab fa-microsoft text-blue-600 text-xl"></i>
                            </div>
                            <div>
                                <div class="font-medium">OneDrive</div>
                                <div class="text-sm text-gray-600">使用Microsoft账号同步数据</div>
                            </div>
                        </div>
                    </label>
                    <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition cursor-pointer">
                        <input type="radio" name="cloud-provider" class="mr-3" checked>
                        <div class="flex items-center">
                            <div class="bg-green-500 bg-opacity-10 p-2 rounded-full mr-3">
                                <i class="fas fa-server text-green-500 text-xl"></i>
                            </div>
                            <div>
                                <div class="font-medium">WebDAV</div>
                                <div class="text-sm text-gray-600">连接到自定义WebDAV服务器</div>
                            </div>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- WebDAV 设置 -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
            <div class="p-4 border-b border-gray-100 bg-gray-50">
                <h3 class="font-semibold">WebDAV 服务器设置</h3>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">服务器地址</label>
                    <input type="text" placeholder="https://example.com/webdav/" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                    <input type="text" placeholder="用户名" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                    <input type="password" placeholder="密码" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                </div>
                <div>
                    <button class="bg-info text-white px-4 py-2 rounded-lg hover:bg-opacity-90 transition">
                        <i class="fas fa-check-circle mr-2"></i>测试连接
                    </button>
                </div>
            </div>
        </div>

        <!-- 同步选项 -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
            <div class="p-4 border-b border-gray-100 bg-gray-50">
                <h3 class="font-semibold">同步选项</h3>
            </div>
            <div class="p-4 space-y-4">
                <div class="flex justify-between items-center">
                    <div>
                        <div class="font-medium">自动同步</div>
                        <div class="text-sm text-gray-600">应用启动和规则变更时自动同步</div>
                    </div>
                    <div class="relative inline-block w-12 align-middle select-none">
                        <input type="checkbox" name="toggle" id="auto-sync-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7" checked>
                        <label for="auto-sync-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-primary cursor-pointer"></label>
                    </div>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <div class="font-medium">仅在WiFi下同步</div>
                        <div class="text-sm text-gray-600">节省移动数据流量</div>
                    </div>
                    <div class="relative inline-block w-12 align-middle select-none">
                        <input type="checkbox" name="toggle" id="wifi-sync-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7" checked>
                        <label for="wifi-sync-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-primary cursor-pointer"></label>
                    </div>
                </div>
                <div class="flex justify-between items-center">
                    <div>
                        <div class="font-medium">同步通话记录</div>
                        <div class="text-sm text-gray-600">包括拦截的通话记录</div>
                    </div>
                    <div class="relative inline-block w-12 align-middle select-none">
                        <input type="checkbox" name="toggle" id="call-log-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7">
                        <label for="call-log-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-primary cursor-pointer"></label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 备份与恢复 -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
            <div class="p-4 border-b border-gray-100 bg-gray-50">
                <h3 class="font-semibold">备份与恢复</h3>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <button class="w-full bg-secondary text-white px-4 py-3 rounded-lg hover:bg-opacity-90 transition mb-3">
                        <i class="fas fa-cloud-upload-alt mr-2"></i>立即备份
                    </button>
                    <div class="text-sm text-gray-600">上次备份时间: 2023-06-15 14:30:45</div>
                </div>
                <div class="border-t border-gray-100 pt-4">
                    <button class="w-full bg-accent text-white px-4 py-3 rounded-lg hover:bg-opacity-90 transition mb-3">
                        <i class="fas fa-cloud-download-alt mr-2"></i>从云端恢复
                    </button>
                    <div class="text-sm text-gray-600">云端有3个可用备份</div>
                </div>
            </div>
        </div>

        <!-- 设备管理 -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                <h3 class="font-semibold">设备管理</h3>
                <span class="text-sm text-gray-600">共 2 台设备</span>
            </div>
            <div class="divide-y divide-gray-100">
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="bg-success bg-opacity-10 p-2 rounded-full mr-3">
                            <i class="fas fa-mobile-alt text-success text-xl"></i>
                        </div>
                        <div>
                            <div class="font-medium">当前设备</div>
                            <div class="text-sm text-gray-600">Xiaomi 12 Pro</div>
                        </div>
                    </div>
                    <div class="text-xs bg-success bg-opacity-10 text-success px-2 py-1 rounded-full">
                        在线
                    </div>
                </div>
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="bg-gray-400 bg-opacity-10 p-2 rounded-full mr-3">
                            <i class="fas fa-mobile-alt text-gray-400 text-xl"></i>
                        </div>
                        <div>
                            <div class="font-medium">Samsung Galaxy S21</div>
                            <div class="text-sm text-gray-600">上次同步: 3天前</div>
                        </div>
                    </div>
                    <button class="text-danger hover:text-opacity-80 transition">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-md border-t border-gray-200">
        <div class="container mx-auto">
            <div class="flex justify-around items-center py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="blacklist.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-list-alt text-xl"></i>
                    <span class="text-xs mt-1">规则</span>
                </a>
                <a href="#" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">历史</span>
                </a>
                <a href="#" class="flex flex-col items-center text-primary">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 云同步开关逻辑
            const cloudToggle = document.getElementById('cloud-toggle');
            const providerSection = document.querySelector('.bg-white.rounded-xl.shadow-md.overflow-hidden.mb-6');
            const webdavSection = document.querySelectorAll('.bg-white.rounded-xl.shadow-md.overflow-hidden.mb-6')[1];
            const syncOptionsSection = document.querySelectorAll('.bg-white.rounded-xl.shadow-md.overflow-hidden.mb-6')[2];
            const backupSection = document.querySelectorAll('.bg-white.rounded-xl.shadow-md.overflow-hidden.mb-6')[3];
            const deviceSection = document.querySelectorAll('.bg-white.rounded-xl.shadow-md.overflow-hidden.mb-6')[4];
            
            function updateSections() {
                const isEnabled = cloudToggle.checked;
                providerSection.style.display = isEnabled ? 'block' : 'none';
                webdavSection.style.display = isEnabled ? 'block' : 'none';
                syncOptionsSection.style.display = isEnabled ? 'block' : 'none';
                backupSection.style.display = isEnabled ? 'block' : 'none';
                deviceSection.style.display = isEnabled ? 'block' : 'none';
            }
            
            // 初始状态
            updateSections();
            
            // 监听开关变化
            cloudToggle.addEventListener('change', updateSections);
        });
    </script>
</body>
</html>

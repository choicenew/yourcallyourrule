<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通话记录 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="flex items-center">
                        <i class="fas fa-arrow-left text-gray-600 mr-4"></i>
                        <i class="fas fa-history text-info text-xl mr-2"></i>
                        <span class="text-xl font-bold">通话记录</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-gray-600 hover:text-primary transition">
                        <i class="fas fa-filter"></i>
                    </button>
                </div>
                <div class="absolute w-2 h-2 bg-gray-300 rounded-full -left-4" style="top: 3.3rem"></div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-6">
        <!-- 统计卡片 -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="relative mb-8 pl-6 timeline-item">
                <div class="absolute w-3 h-3 bg-primary rounded-full -left-5 top-5"></div>
                <div class="bg-white rounded-xl p-4 shadow-sm relative">
                <div class="text-center">
                    <div class="text-2xl font-bold text-danger">128</div>
                    <div class="text-sm text-gray-600">已拦截</div>
                </div>
                <div class="absolute w-2 h-2 bg-gray-300 rounded-full -left-4" style="top: 3.3rem"></div>
            </div>
            <div class="relative mb-8 pl-6 timeline-item">
                <div class="absolute w-3 h-3 bg-primary rounded-full -left-5 top-5"></div>
                <div class="bg-white rounded-xl p-4 shadow-sm relative">
                <div class="text-center">
                    <div class="text-2xl font-bold text-success">256</div>
                    <div class="text-sm text-gray-600">已接通</div>
                </div>
                <div class="absolute w-2 h-2 bg-gray-300 rounded-full -left-4" style="top: 3.3rem"></div>
            </div>
        </div>

        <!-- 时间轴布局 -->
        <div class="relative pl-8 border-l-2 border-gray-200 ml-4">
            <div class="absolute w-4 h-4 bg-primary rounded-full -left-5" style="top: 2.5rem"></div>
            <!-- 日期分组 -->
            <div class="text-sm text-gray-600 mb-2">今天</div>

            <!-- 通话记录项 -->
            <div class="relative mb-8 pl-6 timeline-item">
                <div class="absolute w-3 h-3 bg-primary rounded-full -left-5 top-5"></div>
                <div class="bg-white rounded-xl p-4 shadow-sm relative">
                <div class="flex justify-between items-start">
                    <div class="flex items-start space-x-4">
                        <div class="bg-danger bg-opacity-10 p-3 rounded-full">
                            <i class="fas fa-ban text-danger"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold">+86 13800138000</h3>
                            <p class="text-sm text-gray-600">骚扰电话</p>
                            <p class="text-xs text-gray-400 mt-1">14:30</p>
                        </div>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-danger text-sm">已拦截</span>
                        <div class="flex mt-2 space-x-2">
                            <button class="text-gray-400 hover:text-primary transition">
                                <i class="fas fa-info-circle"></i>
                            </button>
                            <button class="text-gray-400 hover:text-danger transition">
                                <i class="fas fa-ban"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="absolute w-2 h-2 bg-gray-300 rounded-full -left-4" style="top: 3.3rem"></div>
            </div>

            <div class="relative mb-8 pl-6 timeline-item">
                <div class="absolute w-3 h-3 bg-primary rounded-full -left-5 top-5"></div>
                <div class="bg-white rounded-xl p-4 shadow-sm relative">
                <div class="flex justify-between items-start">
                    <div class="flex items-start space-x-4">
                        <div class="bg-success bg-opacity-10 p-3 rounded-full">
                            <i class="fas fa-phone text-success"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold">+86 13900139000</h3>
                            <p class="text-sm text-gray-600">未知号码</p>
                            <p class="text-xs text-gray-400 mt-1">13:45</p>
                        </div>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-success text-sm">已接通</span>
                        <div class="flex mt-2 space-x-2">
                            <button class="text-gray-400 hover:text-primary transition">
                                <i class="fas fa-info-circle"></i>
                            </button>
                            <button class="text-gray-400 hover:text-danger transition">
                                <i class="fas fa-ban"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="absolute w-2 h-2 bg-gray-300 rounded-full -left-4" style="top: 3.3rem"></div>
            </div>

            <!-- 日期分组 -->
            <div class="text-sm text-gray-600 mb-2 mt-6">昨天</div>

            <!-- 更多通话记录... -->
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-md border-t border-gray-200">
        <div class="container mx-auto">
            <div class="flex justify-around items-center py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="blacklist.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-list-alt text-xl"></i>
                    <span class="text-xs mt-1">规则</span>
                </a>
                <a href="call_history.html" class="flex flex-col items-center text-primary">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">历史</span>
                </a>
                <a href="settings.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

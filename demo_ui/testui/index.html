<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
    <style>
        .function-card {
            @apply bg-white rounded-xl p-6 shadow-sm hover:shadow-md transition-all duration-300 hover:scale-105;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #FFB74D;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #FFB74D;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-shield-alt text-primary text-2xl"></i>
                    <span class="text-xl font-bold">Your Call Your Rule</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-gray-600 hover:text-primary transition">
                        <i class="fas fa-bell text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-6">
        <!-- 状态卡片 -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-semibold">拦截保护</h2>
                    <p class="text-gray-600 text-sm">保护您免受骚扰电话的打扰</p>
                </div>
                <div class="relative inline-block w-14 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="protection-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer right-8" checked>
                    <label for="protection-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                </div>
            </div>
        </div>

        <!-- 功能卡片网格 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 黑名单 -->
            <a href="blacklist.html" class="function-card">
                <div class="flex items-center mb-4">
                    <div class="bg-danger bg-opacity-10 p-3 rounded-full mr-4">
                        <i class="fas fa-ban text-danger text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold">黑名单</h3>
                        <p class="text-gray-600 text-sm">已拦截 128 个号码</p>
                    </div>
                </div>
            </a>

            <!-- 白名单 -->
            <a href="whitelist.html" class="function-card">
                <div class="flex items-center mb-4">
                    <div class="bg-success bg-opacity-10 p-3 rounded-full mr-4">
                        <i class="fas fa-check-circle text-success text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold">白名单</h3>
                        <p class="text-gray-600 text-sm">已允许 45 个号码</p>
                    </div>
                </div>
            </a>

            <!-- 通话记录 -->
            <a href="call_history.html" class="function-card">
                <div class="flex items-center mb-4">
                    <div class="bg-info bg-opacity-10 p-3 rounded-full mr-4">
                        <i class="fas fa-history text-info text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold">通话记录</h3>
                        <p class="text-gray-600 text-sm">今日拦截 12 通</p>
                    </div>
                </div>
            </a>

            <!-- 联系人 -->
            <a href="contacts.html" class="function-card">
                <div class="flex items-center mb-4">
                    <div class="bg-accent bg-opacity-10 p-3 rounded-full mr-4">
                        <i class="fas fa-address-book text-accent text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold">联系人</h3>
                        <p class="text-gray-600 text-sm">管理您的联系人</p>
                    </div>
                </div>
            </a>

            <!-- 订阅服务 -->
            <a href="subscription.html" class="function-card">
                <div class="flex items-center mb-4">
                    <div class="bg-warning bg-opacity-10 p-3 rounded-full mr-4">
                        <i class="fas fa-star text-warning text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold">订阅服务</h3>
                        <p class="text-gray-600 text-sm">解锁高级功能</p>
                    </div>
                </div>
            </a>

            <!-- 设置 -->
            <a href="settings.html" class="function-card">
                <div class="flex items-center mb-4">
                    <div class="bg-secondary bg-opacity-10 p-3 rounded-full mr-4">
                        <i class="fas fa-cog text-secondary text-xl"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold">设置</h3>
                        <p class="text-gray-600 text-sm">自定义您的偏好</p>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-md border-t border-gray-200">
        <div class="container mx-auto">
            <div class="flex justify-around items-center py-3">
                <a href="index.html" class="flex flex-col items-center text-primary">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="blacklist.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-list-alt text-xl"></i>
                    <span class="text-xs mt-1">规则</span>
                </a>
                <a href="call_history.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">历史</span>
                </a>
                <a href="settings.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

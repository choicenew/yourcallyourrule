<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
    <style>
        .settings-card {
            @apply bg-white rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #FFB74D;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #FFB74D;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="flex items-center">
                        <i class="fas fa-arrow-left text-gray-600 mr-4"></i>
                        <i class="fas fa-cog text-secondary text-xl mr-2"></i>
                        <span class="text-xl font-bold">设置</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-6">
        <!-- 账号信息 -->
        <div class="settings-card mb-6">
            <div class="flex items-center space-x-4">
                <div class="w-16 h-16 bg-primary bg-opacity-10 rounded-full flex items-center justify-center">
                    <i class="fas fa-user text-primary text-2xl"></i>
                </div>
                <div>
                    <h2 class="text-lg font-semibold">用户123456</h2>
                    <p class="text-gray-600">免费版用户</p>
                </div>
                <button class="ml-auto text-primary hover:text-opacity-80 transition">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- 云同步设置 -->
            <div class="settings-card">
                <h3 class="text-lg font-semibold mb-4"><i class="fas fa-cloud mr-2 text-info"></i>云同步设置</h3>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h4 class="font-medium">自动同步</h4>
                            <p class="text-sm text-gray-600">每24小时自动同步数据到云端</p>
                        </div>
                        <div class="relative inline-block w-10 mr-2 align-middle select-none">
                            <input type="checkbox" id="auto-sync" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-2 appearance-none cursor-pointer">
                            <label for="auto-sync" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                        </div>
                    </div>

                    <div class="flex justify-between items-center">
                        <div>
                            <h4 class="font-medium">立即同步</h4>
                            <p class="text-sm text-gray-600">最后一次同步：3小时前</p>
                        </div>
                        <button class="bg-info text-white px-4 py-2 rounded-full hover:bg-opacity-90 transition flex items-center">
                            <i class="fas fa-sync-alt mr-2"></i>立即同步
                        </button>
                    </div>

                    <div class="border-t border-gray-200 pt-4 mt-4">
                        <div class="flex items-center space-x-3 text-sm">
                            <i class="fas fa-database text-secondary"></i>
                            <span>已用存储空间：<span class="font-medium">256MB</span>/1GB</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 更多设置项... -->

        <!-- 通知设置 -->
        <div class="settings-card mb-6">
            <div class="flex items-center space-x-3 mb-4">
                <i class="fas fa-bell text-primary text-xl"></i>
                <span class="font-semibold">通知设置</span>
            </div>
            <div class="space-y-4">
                <div class="flex justify-between items-center py-2 border-t border-gray-100">
                    <span class="text-gray-600">拦截通知</span>
                    <div class="relative inline-block w-12 align-middle select-none">
                        <input type="checkbox" name="toggle" id="block-notification" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7" checked>
                        <label for="block-notification" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                </div>
                <div class="flex justify-between items-center py-2 border-t border-gray-100">
                    <span class="text-gray-600">来电提醒</span>
                    <div class="relative inline-block w-12 align-middle select-none">
                        <input type="checkbox" name="toggle" id="call-notification" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7" checked>
                        <label for="call-notification" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 其他设置 -->
        <div class="settings-card mb-6">
            <div class="space-y-4">
                <a href="#" class="flex justify-between items-center py-2">
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-language text-primary text-xl"></i>
                        <span class="text-gray-600">语言设置</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-gray-600">简体中文</span>
                        <i class="fas fa-chevron-right text-gray-400"></i>
                    </div>
                </a>
                <a href="#" class="flex justify-between items-center py-2 border-t border-gray-100">
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-shield-alt text-primary text-xl"></i>
                        <span class="text-gray-600">隐私政策</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </a>
                <a href="#" class="flex justify-between items-center py-2 border-t border-gray-100">
                    <div class="flex items-center space-x-3">
                        <i class="fas fa-info-circle text-primary text-xl"></i>
                        <span class="text-gray-600">关于我们</span>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </a>
            </div>
        </div>

        <!-- 退出登录 -->
        <button class="w-full bg-danger bg-opacity-10 text-danger py-3 rounded-xl hover:bg-opacity-20 transition">
            退出登录
        </button>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-md border-t border-gray-200">
        <div class="container mx-auto">
            <div class="flex justify-around items-center py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="blacklist.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-list-alt text-xl"></i>
                    <span class="text-xs mt-1">规则</span>
                </a>
                <a href="call_history.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">历史</span>
                </a>
                <a href="settings.html" class="flex flex-col items-center text-primary">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 云同步设置的显示/隐藏
        const cloudToggle = document.getElementById('cloud-toggle');
        const cloudSettings = document.getElementById('cloud-settings');

        function updateCloudSettings() {
            cloudSettings.style.display = cloudToggle.checked ? 'block' : 'none';
        }

        // 初始状态
        updateCloudSettings();

        // 监听开关变化
        cloudToggle.addEventListener('change', updateCloudSettings);
    </script>
</body>
</html>

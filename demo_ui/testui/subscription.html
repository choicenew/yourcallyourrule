<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订阅服务 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
    <style>
        .subscription-card {
            @apply bg-white rounded-xl p-6 shadow-sm hover:shadow-md transition-all duration-300;
        }
        .feature-item {
            @apply flex items-center space-x-3 text-gray-600;
        }
        .feature-item i {
            @apply text-primary;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="flex items-center">
                        <i class="fas fa-arrow-left text-gray-600 mr-4"></i>
                        <i class="fas fa-star text-warning text-xl mr-2"></i>
                        <span class="text-xl font-bold">订阅服务</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-6">
        <!-- 会员状态卡片 -->
        <div class="bg-gradient-to-r from-primary to-warning rounded-xl p-6 text-white mb-8">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-2xl font-bold">免费版用户</h2>
                    <p class="opacity-90">升级会员获取更多功能</p>
                </div>
                <i class="fas fa-crown text-4xl"></i>
            </div>
        </div>

        <!-- 订阅计划 -->
        <div class="space-y-6">
            <!-- 月度会员 -->
            <div class="subscription-card relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-primary text-white px-4 py-1 rounded-bl-xl text-sm">
                    推荐
                </div>
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h3 class="text-xl font-bold">月度会员</h3>
                        <p class="text-gray-600">每月仅需 ¥18</p>
                    </div>
                    <button class="bg-primary text-white px-6 py-2 rounded-full hover:bg-opacity-90 transition">
                        立即订阅
                    </button>
                </div>
                <div class="space-y-3">
                    <div class="feature-item">
                        <i class="fas fa-check-circle"></i>
                        <span>无限制黑名单</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-check-circle"></i>
                        <span>高级拦截规则</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-check-circle"></i>
                        <span>云端同步</span>
                    </div>
                </div>
            </div>

            <!-- 年度会员 -->
            <div class="subscription-card">
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h3 class="text-xl font-bold">年度会员</h3>
                        <p class="text-gray-600">年付优惠 ¥158</p>
                    </div>
                    <button class="bg-gray-100 text-gray-700 px-6 py-2 rounded-full hover:bg-gray-200 transition">
                        立即订阅
                    </button>
                </div>
                <div class="space-y-3">
                    <div class="feature-item">
                        <i class="fas fa-check-circle"></i>
                        <span>包含所有月度会员特权</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-check-circle"></i>
                        <span>专属客服支持</span>
                    </div>
                    <div class="feature-item">
                        <i class="fas fa-check-circle"></i>
                        <span>节省 ¥58</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 会员特权 -->
        <div class="mt-8">
            <h2 class="text-lg font-semibold mb-4">会员特权</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white rounded-xl p-4 text-center">
                    <div class="bg-primary bg-opacity-10 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-shield-alt text-primary text-xl"></i>
                    </div>
                    <h3 class="font-semibold">高级防护</h3>
                    <p class="text-sm text-gray-600">智能识别骚扰电话</p>
                </div>
                <div class="bg-white rounded-xl p-4 text-center">
                    <div class="bg-warning bg-opacity-10 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-cloud text-warning text-xl"></i>
                    </div>
                    <h3 class="font-semibold">云端备份</h3>
                    <p class="text-sm text-gray-600">数据安全同步</p>
                </div>
                <div class="bg-white rounded-xl p-4 text-center">
                    <div class="bg-success bg-opacity-10 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-cog text-success text-xl"></i>
                    </div>
                    <h3 class="font-semibold">高级设置</h3>
                    <p class="text-sm text-gray-600">自定义拦截规则</p>
                </div>
                <div class="bg-white rounded-xl p-4 text-center">
                    <div class="bg-info bg-opacity-10 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-headset text-info text-xl"></i>
                    </div>
                    <h3 class="font-semibold">专属客服</h3>
                    <p class="text-sm text-gray-600">优先响应服务</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-md border-t border-gray-200">
        <div class="container mx-auto">
            <div class="flex justify-around items-center py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="blacklist.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-list-alt text-xl"></i>
                    <span class="text-xs mt-1">规则</span>
                </a>
                <a href="call_history.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">历史</span>
                </a>
                <a href="settings.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

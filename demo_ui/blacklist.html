<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑名单管理 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#93CB80',
                        secondary: '#4A6572',
                        accent: '#F9AA33',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
    <style>
        .toggle-checkbox:checked {
            right: 0;
            border-color: #93CB80;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #93CB80;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="flex items-center">
                        <i class="fas fa-arrow-left text-gray-600 mr-4"></i>
                        <i class="fas fa-ban text-primary text-xl mr-2"></i>
                        <span class="text-xl font-bold">黑名单管理</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="bg-primary text-white px-4 py-2 rounded-full hover:bg-opacity-90 transition">
                        <i class="fas fa-plus mr-2"></i>添加
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-6">
        <!-- 搜索栏 -->
        <div class="mb-6">
            <div class="relative">
                <input type="text" placeholder="搜索黑名单号码..." class="w-full px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                <button class="absolute right-3 top-3 text-gray-500 hover:text-primary">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="flex flex-wrap gap-2 mb-6">
            <button class="bg-white text-gray-700 px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition flex items-center">
                <i class="fas fa-file-export text-gray-600 mr-2"></i>导出
            </button>
            <button class="bg-white text-gray-700 px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition flex items-center">
                <i class="fas fa-file-import text-gray-600 mr-2"></i>导入
            </button>
            <button class="bg-white text-gray-700 px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50 transition flex items-center">
                <i class="fas fa-trash text-danger mr-2"></i>清空
            </button>
            <div class="ml-auto flex items-center">
                <span class="text-gray-600 mr-2">启用黑名单</span>
                <div class="relative inline-block w-12 align-middle select-none">
                    <input type="checkbox" name="toggle" id="blacklist-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7" checked>
                    <label for="blacklist-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-primary cursor-pointer"></label>
                </div>
            </div>
        </div>

        <!-- 黑名单列表 -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="font-semibold">黑名单列表</h3>
                <span class="text-sm text-gray-600">共 24 个号码</span>
            </div>
            <div class="divide-y divide-gray-100">
                <!-- 黑名单项目 -->
                <div class="p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="flex items-center">
                                <i class="fas fa-phone text-gray-500 mr-2"></i>
                                <span class="font-medium">13800138000</span>
                            </div>
                            <div class="text-sm text-gray-600 mt-1 ml-6">骚扰电话</div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button class="text-gray-500 hover:text-primary transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="text-danger hover:text-opacity-80 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="flex items-center">
                                <i class="fas fa-phone text-gray-500 mr-2"></i>
                                <span class="font-medium">13900139000</span>
                            </div>
                            <div class="text-sm text-gray-600 mt-1 ml-6">推销电话</div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button class="text-gray-500 hover:text-primary transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="text-danger hover:text-opacity-80 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="flex items-center">
                                <i class="fas fa-phone text-gray-500 mr-2"></i>
                                <span class="font-medium">13700137000</span>
                            </div>
                            <div class="text-sm text-gray-600 mt-1 ml-6">诈骗电话</div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button class="text-gray-500 hover:text-primary transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="text-danger hover:text-opacity-80 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="flex items-center">
                                <i class="fas fa-phone text-gray-500 mr-2"></i>
                                <span class="font-medium">13600136000</span>
                            </div>
                            <div class="text-sm text-gray-600 mt-1 ml-6">广告电话</div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button class="text-gray-500 hover:text-primary transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="text-danger hover:text-opacity-80 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-center">
                        <div>
                            <div class="flex items-center">
                                <i class="fas fa-phone text-gray-500 mr-2"></i>
                                <span class="font-medium">13500135000</span>
                            </div>
                            <div class="text-sm text-gray-600 mt-1 ml-6">骚扰电话</div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button class="text-gray-500 hover:text-primary transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="text-danger hover:text-opacity-80 transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加黑名单模态框 (默认隐藏) -->
        <div class="fixed inset-0 bg-black bg-opacity-50 hidden" id="add-blacklist-modal">
            <div class="bg-white rounded-xl max-w-md mx-auto mt-20 overflow-hidden">
                <div class="flex justify-between items-center p-4 border-b border-gray-200">
                    <h3 class="text-lg font-bold">添加黑名单</h3>
                    <button class="text-gray-500 hover:text-gray-700" id="close-modal">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="p-4">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">电话号码</label>
                        <input type="text" placeholder="请输入电话号码" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">备注</label>
                        <input type="text" placeholder="请输入备注信息" class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">拦截方式</label>
                        <div class="flex space-x-4">
                            <label class="flex items-center">
                                <input type="radio" name="block-type" class="mr-2" checked>
                                <span>挂断</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="block-type" class="mr-2">
                                <span>静音</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="block-type" class="mr-2">
                                <span>拒接</span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="p-4 border-t border-gray-200 flex justify-end">
                    <button class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg mr-2 hover:bg-gray-300 transition" id="cancel-modal">取消</button>
                    <button class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-opacity-90 transition">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-md border-t border-gray-200">
        <div class="container mx-auto">
            <div class="flex justify-around items-center py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="#" class="flex flex-col items-center text-primary">
                    <i class="fas fa-list-alt text-xl"></i>
                    <span class="text-xs mt-1">规则</span>
                </a>
                <a href="#" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">历史</span>
                </a>
                <a href="#" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 简单的交互逻辑
        document.addEventListener('DOMContentLoaded', function() {
            // 获取添加按钮
            const addButton = document.querySelector('nav button');
            const modal = document.getElementById('add-blacklist-modal');
            const closeButton = document.getElementById('close-modal');
            const cancelButton = document.getElementById('cancel-modal');
            
            // 添加按钮点击事件
            if (addButton) {
                addButton.addEventListener('click', function() {
                    if (modal) {
                        modal.classList.remove('hidden');
                    }
                });
            }
            
            // 关闭按钮点击事件
            if (closeButton) {
                closeButton.addEventListener('click', function() {
                    if (modal) {
                        modal.classList.add('hidden');
                    }
                });
            }
            
            // 取消按钮点击事件
            if (cancelButton) {
                cancelButton.addEventListener('click', function() {
                    if (modal) {
                        modal.classList.add('hidden');
                    }
                });
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白名单管理 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ACA6D',
                        secondary: '#FF809A',
                        accent: '#93CB80',
                        dark: '#333333',
                        light: '#F5F5F5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .card-shadow {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .contact-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .contact-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }
        .search-input:focus {
            box-shadow: 0 0 0 2px rgba(10, 202, 109, 0.2);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航栏 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <a href="index.html" class="text-gray-500 mr-4">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </a>
                    <h1 class="text-xl font-semibold text-gray-800">白名单管理</h1>
                </div>
                <div>
                    <button id="addContactBtn" class="p-2 rounded-full bg-primary text-white">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 搜索栏 -->
    <div class="bg-white py-3 px-4 sticky top-14 z-10 border-b border-gray-200">
        <div class="relative max-w-md mx-auto">
            <input type="text" placeholder="搜索白名单联系人..." class="search-input w-full py-2 pl-10 pr-4 rounded-lg border border-gray-300 focus:outline-none focus:border-primary transition-all duration-300">
            <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
        </div>
    </div>

    <!-- 主要内容 -->
    <main class="container mx-auto px-4 py-6 pb-20">
        <!-- 过滤选项 -->
        <div class="flex overflow-x-auto pb-2 mb-4 gap-2">
            <button class="whitespace-nowrap px-4 py-2 bg-primary text-white rounded-full text-sm font-medium">
                全部
            </button>
            <button class="whitespace-nowrap px-4 py-2 bg-white text-gray-700 rounded-full text-sm font-medium border border-gray-300">
                联系人
            </button>
            <button class="whitespace-nowrap px-4 py-2 bg-white text-gray-700 rounded-full text-sm font-medium border border-gray-300">
                家人
            </button>
            <button class="whitespace-nowrap px-4 py-2 bg-white text-gray-700 rounded-full text-sm font-medium border border-gray-300">
                朋友
            </button>
            <button class="whitespace-nowrap px-4 py-2 bg-white text-gray-700 rounded-full text-sm font-medium border border-gray-300">
                工作
            </button>
        </div>

        <!-- 白名单列表 -->
        <div class="space-y-3">
            <!-- 联系人1 -->
            <div class="contact-card bg-white rounded-xl p-4 card-shadow">
                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mr-3">
                            <i class="fas fa-user-check text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-800">张三</h3>
                            <p class="text-gray-600">+86 138****1234</p>
                            <div class="flex items-center mt-1">
                                <span class="text-xs bg-green-100 text-green-600 px-2 py-0.5 rounded-full">家人</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button class="p-2 text-gray-500 hover:text-primary">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="p-2 text-gray-500 hover:text-red-500">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 联系人2 -->
            <div class="contact-card bg-white rounded-xl p-4 card-shadow">
                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mr-3">
                            <i class="fas fa-user-check text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-800">李四</h3>
                            <p class="text-gray-600">+86 159****5678</p>
                            <div class="flex items-center mt-1">
                                <span class="text-xs bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full">工作</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button class="p-2 text-gray-500 hover:text-primary">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="p-2 text-gray-500 hover:text-red-500">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 联系人3 -->
            <div class="contact-card bg-white rounded-xl p-4 card-shadow">
                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mr-3">
                            <i class="fas fa-user-check text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-800">王五</h3>
                            <p class="text-gray-600">+86 186****9012</p>
                            <div class="flex items-center mt-1">
                                <span class="text-xs bg-purple-100 text-purple-600 px-2 py-0.5 rounded-full">朋友</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button class="p-2 text-gray-500 hover:text-primary">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="p-2 text-gray-500 hover:text-red-500">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 联系人4 -->
            <div class="contact-card bg-white rounded-xl p-4 card-shadow">
                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mr-3">
                            <i class="fas fa-user-check text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold text-gray-800">赵六</h3>
                            <p class="text-gray-600">+86 177****3456</p>
                            <div class="flex items-center mt-1">
                                <span class="text-xs bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full">工作</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex space-x-2">
                        <button class="p-2 text-gray-500 hover:text-primary">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="p-2 text-gray-500 hover:text-red-500">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 导入/导出按钮 -->
        <div class="flex justify-center mt-8 space-x-4">
            <button class="flex items-center py-2 px-4 bg-white border border-gray-300 rounded-lg text-gray-700 shadow-sm hover:bg-gray-50">
                <i class="fas fa-file-import mr-2"></i>
                导入白名单
            </button>
            <button class="flex items-center py-2 px-4 bg-white border border-gray-300 rounded-lg text-gray-700 shadow-sm hover:bg-gray-50">
                <i class="fas fa-file-export mr-2"></i>
                导出白名单
            </button>
        </div>
    </main>

    <!-- 添加联系人模态框 -->
    <div id="addContactModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-xl p-5 w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-800">添加白名单联系人</h3>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">联系人类型</label>
                    <select class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
                        <option value="family">家人</option>
                        <option value="friend">朋友</option>
                        <option value="work">工作</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">电话号码</label>
                    <input type="tel" placeholder="请输入电话号码" class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">联系人姓名</label>
                    <input type="text" placeholder="请输入联系人姓名" class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
                </div>
                
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancelBtn" class="py-2 px-4 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        取消
                    </button>
                    <button type="submit" class="py-2 px-4 bg-primary text-white rounded-lg hover:bg-opacity-90">
                        添加
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2">
        <div class="container mx-auto">
            <div class="flex justify-around items-center">
                <a href="index.html" class="flex flex-col items-center text-gray-500">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="#" class="flex flex-col items-center text-primary">
                    <i class="fas fa-shield-alt text-xl"></i>
                    <span class="text-xs mt-1">拦截</span>
                </a>
                <a href="dashboard.html" class="flex flex-col items-center text-gray-500">
                    <i class="fas fa-chart-bar text-xl"></i>
                    <span class="text-xs mt-1">统计</span>
                </a>
                <a href="#" class="flex flex-col items-center text-gray-500">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </footer>

    <script>
        // 模态框控制
        const addContactBtn = document.getElementById('addContactBtn');
        const addContactModal = document.getElementById('addContactModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        
        addContactBtn.addEventListener('click', () => {
            addContactModal.classList.remove('hidden');
        });
        
        closeModalBtn.addEventListener('click', () => {
            addContactModal.classList.add('hidden');
        });
        
        cancelBtn.addEventListener('click', () => {
            addContactModal.classList.add('hidden');
        });
    </script>
</body>
</html>

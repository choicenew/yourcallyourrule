<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Call Your Rule - 仪表盘</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0ACA6D 0%, #93CB80 100%);
            min-height: 100vh;
        }
        .app-frame {
            max-width: 430px;
            height: 100vh;
            margin: 0 auto;
            background: white;
            position: relative;
            overflow-y: auto;
        }
        .stat-card {
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .chart-container {
            position: relative;
            margin: auto;
            height: 200px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="app-frame rounded-3xl shadow-2xl">
        <!-- 状态栏 -->
        <div class="bg-black text-white px-6 py-2 flex justify-between items-center text-sm">
            <span>9:41</span>
            <div class="flex items-center space-x-2">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 主要内容 -->
        <div class="p-6 space-y-6">
            <!-- 顶部导航 -->
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <button onclick="history.back()" class="text-gray-600">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </button>
                    <h1 class="text-xl font-semibold text-gray-800">数据分析</h1>
                </div>
                <div class="flex space-x-2">
                    <button class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-calendar text-gray-600"></i>
                    </button>
                    <button class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-bell text-gray-600"></i>
                    </button>
                </div>
            </div>

            <!-- 总览卡片 -->
            <div class="bg-gradient-to-r from-primary to-accent rounded-2xl p-6 text-white">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-white/80 text-sm">本月总计</p>
                        <h2 class="text-3xl font-bold mt-1">89</h2>
                        <p class="text-sm mt-1">已拦截通讯</p>
                    </div>
                    <span class="text-white/80 bg-white/20 px-3 py-1 rounded-full text-sm">
                        +12.5%
                    </span>
                </div>
                <div class="h-[60px]">
                    <canvas id="miniChart"></canvas>
                </div>
            </div>

            <!-- 统计卡片网格 -->
            <div class="grid grid-cols-2 gap-4">
                <div class="stat-card bg-blue-500/10 p-4 rounded-2xl">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-blue-500"><i class="fas fa-phone-slash"></i></span>
                        <span class="text-xs text-blue-500/70">本周</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">24</h3>
                    <p class="text-sm text-gray-600">拦截电话</p>
                </div>

                <div class="stat-card bg-purple-500/10 p-4 rounded-2xl">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-purple-500"><i class="fas fa-comment-slash"></i></span>
                        <span class="text-xs text-purple-500/70">本周</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">56</h3>
                    <p class="text-sm text-gray-600">过滤短信</p>
                </div>

                <div class="stat-card bg-green-500/10 p-4 rounded-2xl">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-green-500"><i class="fas fa-user-check"></i></span>
                        <span class="text-xs text-green-500/70">总计</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">15</h3>
                    <p class="text-sm text-gray-600">白名单</p>
                </div>

                <div class="stat-card bg-red-500/10 p-4 rounded-2xl">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-red-500"><i class="fas fa-user-slash"></i></span>
                        <span class="text-xs text-red-500/70">总计</span>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-800">65</h3>
                    <p class="text-sm text-gray-600">黑名单</p>
                </div>
            </div>

            <!-- 详细图表 -->
            <div class="bg-white rounded-2xl p-6 shadow-lg shadow-gray-100/50">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold text-gray-800">拦截趋势</h3>
                    <div class="flex space-x-2">
                        <button class="px-3 py-1 text-sm bg-primary/10 text-primary rounded-full">周</button>
                        <button class="px-3 py-1 text-sm text-gray-500 rounded-full">月</button>
                        <button class="px-3 py-1 text-sm text-gray-500 rounded-full">年</button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- 拦截类型分析 -->
            <div class="bg-white rounded-2xl p-6 shadow-lg shadow-gray-100/50">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">拦截类型分析</h3>
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-robot text-red-500 text-sm"></i>
                            </div>
                            <span class="text-gray-700">骚扰电话</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-gray-500">45%</span>
                            <div class="w-24 h-2 bg-gray-100 rounded-full overflow-hidden">
                                <div class="w-[45%] h-full bg-red-500 rounded-full"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 bg-yellow-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-ad text-yellow-500 text-sm"></i>
                            </div>
                            <span class="text-gray-700">推销电话</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-gray-500">30%</span>
                            <div class="w-24 h-2 bg-gray-100 rounded-full overflow-hidden">
                                <div class="w-[30%] h-full bg-yellow-500 rounded-full"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-8 h-8 bg-purple-100 rounded-full flex items-center justify-center">
                                <i class="fas fa-comment-slash text-purple-500 text-sm"></i>
                            </div>
                            <span class="text-gray-700">垃圾短信</span>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-gray-500">25%</span>
                            <div class="w-24 h-2 bg-gray-100 rounded-full overflow-hidden">
                                <div class="w-[25%] h-full bg-purple-500 rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 迷你图表
        const miniCtx = document.getElementById('miniChart').getContext('2d');
        new Chart(miniCtx, {
            type: 'line',
            data: {
                labels: ['一月', '二月', '三月', '四月', '五月', '六月'],
                datasets: [{
                    data: [30, 45, 35, 50, 40, 60],
                    borderColor: 'rgba(255, 255, 255, 0.8)',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        display: false
                    },
                    y: {
                        display: false
                    }
                }
            }
        });

        // 趋势图表
        const trendCtx = document.getElementById('trendChart').getContext('2d');
        new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                datasets: [{
                    label: '拦截电话',
                    data: [12, 19, 15, 17, 14, 23, 18],
                    borderColor: '#0ACA6D',
                    backgroundColor: 'rgba(10, 202, 109, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        grid: {
                            display: false
                        }
                    },
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>

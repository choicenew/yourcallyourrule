<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ACA6D',
                        secondary: '#FF809A',
                        accent: '#93CB80',
                        dark: '#333333',
                        light: '#F5F5F5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .card-shadow {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .stat-card {
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航栏 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <a href="index.html" class="text-gray-500 mr-4">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </a>
                    <h1 class="text-xl font-semibold text-gray-800">仪表盘</h1>
                </div>
                <div>
                    <button class="p-2 rounded-full bg-gray-100 text-gray-600">
                        <i class="fas fa-bell"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="container mx-auto px-4 py-6 pb-20">
        <!-- 欢迎信息 -->
        <div class="bg-gradient-to-r from-primary to-accent text-white rounded-xl p-6 mb-6 card-shadow">
            <h2 class="text-2xl font-bold mb-2">早上好！今天要保持高效 🙌</h2>
            <p class="opacity-90">您今天有 3 个待处理任务</p>
        </div>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <!-- 统计卡片1 -->
            <div class="stat-card bg-blue-500 text-white rounded-xl p-4 card-shadow">
                <div class="flex flex-col">
                    <span class="text-xs font-medium opacity-80">已拦截电话</span>
                    <span class="text-2xl font-bold mt-1">24</span>
                    <span class="text-xs mt-2">本周 <i class="fas fa-arrow-up"></i> 12%</span>
                </div>
            </div>
            
            <!-- 统计卡片2 -->
            <div class="stat-card bg-purple-500 text-white rounded-xl p-4 card-shadow">
                <div class="flex flex-col">
                    <span class="text-xs font-medium opacity-80">已过滤短信</span>
                    <span class="text-2xl font-bold mt-1">56</span>
                    <span class="text-xs mt-2">本周 <i class="fas fa-arrow-up"></i> 8%</span>
                </div>
            </div>
            
            <!-- 统计卡片3 -->
            <div class="stat-card bg-green-500 text-white rounded-xl p-4 card-shadow">
                <div class="flex flex-col">
                    <span class="text-xs font-medium opacity-80">白名单联系人</span>
                    <span class="text-2xl font-bold mt-1">15</span>
                    <span class="text-xs mt-2">总计</span>
                </div>
            </div>
            
            <!-- 统计卡片4 -->
            <div class="stat-card bg-red-500 text-white rounded-xl p-4 card-shadow">
                <div class="flex flex-col">
                    <span class="text-xs font-medium opacity-80">黑名单联系人</span>
                    <span class="text-2xl font-bold mt-1">65</span>
                    <span class="text-xs mt-2">总计</span>
                </div>
            </div>
        </div>

        <!-- 图表 -->
        <div class="bg-white rounded-xl p-4 mb-6 card-shadow">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">拦截统计</h3>
            <canvas id="blockChart" height="200"></canvas>
        </div>

        <!-- 任务列表 -->
        <div class="bg-white rounded-xl p-4 card-shadow mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-800">今日任务</h3>
                <button class="text-primary">
                    <i class="fas fa-plus"></i> 添加
                </button>
            </div>
            
            <!-- 任务项 -->
            <div class="space-y-3">
                <!-- 任务1 -->
                <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                    <input type="checkbox" class="h-5 w-5 text-primary rounded mr-3">
                    <div class="flex-1">
                        <h4 class="text-sm font-medium text-gray-800">更新应用程序用户界面</h4>
                        <p class="text-xs text-gray-500">设计团队 · 今天 14:00</p>
                    </div>
                    <span class="px-2 py-1 text-xs font-medium bg-yellow-100 text-yellow-800 rounded">进行中</span>
                </div>
                
                <!-- 任务2 -->
                <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                    <input type="checkbox" class="h-5 w-5 text-primary rounded mr-3">
                    <div class="flex-1">
                        <h4 class="text-sm font-medium text-gray-800">优化来电识别算法</h4>
                        <p class="text-xs text-gray-500">开发团队 · 今天 16:00</p>
                    </div>
                    <span class="px-2 py-1 text-xs font-medium bg-blue-100 text-blue-800 rounded">待处理</span>
                </div>
                
                <!-- 任务3 -->
                <div class="flex items-center p-3 bg-gray-50 rounded-lg">
                    <input type="checkbox" class="h-5 w-5 text-primary rounded mr-3" checked>
                    <div class="flex-1">
                        <h4 class="text-sm font-medium text-gray-800 line-through">更新黑名单数据库</h4>
                        <p class="text-xs text-gray-500">数据团队 · 今天 10:00</p>
                    </div>
                    <span class="px-2 py-1 text-xs font-medium bg-green-100 text-green-800 rounded">已完成</span>
                </div>
            </div>
        </div>

        <!-- 最近活动 -->
        <div class="bg-white rounded-xl p-4 card-shadow">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">最近活动</h3>
            
            <div class="space-y-4">
                <!-- 活动1 -->
                <div class="flex items-start">
                    <div class="bg-red-100 text-red-600 p-2 rounded-full mr-3">
                        <i class="fas fa-ban"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-800">拦截了来自 +86 138****1234 的电话</p>
                        <p class="text-xs text-gray-500">今天 11:23</p>
                    </div>
                </div>
                
                <!-- 活动2 -->
                <div class="flex items-start">
                    <div class="bg-purple-100 text-purple-600 p-2 rounded-full mr-3">
                        <i class="fas fa-comment-slash"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-800">过滤了来自 10086 的垃圾短信</p>
                        <p class="text-xs text-gray-500">今天 10:45</p>
                    </div>
                </div>
                
                <!-- 活动3 -->
                <div class="flex items-start">
                    <div class="bg-green-100 text-green-600 p-2 rounded-full mr-3">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-800">添加了 "张三

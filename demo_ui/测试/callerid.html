<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>来电识别设置 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ACA6D',
                        secondary: '#FF809A',
                        accent: '#93CB80',
                        dark: '#333333',
                        light: '#F5F5F5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .card-shadow {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .color-picker {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .preview-container {
            background-image: url('https://via.placeholder.com/400x800/333333/FFFFFF?text=Phone+Screen');
            background-size: cover;
            background-position: center;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
        }
        .caller-id-preview {
            position: absolute;
            top: 20%;
            left: 10%;
            right: 10%;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部导航栏 -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <a href="index.html" class="text-gray-500 mr-4">
                        <i class="fas fa-arrow-left text-lg"></i>
                    </a>
                    <h1 class="text-xl font-semibold text-gray-800">来电识别设置</h1>
                </div>
                <div>
                    <button class="py-1 px-3 rounded-full bg-primary text-white text-sm">
                        保存
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="container mx-auto px-4 py-6 pb-20">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 左侧设置面板 -->
            <div class="space-y-6">
                <!-- 样式设置 -->
                <div class="bg-white rounded-xl p-5 card-shadow">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">显示样式</h2>
                    
                    <!-- 背景颜色 -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">背景颜色</label>
                        <div class="flex items-center space-x-3">
                            <input type="color" id="bgColor" value="#0ACA6D" class="color-picker" onchange="updatePreview()">
                            <span id="bgColorHex" class="text-sm text-gray-500">#0ACA6D</span>
                        </div>
                    </div>
                    
                    <!-- 文字颜色 -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">文字颜色</label>
                        <div class="flex items-center space-x-3">
                            <input type="color" id="textColor" value="#FFFFFF" class="color-picker" onchange="updatePreview()">
                            <span id="textColorHex" class="text-sm text-gray-500">#FFFFFF</span>
                        </div>
                    </div>
                    
                    <!-- 透明度 -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">透明度: <span id="opacityValue">80%</span></label>
                        <input type="range" id="opacity" min="20" max="100" value="80" class="w-full" onchange="updatePreview()">
                    </div>
                    
                    <!-- 圆角 -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">圆角: <span id="radiusValue">16px</span></label>
                        <input type="range" id="radius" min="0" max="24" value="16" class="w-full" onchange="updatePreview()">
                    </div>
                    
                    <!-- 显示位置 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">显示位置</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button class="py-2 px-3 border border-gray-300 rounded-md text-sm position-btn" data-position="top" onclick="changePosition('top')">顶部</button>
                            <button class="py-2 px-3 border border-gray-300 rounded-md text-sm position-btn bg-primary text-white" data-position="middle" onclick="changePosition('middle')">中间</button>
                            <button class="py-2 px-3 border border-gray-300 rounded-md text-sm position-btn" data-position="bottom" onclick="changePosition('bottom')">底部</button>
                        </div>
                    </div>
                </div>
                
                <!-- 内容设置 -->
                <div class="bg-white rounded-xl p-5 card-shadow">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">显示内容</h2>
                    
                    <!-- 显示项目 -->
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-medium text-gray-700">显示电话号码</label>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" value="" class="sr-only peer" checked onchange="updatePreview()">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                            </label>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-medium text-gray-700">显示联系人姓名</label>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" value="" class="sr-only peer" checked onchange="updatePreview()">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                            </label>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-medium text-gray-700">显示位置信息</label>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" value="" class="sr-only peer" checked onchange="updatePreview()">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                            </label>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-medium text-gray-700">显示标签</label>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" value="" class="sr-only peer" checked onchange="updatePreview()">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                            </label>
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-medium text-gray-700">显示头像</label>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" value="" class="sr-only peer" checked onchange="updatePreview()">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                            </label>
                        </div>
                    </div>
                </div>
                
                <!-- 行为设置 -->
                <div class="bg-white rounded-xl p-5 card-shadow">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">行为设置</h2>
                    
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-medium text-gray-700">自动隐藏</label>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" value="" class="sr-only peer" checked>
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                            </label>
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">显示时长: <span id="durationValue">5秒</span></label>
                            <input type="range" id="duration" min="1" max="10" value="5" class="w-full">
                        </div>
                        
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-medium text-gray-700">点击可拖动</label>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" value="" class="sr-only peer" checked>
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧预览面板 -->
            <div class="preview-container h-[600px] card-shadow">
                <div id="callerIdPreview" class="caller-id-preview bg-primary bg-opacity-80 p-4 text-white" style="border-radius: 16px;">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mr-3">
                            <i class="fas fa-user text-primary text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold">张三</h3>
                            <p class="text-sm opacity-90">+86 138****1234</p>
                            <div class="flex items-center mt-1">
                                <i class="fas fa-map-marker-alt text-xs mr-1"></i>
                                <span class="text-xs">北京市</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 flex">
                        <span class="text-xs bg-white bg-opacity-20 px-2 py-1 rounded-full mr-2">联系人</span>
                        <span class="text-xs bg-white bg-opacity-20 px-2 py-1 rounded-full">工作</span>
                    </div>
                    <div class="flex justify-between mt-3">
                        <button class="bg-red-500 text-white px-3 py-1 rounded-full text-sm">
                            <i class="fas fa-ban mr-1"></i> 拒接
                        </button>
                        <button class="bg-green-500 text-white px-3 py-1 rounded-full text-sm">
                            <i class="fas fa-phone-alt mr-1"></i> 接听
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部导航栏 -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2">
        <div class="container mx-auto">
            <div class="flex justify-around items-center">
                <a href="index.html" class="flex flex-col items-center text-gray-500">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="#" class="flex flex-col items-center text-gray-500">
                    <i class="fas fa-shield-alt text-xl"></i>
                    <span class="text-xs mt-1">拦截</span>
                </a>
                <a href="dashboard.html" class="flex flex-col items-center text-gray-500">
                    <i class="fas fa-chart-bar text-xl"></i>
                    <span class="text-xs mt-1">统计</span>
                </a>
                <a href="#" class="flex flex-col items-center text-primary">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </footer>

    <script>
        // 更新预览
        function updatePreview() {
            const preview = document.getElementById('callerIdPreview');
            const bgColor = document.getElementById('bgColor').value;
            const textColor = document.getElementById('textColor').value;
            const opacity = document.getElementById('opacity').value;
            const radius = document.getElementById('radius').value;
            
            // 更新背景颜色和透明度
            preview.style.backgroundColor = bgColor;
            preview.style.color = textColor;
            preview.style.opacity = opacity / 100;
            preview.style.borderRadius = radius + 'px';
            
            // 更新显示值
            document.getElementById('bgColorHex').textContent = bgColor;
            document.getElementById('textColorHex').textContent = textColor;
            document.getElementById('opacityValue').textContent = opacity + '%';
            document.getElementById('radiusValue').textContent = radius + 'px';
            document.getElementById('durationValue').textContent = document.getElementById('duration').value + '秒';
        }
        
        // 更改位置
        function changePosition(position) {
            const preview = document.getElementById('callerIdPreview');
            const buttons = document.querySelectorAll('.position-btn');
            
            // 移除所有按钮的选中状态
            buttons.forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white');
            });
            
            // 添加当前按钮的选中状态
            document.querySelector(`[data-position="${position}"]`).classList.add('bg-primary', 'text-white');
            
            // 更新预览位置
            switch(position) {
                case 'top':
                    preview.style.top = '5%';
                    preview.style.bottom = 'auto';
                    break;
                case 'middle':
                    preview.style.top = '20%';
                    preview.style.bottom = 'auto';
                    break;
                case 'bottom':
                    preview.style.top = 'auto';
                    preview.style.bottom = '10%';
                    break;
            }
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            updatePreview();
            
            // 监听滑块变化
            document.getElementById('duration').addEventListener('input', function() {
                document.getElementById('durationValue').textContent = this.value + '秒';
            });
        });
    </script>
</body>
</html>

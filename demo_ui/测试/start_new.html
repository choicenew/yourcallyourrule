<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Call Your Rule - 启动页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0ACA6D 0%, #93CB80 100%);
            min-height: 100vh;
        }
        .app-frame {
            max-width: 430px;
            height: 100vh;
            margin: 0 auto;
            background: white;
            position: relative;
            overflow: hidden;
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="app-frame rounded-3xl shadow-2xl overflow-hidden">
        <!-- 状态栏 -->
        <div class="bg-black text-white px-6 py-2 flex justify-between items-center text-sm">
            <span>9:41</span>
            <div class="flex items-center space-x-2">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 主要内容 -->
        <div class="h-full flex flex-col items-center justify-center p-8 space-y-12 bg-gradient-to-b from-white to-gray-50">
            <!-- Logo动画 -->
            <div class="animate-float">
                <img src="../assets/logo.png" alt="Logo" class="w-32 h-32 object-contain">
            </div>

            <!-- 标题和描述 -->
            <div class="text-center space-y-4">
                <h1 class="text-3xl font-bold bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">
                    Your Call Your Rule
                </h1>
                <p class="text-gray-600 text-lg">
                    掌控你的通话，守护你的隐私
                </p>
            </div>

            <!-- 功能亮点 -->
            <div class="w-full space-y-4">
                <div class="flex items-center space-x-4 bg-gray-50 p-4 rounded-xl">
                    <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-shield-alt text-primary"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-800">智能拦截</h3>
                        <p class="text-sm text-gray-500">自动识别和拦截骚扰电话</p>
                    </div>
                </div>

                <div class="flex items-center space-x-4 bg-gray-50 p-4 rounded-xl">
                    <div class="w-10 h-10 bg-secondary/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-user-shield text-secondary"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-800">隐私保护</h3>
                        <p class="text-sm text-gray-500">保护个人信息不被泄露</p>
                    </div>
                </div>

                <div class="flex items-center space-x-4 bg-gray-50 p-4 rounded-xl">
                    <div class="w-10 h-10 bg-accent/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-sliders-h text-accent"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-800">自定义规则</h3>
                        <p class="text-sm text-gray-500">灵活设置通话过滤规则</p>
                    </div>
                </div>
            </div>

            <!-- 开始按钮 -->
            <button class="w-full bg-primary text-white py-4 rounded-xl font-semibold shadow-lg shadow-primary/30 hover:shadow-xl hover:shadow-primary/40 transition-all">
                开始使用
            </button>
        </div>
    </div>
</body>
</html>

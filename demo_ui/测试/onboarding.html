<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>引导页 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ACA6D',
                        secondary: '#FF809A',
                        accent: '#93CB80',
                        dark: '#333333',
                        light: '#F5F5F5'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .onboarding-slide {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .progress-dot {
            transition: background-color 0.3s ease;
        }
        .slide-enter {
            opacity: 0;
            transform: translateX(50px);
        }
        .slide-enter-active {
            opacity: 1;
            transform: translateX(0);
        }
        .slide-exit {
            opacity: 1;
            transform: translateX(0);
        }
        .slide-exit-active {
            opacity: 0;
            transform: translateX(-50px);
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
    <div class="flex-1 flex flex-col">
        <!-- 顶部进度条 -->
        <div class="container mx-auto px-4 pt-10 pb-4">
            <div class="w-full max-w-md mx-auto">
                <div class="relative pt-1">
                    <div class="flex mb-2 items-center justify-between">
                        <div>
                            <span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded-full text-primary bg-primary bg-opacity-20">
                                初始化进度
                            </span>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-semibold inline-block text-primary">
                                75%
                            </span>
                        </div>
                    </div>
                    <div class="overflow-hidden h-2 mb-4 text-xs flex rounded bg-gray-200">
                        <div style="width: 75%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-primary"></div>
                    </div>
                    <p class="text-xs text-gray-500 text-center">请等待数据库初始化完成</p>
                </div>
            </div>
        </div>

        <!-- 跳过按钮 -->
        <div class="absolute top-10 right-6">
            <button id="skipButton" class="text-accent font-medium">跳过</button>
        </div>

        <!-- 引导页内容 -->
        <div class="flex-1 flex items-center justify-center px-4">
            <div class="w-full max-w-md">
                <!-- 轮播内容 -->
                <div class="relative overflow-hidden">
                    <div id="slidesContainer" class="transition-transform duration-500 ease-in-out">
                        <!-- 语言选择页 -->
                        <div class="onboarding-slide" id="slide1">
                            <div class="text-center">
                                <h2 class="text-2xl font-bold text-gray-800 mb-6">选择您的语言</h2>
                                <div class="mb-8">
                                    <select class="w-full max-w-xs mx-auto py-2 px-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                                        <option value="zh">简体中文</option>
                                        <option value="en">English</option>
                                        <option value="ja">日本語</option>
                                        <option value="ko">한국어</option>
                                        <option value="fr">Français</option>
                                        <option value="de">Deutsch</option>
                                        <option value="es">Español</option>
                                    </select>
                                </div>
                                <p class="text-gray-600 mb-4">选择您偏好的语言以获得最佳体验</p>
                            </div>
                        </div>

                        <!-- 功能介绍页1 -->
                        <div class="onboarding-slide hidden" id="slide2">
                            <div class="text-center">
                                <div class="mb-6">
                                    <img src="https://via.placeholder.com/300x200/0ACA6D/FFFFFF?text=来电识别" alt="来电识别" class="mx-auto rounded-lg shadow-md">
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">智能来电识别</h2>
                                <p class="text-gray-600 mb-4">自动识别未知来电，标记可疑号码，保护您的通话安全</p>
                            </div>
                        </div>

                        <!-- 权限请求页 -->
                        <div class="onboarding-slide hidden" id="slide3">
                            <div class="text-center">
                                <div class="mb-6 text-center">
                                    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto">
                                        <i class="fas fa-desktop text-primary text-4xl"></i>
                                    </div>
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">启用悬浮窗权限</h2>
                                <p class="text-gray-600 mb-6">此权限用于在来电时显示重要信息，请点击下方按钮并在系统设置中允许权限</p>
                                <button class="bg-primary text-white py-3 px-6 rounded-lg font-medium shadow-md hover:bg-opacity-90 transition duration-300 mb-4">
                                    授予权限
                                </button>
                            </div>
                        </div>

                        <!-- 功能介绍页2 -->
                        <div class="onboarding-slide hidden" id="slide4">
                            <div class="text-center">
                                <div class="mb-6">
                                    <img src="https://via.placeholder.com/300x200/FF809A/FFFFFF?text=短信过滤" alt="短信过滤" class="mx-auto rounded-lg shadow-md">
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">智能短信过滤</h2>
                                <p class="text-gray-600 mb-4">自动过滤垃圾短信，分类整理重要信息，让您的收件箱更整洁</p>
                            </div>
                        </div>

                        <!-- 默认来电识别设置页 -->
                        <div class="onboarding-slide hidden" id="slide5">
                            <div class="text-center">
                                <div class="mb-6 text-center">
                                    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto">
                                        <i class="fas fa-phone-alt text-primary text-4xl"></i>
                                    </div>
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">设置默认来电识别应用</h2>
                                <p class="text-gray-600 mb-6">将本应用设为默认来电识别应用，以获得完整的来电识别和拦截功能</p>
                                <button class="bg-primary text-white py-3 px-6 rounded-lg font-medium shadow-md hover:bg-opacity-90 transition duration-300 mb-4">
                                    设置默认
                                </button>
                            </div>
                        </div>

                        <!-- 功能介绍页3 -->
                        <div class="onboarding-slide hidden" id="slide6">
                            <div class="text-center">
                                <div class="mb-6">
                                    <img src="https://via.placeholder.com/300x200/93CB80/FFFFFF?text=骚扰拦截" alt="骚扰拦截" class="mx-auto rounded-lg shadow-md">
                                </div>
                                <h2 class="text-2xl font-bold text-gray-800 mb-4">强力骚扰拦截</h2>
                                <p class="text-gray-600 mb-4">一键拦截骚扰电话和短信，自定义拦截规则，还您一个安静的环境</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 进度指示器 -->
                <div class="flex justify-center mt-8 mb-4">
                    <div class="flex space-x-2">
                        <span class="progress-dot h-2 w-2 rounded-full bg-secondary cursor-pointer" data-slide="1"></span>
                        <span class="progress-dot h-2 w-2 rounded-full bg-gray-300 cursor-pointer" data-slide="2"></span>
                        <span class="progress-dot h-2 w-2 rounded-full bg-gray-300 cursor-pointer" data-slide="3"></span>
                        <span class="progress-dot h-2 w-2 rounded-full bg-gray-300 cursor-pointer" data-slide="4"></span>
                        <span class="progress-dot h-2 w-2 rounded-full bg-gray-300 cursor-pointer" data-slide="5"></span>
                        <span class="progress-dot h-2 w-2 rounded-full bg-gray-300 cursor-pointer" data-slide="6"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航按钮 -->
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-center">
            <button id="nextButton" class="bg-primary text-white py-3 px-12 rounded-lg font-medium text-lg shadow-md hover:bg-opacity-90 transition duration-300">
                下一步
            </button>
        </div>
    </div>

    <script>
        // 引导页轮播功能
        const slides = document.querySelectorAll('.onboarding-slide');
        const dots = document.querySelectorAll('.progress-dot');
        const nextButton = document.getElementById('nextButton');
        const skipButton = document.getElementById('skipButton');
        const slidesContainer = document.getElementById('slidesContainer');
        let currentSlide = 0;
        const totalSlides = slides.length;

        // 初始化显示第一个slide
        showSlide(0);

        // 点击下一步按钮
        nextButton.addEventListener('click', () => {
            if (currentSlide < totalSlides - 1) {
                showSlide(currentSlide + 1);
            } else {
                // 最后一页，跳转到主页
                window.location.href = 'index.html';
            }
        });

        // 点击跳过按钮
        skipButton.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // 点击进度点
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                showSlide(index);
            });
        });

        // 显示指定页面
        function showSlide(index) {
            // 隐藏所有slide
            slides.forEach(slide => {
                slide.classList.add('hidden');
            });
            
            // 显示当前slide
            slides[index].classList.remove('hidden');
            
            // 更新进度点
            dots.forEach((dot, i) => {
                if (i === index) {
                    dot.classList.remove('bg-gray-300');
                    dot.classList.add('bg-secondary');
                } else {
                    dot.classList.remove('bg-secondary');
                    dot.classList.add('bg-gray-300');
                }
            });
            
            // 更新当前页索引
            currentSlide = index;
            
            // 更新按钮文本
            if (currentSlide === totalSlides - 1) {
                nextButton.textContent = '开始使用';
            } else {
                nextButton.textContent = '下一步';
            }
        }
    </script>
</body>
</html>

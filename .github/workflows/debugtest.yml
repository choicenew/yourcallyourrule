# .github/workflows/2-sync-to-public.yml

name: 2. Sync Release to Public Repo (The Right Way)

on:
  workflow_run:
    workflows: ["Manual Build & Multi-Channel Release"]
    types:
      - completed
  
  workflow_dispatch:

jobs:
  sync-to-public-repo:
    name: Sync Release to Public Repo
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    
    steps:
      # --- 步骤 1: 强制 gh CLI 使用您的 PAT 登录 ---
      # 这是我们已经证明成功的、最关键的一步
      - name: Authenticate gh CLI with PAT
        run: echo "${{ secrets.MY_PAT }}" | gh auth login --with-token

      # --- 步骤 2: 获取、清理、下载并发布 ---
      - name: Fetch, Clean, Download, and Create Public Release
        # --- ★★★ 这是最关键的修正 ★★★ ---
        #    我们在这里明确地将 MY_PAT 注入到整个脚本的环境变量中
        #    这样，此步骤中的所有 gh 命令都会强制使用它，绝不会退回到 GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          TARGET_REPO: "choicenew/yourcallrule"
        run: |
          set -e
          SOURCE_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          
          if [[ -z "$SOURCE_TAG" ]]; then
            echo "::error::Could not find any release in the private repo to sync."
            exit 1
          fi

          RELEASE_DETAILS_JSON=$(gh release view "$SOURCE_TAG" --repo ${{ github.repository }} --json name,body)
          TITLE=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.name')
          BODY=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.body')

          # 移除 "Full Changelog"
          CLEAN_BODY=$(echo "$BODY" | sed '/^\*\*Full Changelog\*\*:/,$d')

          mkdir -p release_assets
          gh release download "$SOURCE_TAG" --repo ${{ github.repository }} --pattern "*.apk" --dir release_assets
          
          # 在公开仓库使用安全的标签名
          SAFE_TARGET_TAG="${SOURCE_TAG//+/-}"

          # 使用清理过的 BODY 和安全的 TAG 来创建公开 Release
          # 因为 GH_TOKEN 环境变量已经设置为 MY_PAT，这个命令现在拥有了绝对的权限
          gh release create "$SAFE_TARGET_TAG" \
            --repo "$TARGET_REPO" \
            --title "$TITLE" \
            --notes "$CLEAN_BODY" \
            --clobber \
            release_assets/*

          echo "✅ Successfully created public release with safe tag: $SAFE_TARGET_TAG"

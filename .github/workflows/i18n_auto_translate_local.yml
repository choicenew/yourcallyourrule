name: Auto i18n Translate (Tencent Hy-MT2-1.8B Local LLM)

on:
  push:
    branches:
      - main
      - elite-ui
    paths:
      - 'lib/features/language/language_data.dart'
      - 'lib/l10n/app_en.arb'
      - 'scripts/i18n_pipeline_local.py'
      - '.github/workflows/i18n_auto_translate_local.yml'
  workflow_dispatch: # 手动触发备用

permissions:
  contents: write
  pull-requests: write

jobs:
  local-hymt2-translate:
    name: Translate via Local Tencent Hy-MT2-1.8B Model
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout 代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 与 Flutter 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 3. 部署 AngelSlim 官方 vLLM OpenAI API 服务 (Section 2 官方部署规范)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "vllm>=0.8.5.post1" angelslim transformers

          echo "=== 启动 AngelSlim 官方 vLLM OpenAI 兼容 API 服务 (端口 8080) ==="
          python3 -m vllm.entrypoints.openai.api_server \
              --host 127.0.0.1 \
              --port 8080 \
              --model Tencent-Hunyuan/Hy-MT2-1.8B \
              --trust-remote-code \
              --max-model-len 2048 &

          # 等待 vLLM API 服务启动就绪
          for i in {1..40}; do
            if curl -s http://127.0.0.1:8080/v1/models > /dev/null; then
              echo "✅ 腾讯混元 Hy-MT2 vLLM 官方 API 服务启动就绪！"
              break
            fi
            echo "等待 vLLM API 服务启动就绪中 ($i/40)..."
            sleep 3
          done

      - name: 4. 执行 腾讯混元 Hy-MT2 官方 vLLM 本地增量翻译
        run: |
          python scripts/i18n_pipeline_local.py

      - name: 5. 编译生成 AppLocalizations 代码
        run: |
          flutter gen-l10n

      - name: 6. 自动创建隔离 Pull Request (不污染主库)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style(i18n): 本地 腾讯 Hy-MT2-1.8B 模型自动翻译补全 ARB"
          title: "🌐 [Hy-MT2 本地模型] 自动修补多语言 ARB 与本地化代码"
          body: |
            ## 🤖 腾讯 Hy-MT2-1.8B 本地端侧模型翻译报告
            - 100% 运行于 GitHub Actions 本地 CPU (AngelSlim 官方 vLLM API 服务)
            - 零外部 API 依赖，零费用，零 403 / 429 报错
            - 已重新运行 `flutter gen-l10n` 编译生成代码

            > 本 PR 由隔离的本地模型 Workflow 提交，主库未被污染。请核对后 Merge。
          branch: "i18n/auto-translation-hymt2-update"
          base: "main"
          delete-branch: true

name: Auto i18n Translate (Tencent Hy-MT2-1.8B Local LLM)

on:
  push:
    branches:
      - main
      - elite-ui
    paths:
      - 'lib/features/language/language_data.dart'
      - 'lib/l10n/app_en.arb'
      - 'scripts/i18n_pipeline_local.py'
      - '.github/workflows/i18n_auto_translate_local.yml'
  workflow_dispatch: # 手动触发备用

permissions:
  contents: write
  pull-requests: write

jobs:
  local-hymt2-translate:
    name: Translate via Local Tencent Hy-MT2-1.8B Model
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout 代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 与 Flutter 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 3. 部署 uv 多线程极速包管理器与依赖缓存
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 4. 多线程极速安装 CPU 轻量版依赖 (体积从 4GB 锐减至 200MB)
        run: |
          # 1. 优先使用 CPU 专属 PyTorch 索引，将 2.5GB 庞大 CUDA 镜像压缩至 150MB
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          # 2. 多线程并发安装 AngelSlim 及关联依赖
          uv pip install --system transformers accelerate angelslim

      - name: 5. 执行 腾讯混元 Hy-MT2 官方示例本地增量翻译
        run: |
          python scripts/i18n_pipeline_local.py

      - name: 6. 编译生成 AppLocalizations 代码
        run: |
          flutter gen-l10n

      - name: 7. 自动创建隔离 Pull Request (不污染主库)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style(i18n): 本地 腾讯 Hy-MT2-1.8B 模型自动翻译补全 ARB"
          title: "🌐 [Hy-MT2 本地模型] 自动修补多语言 ARB 与本地化代码"
          body: |
            ## 🤖 腾讯 Hy-MT2-1.8B 本地端侧模型翻译报告
            - 100% 运行于 GitHub Actions 本地 CPU (AngelSlim 官方示例进程内推理)
            - 零外部 API 依赖，零费用，零 403 / 429 报错
            - 已重新运行 `flutter gen-l10n` 编译生成代码

            > 本 PR 由隔离的本地模型 Workflow 提交，主库未被污染。请核对后 Merge。
          branch: "i18n/auto-translation-hymt2-update"
          base: "main"
          delete-branch: true

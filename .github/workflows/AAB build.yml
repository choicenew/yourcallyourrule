# A single, unified workflow for building, releasing, syncing, and notifying.
# 优化版：只编译一次 AAB，通过 bundletool 提取 APK，大幅解决 Firebase/Ads 编译慢的问题。
name: single AAB-Build, Sync, and Notify

on:
  workflow_dispatch: # Allows manual triggering

jobs:
  # ====================================================================
  # JOB 1: Build the app (AAB only) and Extract APK, then Release
  # ====================================================================
  build_and_release:
    name: 1. Build AAB & Extract APK (Private)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      release_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ==============================================
      # 步骤 1: 稳健地开启 Swap (解决 Text file busy)
      # 无论如何，我们必须有 Swap，否则 Gradle 一旦越界就直接死给你看
      # ==============================================
      - name: Configure Swap Space
        run: |
          # 1. 先关闭当前 Swap (避免 Text file busy 错误)
          sudo swapoff -a || true
          
          # 2. 创建 8GB 交换文件 (使用 dd 命令，更稳定)
          # 这只是硬盘空间，不占物理内存，但能防止崩溃
          sudo dd if=/dev/zero of=/swapfile bs=1G count=8 status=progress
          
          # 3. 设置权限并启用
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # 4. 打印内存情况，确认 Swap 生效
          free -h
                                                                                                                # --- 1. 清理空间 (防止大型项目构建失败) ---
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false # 保留 Android 环境
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          VERSION_STRING=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "version=v$VERSION_STRING" >> $GITHUB_OUTPUT

      - name: Extract Latest Commit Message
        id: commit_message
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- 2. 环境配置 ---
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 优化 Gradle 内存，防止 R8 编译器崩溃
      - name: Setup Gradle Properties
        run: |
          mkdir -p ~/.gradle/
          echo "org.gradle.jvmargs=-Xmx5120m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          # 【必须】开启并行，提升速度
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          # 【物理极限】GitHub Runner 只有2个核。
          # 设为 2 是最快的。设大了只会增加内存开销，不会变快。
          #echo "org.gradle.workers.max=2" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties
          
          # 放宽 Kotlin 限制，让它能跑快点
          #echo "kotlin.daemon.jvm.options=-Xmx1536M" >> ~/.gradle/gradle.properties          

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Pub Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
              


      # --- 3. 构建准备 ---
      - name: Get Flutter packages
        run: flutter pub get

      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env

      - name: Generate Envied variables
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 关键：解码 Keystore。不仅 Flutter 编译需要，后面的 bundletool 提取 APK 也需要！
      - name: Decode keystore and create key.properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=key.jks" >> android/key.properties

      # --- 4. 核心构建 (仅构建 AAB) ---
      - name: Build AAB (One-time heavy compilation)
        run: flutter build appbundle --release

      # --- 5. 使用 Bundletool 提取 APK (秒级完成，无需再次编译) ---
      - name: Setup Bundletool
        run: |
          wget https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar

      - name: Generate Universal APK from AAB
        run: |
          # 使用 bundletool 将 AAB 转换为 APKs 集合
          # --mode=universal: 生成一个包含所有架构的单一 APK
          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks=android/app/key.jks \
            --ks-pass=pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            --key-pass=pass:${{ secrets.ANDROID_KEY_PASSWORD }}

          # 从生成的压缩包中解压出通用 APK
          unzip -p app.apks universal.apk > app-release-universal.apk
          echo "✅ APK generated successfully: app-release-universal.apk"

      # --- 6. 发布 ---
      - name: Publish to Private GitHub Release (Current Repo)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.meta.outputs.version }}
          name: "Internal Build ${{ steps.meta.outputs.version }}"
          body: |
            **✨ What's New:**

            ${{ steps.commit_message.outputs.message }}
            
            *(APK extracted from AAB via Bundletool)*
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: |
            build/app/outputs/bundle/release/app-release.aab
            app-release-universal.apk

  # ====================================================================
  # JOB 2: Sync the release to the public repository
  # ====================================================================
  sync_to_public:
    name: 2. Sync Release to Public
    needs: build_and_release
    if: success()
    runs-on: ubuntu-latest

    outputs:
      safe_release_tag: ${{ steps.sync_script.outputs.safe_tag }}

    steps:
      - name: Authenticate gh CLI with PAT
        run: echo "${{ secrets.MY_PAT }}" | gh auth login --with-token

      - name: Fetch, Clean, Download, and Sync Release
        id: sync_script
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO: "choicenew/yourcallrule"
          SOURCE_TAG: ${{ needs.build_and_release.outputs.release_tag }}
        run: |
          set -ex

          # 获取 Release 信息
          RELEASE_DETAILS_JSON=$(gh release view "$SOURCE_TAG" --repo "$SOURCE_REPO" --json name,body)
          TITLE=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.name')
          BODY=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.body')
          CLEAN_BODY=$(echo "$BODY" | sed '/^\*\*Full Changelog\*\*:/,$d')

          # 下载新的通用 APK (app-release-universal.apk)
          mkdir -p release_assets
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "*.apk" --dir release_assets

          SAFE_TARGET_TAG="${SOURCE_TAG//+/-}"
          echo "safe_tag=${SAFE_TARGET_TAG}" >> $GITHUB_OUTPUT

          # 删除旧 tag (如果存在) 并发布新 tag
          (gh release delete "$SAFE_TARGET_TAG" --repo "$TARGET_REPO" --yes && echo "Deleted existing release.") || echo "No existing release found."

          gh release create "$SAFE_TARGET_TAG" \
            --repo "$TARGET_REPO" \
            --title "$TITLE" \
            --notes "$CLEAN_BODY" \
            release_assets/*

          echo "✅ Successfully synced public release."

  # ====================================================================
  # JOB 3: Distribute the notification to Telegram
  # ====================================================================
  send_to_telegram:
    name: 3. Send Release to Telegram
    needs: [build_and_release, sync_to_public]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate gh CLI with PAT
        run: echo "${{ secrets.MY_PAT }}" | gh auth login --with-token

      - name: Fetch, Download, and Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_TAG: ${{ needs.build_and_release.outputs.release_tag }}
          SAFE_TAG: ${{ needs.sync_to_public.outputs.safe_release_tag }}
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO_URL: "https://github.com/choicenew/yourcallrule"
        run: |
          set -e

          RELEASE_DETAILS_JSON=$(gh release view "$SOURCE_TAG" --repo "$SOURCE_REPO" --json name,body)
          BODY=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.body')

          # --- 下载新的通用 APK ---
          APK_FILENAME="app-release-universal.apk"
          mkdir -p release_assets
          (gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$APK_FILENAME" --dir release_assets) || echo "Warning: Failed to download APK."

          APK_PATH="release_assets/$APK_FILENAME"
          
          RELEASE_URL="${TARGET_REPO_URL}/releases/tag/${SAFE_TAG}"
          CLEAN_BODY=$(echo "$BODY" | sed '/^\*\*Full Changelog\*\*:/,$d')

          MESSAGE="🚀 *New Release Available: \`${SAFE_TAG}\`*"
          MESSAGE+=$'\n\n'
          MESSAGE+="*What's New:*"
          MESSAGE+=$'\n'
          MESSAGE+="$CLEAN_BODY"
          MESSAGE+=$'\n\n'
          MESSAGE+="[View Full Release on GitHub](${RELEASE_URL})"
          MESSAGE+=$'\n\n---\n*Community contributions are welcome!*\nWe invite you to PR [plugins](https://github.com/choicenew/yourcallrule/tree/main/plugins) and help improve [translations](https://github.com/choicenew/yourcallrule/tree/main/lib/l10n).'
          
          echo "Sending message to Telegram..."
          curl -s -f -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"

          if [ -f "$APK_PATH" ]; then
            echo "Sending APK file to Telegram..."
            (curl -s -f -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${APK_PATH}" \
              -F "caption=Direct download for \`${SAFE_TAG}\` (Universal)" \
              -F "parse_mode=Markdown") || echo "Warning: Failed to send APK file."
          else
            echo "Warning: APK file not found."
          fi

          echo "✅ Telegram notification process completed."
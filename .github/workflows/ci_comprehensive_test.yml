name: Comprehensive CI Test Suite (UI / Service / Provider / Perf / Memory)

on:
  workflow_dispatch:
    inputs:
      fail_on_high:
        description: "Fail workflow if HIGH-severity regressions detected"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      verbose_logs:
        description: "Enable verbose flutter test output"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  issue_comment:
    types: [created]
  push:
    paths:
      - "lib/**"
      - "test/ci/**"
      - "test/perf/**"
      - "tool/**"
      - ".github/workflows/ci_comprehensive_test.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
    branches:
      - main
      - master
      - "dev/**"
      - "feature/**"
  pull_request:
    paths:
      - "lib/**"
      - "test/ci/**"
      - "test/perf/**"
      - "tool/**"
      - ".github/workflows/ci_comprehensive_test.yml"
      - "pubspec.yaml"
      - "pubspec.lock"

concurrency:
  group: ci-comprehensive-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: "3.44.0"
  CI: "true"

jobs:
  # ============================================================
  # JOB 1 : 真实 APP 冷启动剖析 (谁拖慢了打开 APP)
  # ============================================================
  real_app_startup_profiling:
    name: 🚀 Real App Startup Profile (Who Slows Launch)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: ${{ runner.os }}-flutter-ci-${{ hashFiles('**/pubspec.lock') }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Print toolchain versions
        run: |
          set -e
          dart --version
          flutter --version

      - name: Install dependencies
        run: |
          set -e
          flutter pub get
          flutter pub deps --style=compact 2>&1 | head -100 || true

      - name: Run code generation (for build_runner projects)
        run: |
          if grep -qE "build_runner|riverpod_generator|json_serializable|envied_generator|freezed" pubspec.yaml; then
            echo "build_runner detected; running build_runner build --delete-conflicting-outputs"
            flutter pub run build_runner build --delete-conflicting-outputs 2>&1 | tail -40 || echo "build_runner exited (non-fatal)"
          else
            echo "no build_runner project, skipping"
          fi

      - name: "Run Startup Profile: main() bootstrap + Provider init + first frame + Splash→Home"
        id: startup
        run: |
          set -o pipefail
          mkdir -p ci_reports
          if [ "${{ github.event.inputs.verbose_logs }}" = "true" ]; then
            EXTRA="--verbose"
          else
            EXTRA=""
          fi
          flutter test test/ci/app_startup_profiling_test.dart \
            --reporter expanded \
            --timeout 300s \
            -r github \
            ${EXTRA} \
            2>&1 | tee ci_reports/startup_profile.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Extract structured startup metrics
        if: always()
        run: |
          mkdir -p ci_reports
          grep -a "STARTUP_METRIC:" ci_reports/startup_profile.log 2>/dev/null \
            | sed 's/.*STARTUP_METRIC: //' > ci_reports/startup_metrics.jsonl || true
          grep -a "ROOT_CAUSE:" ci_reports/startup_profile.log 2>/dev/null \
            | sed 's/.*ROOT_CAUSE: //' > ci_reports/startup_root_causes.jsonl || true
          echo "--- Startup metrics ---"
          cat ci_reports/startup_metrics.jsonl 2>/dev/null
          echo "--- Root causes ---"
          cat ci_reports/startup_root_causes.jsonl 2>/dev/null
          echo "metric_rows=$(wc -l < ci_reports/startup_metrics.jsonl 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT
          echo "root_cause_rows=$(wc -l < ci_reports/startup_root_causes.jsonl 2>/dev/null || echo 0)" >> $GITHUB_OUTPUT

      - name: Upload Startup Profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-profile-report
          path: |
            ci_reports/startup_*
          retention-days: 30

  # ============================================================
  # JOB 2 : Provider 初始化 / 重建风暴 / 内存泄漏
  # ============================================================
  provider_init_and_rebuild_storm:
    name: 🧰 Provider Init & Rebuild Storm Detection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: ${{ runner.os }}-flutter-ci-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: |
          if grep -qE "build_runner|riverpod_generator|json_serializable|envied_generator|freezed" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs 2>&1 | tail -20 || true
          fi

      - name: Run Provider init + rebuild storm test
        id: prov
        run: |
          set -o pipefail
          mkdir -p ci_reports
          flutter test test/ci/provider_init_rebuild_storm_test.dart \
            --reporter expanded \
            --timeout 300s \
            -r github \
            2>&1 | tee ci_reports/provider_profile.log
        continue-on-error: true

      - name: Extract Provider metrics & root causes
        if: always()
        run: |
          mkdir -p ci_reports
          grep -a "PROVIDER_METRIC:" ci_reports/provider_profile.log 2>/dev/null \
            | sed 's/.*PROVIDER_METRIC: //' > ci_reports/provider_metrics.jsonl || true
          grep -a "ROOT_CAUSE:" ci_reports/provider_profile.log 2>/dev/null \
            | sed 's/.*ROOT_CAUSE: //' > ci_reports/provider_root_causes.jsonl || true
          echo "--- Provider metrics ---"
          cat ci_reports/provider_metrics.jsonl 2>/dev/null || true
          echo "--- Provider root causes ---"
          cat ci_reports/provider_root_causes.jsonl 2>/dev/null || true

      - name: Upload Provider Profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-profile-report
          path: |
            ci_reports/provider_*
          retention-days: 30

  # ============================================================
  # JOB 3 : Service 首屏响应延迟 & 阻塞 (不跟手)
  # ============================================================
  service_responsiveness:
    name: ⚙️ Service 1st-Frame Responsiveness & Blockers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: ${{ runner.os }}-flutter-ci-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: |
          if grep -qE "build_runner|riverpod_generator|json_serializable|envied_generator|freezed" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs 2>&1 | tail -20 || true
          fi

      - name: Run Service responsiveness test
        id: svc
        run: |
          set -o pipefail
          mkdir -p ci_reports
          flutter test test/ci/service_responsiveness_blocking_test.dart \
            --reporter expanded \
            --timeout 300s \
            -r github \
            2>&1 | tee ci_reports/service_profile.log
        continue-on-error: true

      - name: Extract Service metrics & root causes
        if: always()
        run: |
          mkdir -p ci_reports
          grep -a "SERVICE_METRIC:" ci_reports/service_profile.log 2>/dev/null \
            | sed 's/.*SERVICE_METRIC: //' > ci_reports/service_metrics.jsonl || true
          grep -a "ROOT_CAUSE:" ci_reports/service_profile.log 2>/dev/null \
            | sed 's/.*ROOT_CAUSE: //' > ci_reports/service_root_causes.jsonl || true
          echo "--- Service metrics ---"
          cat ci_reports/service_metrics.jsonl 2>/dev/null || true
          echo "--- Service root causes ---"
          cat ci_reports/service_root_causes.jsonl 2>/dev/null || true

      - name: Upload Service Profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-profile-report
          path: |
            ci_reports/service_*
          retention-days: 30

  # ============================================================
  # JOB 4 : 滚动 / 交互掉帧 & 卡顿 (janky frames)
  # ============================================================
  jank_frames_and_scroll:
    name: 🎨 Janky Frames & Scroll Stutter Detection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: ${{ runner.os }}-flutter-ci-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: |
          if grep -qE "build_runner|riverpod_generator|json_serializable|envied_generator|freezed" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs 2>&1 | tail -20 || true
          fi

      - name: Run jank / scroll test
        id: jank
        run: |
          set -o pipefail
          mkdir -p ci_reports
          flutter test test/ci/jank_frames_scroll_stutter_test.dart \
            --reporter expanded \
            --timeout 300s \
            -r github \
            2>&1 | tee ci_reports/jank_profile.log
        continue-on-error: true

      - name: Extract Jank metrics & root causes
        if: always()
        run: |
          mkdir -p ci_reports
          grep -a "JANK_METRIC:" ci_reports/jank_profile.log 2>/dev/null \
            | sed 's/.*JANK_METRIC: //' > ci_reports/jank_metrics.jsonl || true
          grep -a "ROOT_CAUSE:" ci_reports/jank_profile.log 2>/dev/null \
            | sed 's/.*ROOT_CAUSE: //' > ci_reports/jank_root_causes.jsonl || true
          echo "--- Jank metrics ---"
          cat ci_reports/jank_metrics.jsonl 2>/dev/null || true
          echo "--- Jank root causes ---"
          cat ci_reports/jank_root_causes.jsonl 2>/dev/null || true

      - name: Upload Jank Profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jank-profile-report
          path: |
            ci_reports/jank_*
          retention-days: 30

  # ============================================================
  # JOB 5 : 全应用全功能页面 Smoke 挂载与全矩阵测试
  # ============================================================
  full_system_matrix:
    name: 🛡️ Full App All-Feature System Matrix & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: ${{ runner.os }}-flutter-ci-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Run Full App System Matrix Test (20+ Feature Pages)
        id: matrix
        run: |
          set -o pipefail
          mkdir -p ci_reports
          flutter test test/ci/full_system_matrix_test.dart \
            --reporter expanded \
            --timeout 300s \
            -r github \
            2>&1 | tee ci_reports/matrix_profile.log
        continue-on-error: true

      - name: Extract Matrix metrics & root causes
        if: always()
        run: |
          mkdir -p ci_reports
          grep -a "CI_METRIC:" ci_reports/matrix_profile.log 2>/dev/null \
            | sed 's/.*CI_METRIC: //' > ci_reports/matrix_metrics.jsonl || true
          grep -a "ROOT_CAUSE:" ci_reports/matrix_profile.log 2>/dev/null \
            | sed 's/.*ROOT_CAUSE: //' > ci_reports/matrix_root_causes.jsonl || true
          echo "--- Matrix metrics ---"
          cat ci_reports/matrix_metrics.jsonl 2>/dev/null || true

      - name: Upload Matrix Profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-profile-report
          path: |
            ci_reports/matrix_*
          retention-days: 30

  # ============================================================
  # JOB 6 : 聚合输出根因排名报告 (谁拖慢了 App)
  # ============================================================
  aggregate_root_cause_report:
    name: 📊 Aggregate Root-Cause Ranking & Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - real_app_startup_profiling
      - provider_init_and_rebuild_storm
      - service_responsiveness
      - jank_frames_and_scroll
      - full_system_matrix
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: ${{ runner.os }}-flutter-ci-${{ hashFiles('**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation
        run: |
          if grep -qE "build_runner|riverpod_generator|json_serializable|envied_generator|freezed" pubspec.yaml; then
            flutter pub run build_runner build --delete-conflicting-outputs 2>&1 | tail -20 || true
          fi

      - name: Download all upstream profile artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci_reports/raw/
          merge-multiple: true

      - name: Collate metrics + root-cause JSONL from all jobs
        run: |
          mkdir -p ci_reports
          find ci_reports/raw -type f -name "*_metrics.jsonl" 2>/dev/null | while read -r f; do
            echo ">>> $f"
            cat "$f" >> ci_reports/ALL_METRICS.jsonl || true
          done
          find ci_reports/raw -type f -name "*_root_causes.jsonl" 2>/dev/null | while read -r f; do
            echo ">>> $f"
            cat "$f" >> ci_reports/ALL_ROOT_CAUSES.jsonl || true
          done
          echo "--- Total metric rows: $(wc -l < ci_reports/ALL_METRICS.jsonl 2>/dev/null || echo 0) ---"
          echo "--- Total root-cause rows: $(wc -l < ci_reports/ALL_ROOT_CAUSES.jsonl 2>/dev/null || echo 0) ---"

      - name: Run real root-cause aggregator → 谁拖慢了 App 排行榜
        id: agg
        run: |
          set -o pipefail
          FAIL_FLAG=""
          if [ "${{ github.event.inputs.fail_on_high }}" = "true" ]; then
            FAIL_FLAG="--fail-high"
          fi
          dart run tool/ci_root_cause_aggregator.dart --ci ${FAIL_FLAG} \
            2>&1 | tee ci_reports/aggregator_run.log
          EXIT_CODE=$?
          echo "agg_exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT

      - name: "Write GitHub Step Summary (markdown 报告, 含 Top 拖慢者)"
        if: always()
        run: |
          REPORT=$(ls -t ci_reports/ci_root_cause_report_*.md 2>/dev/null | head -1 || true)
          if [ -n "${REPORT}" ] && [ -s "${REPORT}" ]; then
            if [ -n "${GITHUB_STEP_SUMMARY}" ]; then
              cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi

      - name: Upload FINAL comprehensive report (含 Top-N 拖慢者 排行榜)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-ROOT-CAUSE-REPORT
          path: |
            ci_reports/
            !ci_reports/raw/**
          retention-days: 60

      - name: "Pass/Fail Gate: 任何上游 job fail 则 fail (可选按 HIGH fail)"
        run: |
          FAILURES=0
          for j in real_app_startup_profiling provider_init_and_rebuild_storm service_responsiveness jank_frames_and_scroll full_system_matrix; do
            case "${{ needs.$j.result }}" in
              failure)
                FAILURES=$((FAILURES + 1))
                echo "❌ FAILED JOB: $j"
                ;;
              success)
                echo "✅ PASSED JOB: $j"
                ;;
              skipped)
                echo "⏭  SKIPPED JOB: $j"
                ;;
              cancelled)
                echo "✖  CANCELLED JOB: $j"
                FAILURES=$((FAILURES + 1))
                ;;
            esac
          done
          echo ""
          if [ "${{ github.event.inputs.fail_on_high }}" = "true" ]; then
            HIGH=$(cat ci_reports/aggregator_run.log 2>/dev/null \
              | grep -aoE 'HIGH_SEVERITY_COUNT=[0-9]+' \
              | tail -1 | cut -d= -f2 || echo 0)
            echo "HIGH-severity root-causes: ${HIGH}"
            if [ "${HIGH}" -gt 0 ]; then
              echo "FAIL: HIGH-severity root causes detected (fail_on_high=true)"
              exit 1
            fi
          fi
          if [ "${FAILURES}" -gt 0 ]; then
            echo "Gate FAIL: ${FAILURES} upstream job(s) failed"
            exit 1
          fi
          echo "Gate PASS"
          exit 0

name: Comprehensive CI Test Suite (UI / Service / Provider / Perf / Memory)

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    paths:
      - "lib/**"
      - "test/ci/**"
      - "test/perf/**"
      - "tool/**"
      - ".github/workflows/ci_comprehensive_test.yml"
      - "pubspec.yaml"
      - "pubspec.lock"
    branches:
      - main
      - master
      - elite-ui
      - "dev/**"
      - "feature/**"
  pull_request:
    paths:
      - "lib/**"
      - "test/ci/**"
      - "test/perf/**"
      - "tool/**"
      - ".github/workflows/ci_comprehensive_test.yml"
      - "pubspec.yaml"
      - "pubspec.lock"

concurrency:
  group: ci-comprehensive-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: "3.47.1"
  CI: "true"

jobs:
  # ============================================================
  # JOB 1 : 真实 APP 冷启动剖析 (谁拖慢了打开 APP)
  # ============================================================
  real_app_startup_profiling:
    name: 🚀 Real App Startup Profile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env

      - name: Run Startup Profile Test
        run: |
          mkdir -p ci_reports
          flutter test test/ci/app_startup_profiling_test.dart \
            --reporter expanded \
            --timeout 300s \
            -r github \
            2>&1 | tee ci_reports/startup_profile.log
        continue-on-error: true

      - name: Upload Startup Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-profile-report
          path: ci_reports/startup_*
          retention-days: 30

  # ============================================================
  # JOB 2 : Provider 初始化 / 重建风暴
  # ============================================================
  provider_init_and_rebuild_storm:
    name: 🧰 Provider Init & Rebuild Storm Detection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env

      - name: Run Provider Test
        run: |
          mkdir -p ci_reports
          flutter test test/ci/provider_init_rebuild_storm_test.dart \
            --reporter expanded \
            --timeout 300s \
            -r github \
            2>&1 | tee ci_reports/provider_profile.log
        continue-on-error: true

      - name: Upload Provider Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-profile-report
          path: ci_reports/provider_*
          retention-days: 30

  # ============================================================
  # JOB 3 : Service 响应延迟 & 主线程阻塞检测
  # ============================================================
  service_responsiveness:
    name: ⚙️ Service 1st-Frame Responsiveness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env

      - name: Run Service Test
        run: |
          mkdir -p ci_reports
          flutter test test/ci/service_responsiveness_blocking_test.dart \
            --reporter expanded \
            --timeout 300s \
            -r github \
            2>&1 | tee ci_reports/service_profile.log
        continue-on-error: true

      - name: Upload Service Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-profile-report
          path: ci_reports/service_*
          retention-days: 30

  # ============================================================
  # JOB 4 : 界面跟手度 & 列表滚动掉帧 (Jank)
  # ============================================================
  jank_frames_and_scroll:
    name: 🎯 Jank Frames & Touch Responsiveness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env

      - name: Run Jank Test
        run: |
          mkdir -p ci_reports
          flutter test test/ci/jank_frames_scroll_stutter_test.dart \
            --reporter expanded \
            --timeout 300s \
            -r github \
            2>&1 | tee ci_reports/jank_profile.log
        continue-on-error: true

      - name: Upload Jank Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jank-profile-report
          path: ci_reports/jank_*
          retention-days: 30

  # ============================================================
  # JOB 5 : 全应用 20+ 页面全功能系统矩阵 Smoke
  # ============================================================
  full_system_matrix:
    name: 🛡️ Full App All-Feature System Matrix & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env

      - name: Run Matrix Test
        run: |
          mkdir -p ci_reports
          flutter test test/ci/full_system_matrix_test.dart \
            --reporter expanded \
            --timeout 300s \
            -r github \
            2>&1 | tee ci_reports/matrix_profile.log
        continue-on-error: true

      - name: Upload Matrix Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-profile-report
          path: ci_reports/matrix_*
          retention-days: 30

  # ============================================================
  # JOB 6 : 聚合输出根因排名与 GitHub Summary 报告
  # ============================================================
  aggregate_root_cause_report:
    name: 📊 Aggregate Root-Cause Ranking & Summary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - real_app_startup_profiling
      - provider_init_and_rebuild_storm
      - service_responsiveness
      - jank_frames_and_scroll
      - full_system_matrix
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download all profile artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci_reports/
          merge-multiple: true

      - name: Run Root-Cause Aggregator
        run: |
          dart run tool/ci_root_cause_aggregator.dart

      - name: Write GitHub Step Summary
        if: always()
        run: |
          REPORT=$(ls -t ci_reports/ci_root_cause_report_*.md 2>/dev/null | head -1 || true)
          if [ -n "${REPORT}" ] && [ -s "${REPORT}" ]; then
            cat "${REPORT}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload FINAL Comprehensive Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FINAL-PERFORMANCE-DIAGNOSIS-REPORT
          path: ci_reports/ci_root_cause_report_*
          retention-days: 60

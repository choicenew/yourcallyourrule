# .github/workflows/2-public-distribution-verbatim-test.yml

name: 2. Sync Release (Verbatim Test)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # (原封不动保留) 安装 GitHub CLI
      - name: Setup GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      # (原封不动保留) 下载最新 release 的资源
      - name: Download latest release assets
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          # 获取源仓库的最新 release 标签
          TAG=$(gh release list --limit 1 --repo ${{ github.repository }} --json tagName --jq '.[0].tagName')
          echo "Using tag: $TAG"
          # 创建临时目录存放下载的文件
          mkdir -p release_files
          cd release_files
          # 下载所有 release 资源
          gh release download $TAG --repo ${{ github.repository }}

      # (只修改了仓库名) 在目标仓库创建或更新 release
      - name: Create or update release in target repo
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          # 获取源仓库的最新 release 标签
          TAG=$(gh release list --limit 1 --repo ${{ github.repository }} --json tagName --jq '.[0].tagName')
          echo "Using tag: $TAG"
          # 获取源仓库最新 release 的标题和内容, 如果是release触发，则直接使用
          TITLE=$(gh release view $TAG --repo ${{ github.repository }} --json name --jq '.name')
          BODY=$(gh release view $TAG --repo ${{ github.repository }} --json body --jq '.body')
          
          if [ "${{ github.event_name }}" == "release" ]; then
            TITLE="${{ github.event.release.name }}"
            BODY="${{ github.event.release.body }}"
          fi
          
          # ★★★ 唯一修改点 ★★★
          TARGET_REPO="choicenew/yourcallrule"

          # 尝试获取目标仓库的 release 信息
          RELEASE_ID=$(gh release view $TAG --repo $TARGET_REPO --json id --jq '.id' 2> /dev/null)
          
          cd release_files
          
          if [ -z "$RELEASE_ID" ]; then
            # 如果 release 不存在，则创建
            echo "Release '$TAG' not found in target repo. Creating..."
            gh release create $TAG \
              --repo $TARGET_REPO \
              --title "$TITLE" \
              --notes "$BODY" \
              *
          else
            # 如果 release 存在，则更新
            echo "Release '$TAG' found in target repo. Updating..."
            gh release upload $TAG \
              --repo $TARGET_REPO \
              --clobber \
              *
          fi
permissions:
  contents: write

# .github/workflows/2-public-distribution.yml

name: 2. Sync Release to Public Repo

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-release:
    name: Sync Release
    runs-on: ubuntu-latest
    
    steps:
      # --- 步骤 1: 下载私有仓库的 Release 附件 ---
      - name: Download assets from private release
        id: download_step # 给这一步一个 id，方便后面引用 tag
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release list --limit 1 --repo ${{ github.repository }} --json tagName --jq '.[0].tagName')
          fi

          if [[ -z "$TAG" ]]; then
            echo "::error::Could not find any release in the private repository."
            exit 1
          fi

          echo "Target Tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          mkdir -p release_assets
          gh release download $TAG --repo ${{ github.repository }} --dir release_assets

      # --- 步骤 2: 在公开仓库创建或更新 Release ---
      - name: Create or update release in public repo
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          # 从上一步获取确定的 TAG
          TAG="${{ steps.download_step.outputs.tag }}"

          # 如果由 release 事件触发，直接用事件中的信息
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TITLE="${{ github.event.release.name }}"
            BODY="${{ github.event.release.body }}"
          else
            # 关键修正：先获取 TAG，再用 'gh release view' 获取详情
            echo "Fetching details for tag $TAG..."
            RELEASE_DETAILS_JSON=$(gh release view $TAG --repo ${{ github.repository }} --json name,body)
            TITLE=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.name')
            BODY=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.body')
          fi

          TARGET_REPO="choicenew/yourcallrule"

          # 检查目标仓库中 Release 是否已存在
          EXISTING_RELEASE=$(gh release view $TAG --repo $TARGET_REPO --json id 2>/dev/null)
          
          cd release_assets
          
          if [[ -z "$EXISTING_RELEASE" ]]; then
            echo "Release '$TAG' not found in $TARGET_REPO. Creating..."
            gh release create $TAG \
              --repo $TARGET_REPO \
              --title "$TITLE" \
              --notes "$BODY" \
              *
          else
            echo "Release '$TAG' already exists in $TARGET_REPO. Uploading/overwriting assets..."
            gh release upload $TAG \
              --repo $TARGET_REPO \
              --clobber \
              *
          fi

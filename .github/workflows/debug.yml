# .github/workflows/2-public-distribution-final.yml

name: 2. Sync Release to Public Repo (The Right Way)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-release:
    name: Sync Release
    runs-on: ubuntu-latest
    
    steps:
      # --- 步骤 1: 确定要操作的确切 Release 标签 ---
      # 这个步骤确保我们总是知道要处理哪个版本，绝不猜测 'latest'
      - name: Get Exact Target Tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # 如果由 release 事件触发，直接使用事件中的确切标签，这是最可靠的方式
            TARGET_TAG="${{ github.event.release.tag_name }}"
            echo "Triggered by release event. Using exact tag: $TARGET_TAG"
          else
            # 如果是手动触发，我们才去获取列表中的第一个（也就是最新的那个，无论是不是预发布）
            echo "Manual trigger. Fetching the most recent tag from private repo..."
            TARGET_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          fi
          
          if [[ -z "$TARGET_TAG" ]]; then
            echo "::error::Could not determine a target release tag."
            exit 1
          fi
          
          echo "tag=${TARGET_TAG}" >> $GITHUB_OUTPUT

      # --- 步骤 2: 使用专业的 Action，并【精确指定版本】，下载附件和信息 ---
      # 这是对之前失败的直接修正
      - name: Fetch Specific Release Assets and Info
        uses: dsaltares/fetch-gh-release-asset@master
        id: fetch_release
        with:
          repo: ${{ github.repository }}
          token: ${{ secrets.MY_PAT }}
          # ★★★ 这是最关键的修正 ★★★
          # 我们不再让它猜 'latest'，而是通过 'tags/...' 告诉它确切的版本标签
          version: 'tags/${{ steps.get_tag.outputs.tag }}'
          # 下载所有文件
          file: ".*"
          regex: true
          target: "release_assets/"

      # --- 步骤 3: 创建安全的发布标签 ---
      # 这仍然是一个好习惯，可以避免未来任何可能的问题
      - name: Create Safe Tag for Public Release
        id: vars
        run: |
          SOURCE_TAG="${{ steps.fetch_release.outputs.version }}"
          # 替换 '+' 是为了让公开仓库的 URL 更干净
          SAFE_TARGET_TAG="${SOURCE_TAG//+/-}"
          echo "safe_tag=${SAFE_TARGET_TAG}" >> $GITHUB_OUTPUT

      # --- 步骤 4: 将所有内容发布到公开仓库 ---
      # 使用最标准、最可靠的 ncipollo/release-action
      - name: Create or Update Release in Public Repo
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.MY_PAT }}
          repo: choicenew/yourcallrule
          tag: ${{ steps.vars.outputs.safe_tag }}
          name: ${{ steps.fetch_release.outputs.name }}
          body: ${{ steps.fetch_release.outputs.body }}
          artifacts: "release_assets/*"
          allowUpdates: true

# .github/workflows/3-debug-pat.yml

name: 3. DEBUG PAT Authentication

on:
  workflow_dispatch: # 只允许手动触发

jobs:
  debug-pat:
    name: Test PAT Validity
    runs-on: ubuntu-latest
    
    steps:
      - name: Step 1 - Attempt to login with PAT
        run: |
          echo "Attempting to log in with the provided MY_PAT..."
          echo "${{ secrets.MY_PAT }}" | gh auth login --with-token
          echo "Login command finished."

      - name: Step 2 - Check authentication status
        run: |
          echo "Checking current gh authentication status..."
          gh auth status

      - name: Step 3 - Attempt to access the PUBLIC repo
        run: |
          echo "Attempting a simple read operation on the PUBLIC repo: choicenew/yourcallrule"
          gh repo view choicenew/yourcallrule --json name
          echo "✅ If you see this message, the PAT works perfectly for the public repo."

      - name: Step 4 - Attempt to access the PRIVATE repo
        run: |
          echo "Attempting a simple read operation on the PRIVATE repo: ${{ github.repository }}"
          gh repo view ${{ github.repository }} --json name
          echo "✅ If you see this message, the PAT also works for the private repo."

# .github/workflows/2-public-distribution.yml

name: 2. Sync Release to Public Repo (with Tag Translation)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-release:
    name: Translate Tag and Sync Release
    runs-on: ubuntu-latest
    
    steps:
      # 这个工作流现在只有一个核心步骤，完成所有逻辑，避免变量传递问题
      - name: Read from Private, Translate Tag, and Write to Public
        env:
          # 使用 MY_PAT 完成所有操作，权限最足
          GH_TOKEN: ${{ secrets.MY_PAT }}
          # 明确定义目标仓库
          TARGET_REPO: "choicenew/testtest"
        run: |
          # --- 1. 获取源头（私有库）的、带有 '+' 的原始标签 ---
          if [[ "${{ github.event_name }}" == "release" ]]; then
            SOURCE_TAG="${{ github.event.release.tag_name }}"
          else
            SOURCE_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          fi

          if [[ -z "$SOURCE_TAG" ]]; then
            echo "::error::Could not find any release in the private repo."
            exit 1
          fi
          echo "Found original source tag (with '+'): $SOURCE_TAG"

          # --- 2. ★★★ 这是最关键的一步 ★★★ ---
          #    创建一个安全的、用于目标（公开库）的新标签，将 '+' 替换为 '-'
          SAFE_TARGET_TAG="${SOURCE_TAG//+/-}"
          echo "Created safe target tag (with '-'): $SAFE_TARGET_TAG"

          # --- 3. 使用【原始标签】从【私有库】获取标题和内容 ---
          echo "Fetching release details from private repo using original tag..."
          RELEASE_DETAILS_JSON=$(gh release view "$SOURCE_TAG" --repo ${{ github.repository }} --json name,body)
          TITLE=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.name')
          BODY=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.body')

          # --- 4. 使用【原始标签】从【私有库】下载所有附件 ---
          echo "Downloading assets from private repo using original tag..."
          mkdir -p release_assets
          gh release download "$SOURCE_TAG" --repo ${{ github.repository }} --dir release_assets
          
          # --- 5. 使用【安全的新标签】在【公开库】创建或更新 Release ---
          echo "Checking for release with SAFE tag '$SAFE_TARGET_TAG' in public repo..."
          # 检查目标仓库中是否存在使用 SAFE_TARGET_TAG 的 release
          EXISTING_RELEASE=$(gh release view "$SAFE_TARGET_TAG" --repo "$TARGET_REPO" --json id 2>/dev/null)
          
          cd release_assets
          
          if [[ -z "$EXISTING_RELEASE" ]]; then
            echo "Release not found. Creating new release with SAFE tag '$SAFE_TARGET_TAG' in $TARGET_REPO..."
            gh release create "$SAFE_TARGET_TAG" \
              --repo "$TARGET_REPO" \
              --title "$TITLE" \
              --notes "$BODY" \
              *
          else
            echo "Release found. Uploading and overwriting assets for SAFE tag '$SAFE_TARGET_TAG' in $TARGET_REPO..."
            gh release upload "$SAFE_TARGET_TAG" \
              --repo "$TARGET_REPO" \
              --clobber \
              *
          fi
          
          echo "✅ Successfully synced release to public repo with safe tag: $SAFE_TARGET_TAG"

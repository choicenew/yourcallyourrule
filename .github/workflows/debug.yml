# .github/workflows/2-public-distribution-final.yml

name: 2. Sync Release to Public Repo (Final Version)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sync-release:
    name: Sync Release
    runs-on: ubuntu-latest
    
    steps:
      # --- 步骤 1: 使用专业的 Action 从私有仓库获取所有信息和附件 ---
      # 这个 Action 会正确处理认证，并下载所有文件
      - name: Fetch All Assets and Info from Private Release
        uses: dsaltares/fetch-gh-release-asset@master
        id: fetch_release
        with:
          # 从当前（私有）仓库读取
          repo: ${{ github.repository }}
          # 使用您的 PAT，这个 Action 会正确使用它
          token: ${{ secrets.MY_PAT }}
          # 使用正则表达式 ".*" 来匹配并下载所有附件
          file: ".*"
          regex: true
          # 将所有下载的文件放入一个名为 'release_assets' 的目录中
          target: "release_assets/"

      # --- 步骤 2: 创建一个用于公开仓库的安全标签 ---
      # 这是一个好习惯，可以避免未来可能遇到的问题
      - name: Create Safe Tag for Public Release
        id: vars
        run: |
          SOURCE_TAG="${{ steps.fetch_release.outputs.version }}"
          SAFE_TARGET_TAG="${SOURCE_TAG//+/-}"
          echo "Original source tag: $SOURCE_TAG"
          echo "Safe target tag for public repo: $SAFE_TARGET_TAG"
          echo "safe_tag=${SAFE_TARGET_TAG}" >> $GITHUB_OUTPUT

      # --- 步骤 3: 使用标准 Action 将所有内容发布到公开仓库 ---
      - name: Create or Update Release in Public Repo
        uses: ncipollo/release-action@v1
        with:
          # 同样使用您的 PAT 来获得写入权限
          token: ${{ secrets.MY_PAT }}
          # 目标是您的公开仓库
          repo: choicenew/yourcallrule
          # 使用我们创建的安全标签
          tag: ${{ steps.vars.outputs.safe_tag }}
          # 使用第一步获取到的标题和正文
          name: ${{ steps.fetch_release.outputs.name }}
          body: ${{ steps.fetch_release.outputs.body }}
          # 上传我们下载到 'release_assets' 目录中的所有文件
          artifacts: "release_assets/*"
          # 允许覆盖已存在的 Release
          allowUpdates: true

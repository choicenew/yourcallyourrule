name: 测试Flutter Debug Build
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (aab/apk/both)'
        required: true
        default: 'both'
        
jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      # 配置 settings.gradle
      - name: Configure Gradle Settings
        run: |
          cat > android/settings.gradle << 'EOL'
          include ':app'

          def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
          def properties = new Properties()

          assert localPropertiesFile.exists()
          localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }

          def flutterSdkPath = properties.getProperty("flutter.sdk")
          assert flutterSdkPath != null, "flutter.sdk not set in local.properties"

          apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"

          def flutterProjectRoot = rootProject.projectDir.parentFile.toPath()
          def plugins = new Properties()
          def pluginsFile = new File(flutterProjectRoot.toFile(), '.flutter-plugins')
          if (pluginsFile.exists()) {
              pluginsFile.withReader('UTF-8') { reader -> plugins.load(reader) }
          }

          plugins.each { name, path ->
              def pluginDirectory = flutterProjectRoot.resolve(path).resolve('android').toFile()
              include ":$name"
              project(":$name").projectDir = pluginDirectory
          }
          EOL

          # 创建 local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          
      - name: Install Dependencies
        run: flutter pub get
          
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
          
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=key.jks" >> android/key.properties
          
      - name: Build Release
        run: |
          if [[ "${{ github.event.inputs.build_type }}" == "aab" || "${{ github.event.inputs.build_type }}" == "both" ]]; then
            flutter build appbundle --verbose
          fi
          if [[ "${{ github.event.inputs.build_type }}" == "apk" || "${{ github.event.inputs.build_type }}" == "both" ]]; then
            flutter build apk --split-per-abi --verbose
          fi
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-build-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/apk/release/*.apk
            
      - name: Extract Version
        run: |
          echo "PUBSPEC_VERSION=$(grep -oP 'version:\s*\K[^+]+(?=\+)' pubspec.yaml)" >> $GITHUB_ENV
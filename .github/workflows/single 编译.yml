# A single, unified workflow for building, releasing, syncing, and notifying.
name: single-Build, Sync, and Notify

on:
  workflow_dispatch: # Allows manual triggering
 
 
 

jobs:
  # ====================================================================
  # JOB 1: Build the app and create a release in the current (private) repo
  # ====================================================================
  build_and_release:
  
  
  
    name: 1. Build and Release (Private)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      release_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==============================================
      # 新增：清理磁盘空间步骤
      # ==============================================
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false # 千万不要清理 Android，我们需要它！
          dotnet: true   # 清理 .NET
          haskell: true  # 清理 Haskell
          large-packages: true # 清理大文件包
          docker-images: true  # 清理 Docker 镜像
          swap-storage: true   # 优化 Swap
      # ==============================================
      
      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          VERSION_STRING=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "version=v$VERSION_STRING" >> $GITHUB_OUTPUT

      - name: Extract Latest Commit Message
        id: commit_message
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- Environment Setup & Caching ---
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

                    # ==============================================
      # 2. 限制 Gradle 内存 (解决 Error 143 / 编译慢)
      # ==============================================
      - name: Setup Gradle Properties
        run: |
          mkdir -p ~/.gradle/
          # 限制堆内存为 3GB，防止 R8 编译器把内存撑爆
          echo "org.gradle.jvmargs=-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          # 禁用守护进程，CI环境不需要
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties

          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pub Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # --- Build Steps ---
      - name: Get Flutter packages
        run: flutter pub get

      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env

      - name: Generate Envied variables
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Decode keystore and create key.properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=key.jks" >> android/key.properties

      - name: Build and Sign AAB and APKs
        run: |
          flutter build appbundle --release
          flutter build apk --split-per-abi --release

      # --- Release Step ---
      - name: Publish to Private GitHub Release (Current Repo)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.meta.outputs.version }}
          name: "Internal Build ${{ steps.meta.outputs.version }}"
          body: |
            **✨ What's New:**

            ${{ steps.commit_message.outputs.message }}
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk

  # ====================================================================
  # JOB 2: Sync the release to the public repository
  # ====================================================================
  sync_to_public:
    name: 2. Sync Release to Public
    needs: build_and_release
    if: success()
    runs-on: ubuntu-latest

    outputs:
      # Pass the safe tag to the next job for the GitHub release URL
      safe_release_tag: ${{ steps.sync_script.outputs.safe_tag }}

    steps:
      - name: Authenticate gh CLI with PAT
        run: echo "${{ secrets.MY_PAT }}" | gh auth login --with-token

      - name: Fetch, Clean, Download, and Sync Release
        id: sync_script # Added an ID to this step to reference its output
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO: "choicenew/yourcallrule"
          SOURCE_TAG: ${{ needs.build_and_release.outputs.release_tag }}
        run: |
          set -ex

          RELEASE_DETAILS_JSON=$(gh release view "$SOURCE_TAG" --repo "$SOURCE_REPO" --json name,body)
          TITLE=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.name')
          BODY=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.body')

          CLEAN_BODY=$(echo "$BODY" | sed '/^\*\*Full Changelog\*\*:/,$d')

          mkdir -p release_assets
          gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "*.apk" --dir release_assets

          SAFE_TARGET_TAG="${SOURCE_TAG//+/-}"
          # ★★★ Output the safe tag for the next job
          echo "safe_tag=${SAFE_TARGET_TAG}" >> $GITHUB_OUTPUT

          (gh release delete "$SAFE_TARGET_TAG" --repo "$TARGET_REPO" --yes && echo "Deleted existing release.") || echo "No existing release found. Proceeding to create."

          gh release create "$SAFE_TARGET_TAG" \
            --repo "$TARGET_REPO" \
            --title "$TITLE" \
            --notes "$CLEAN_BODY" \
            release_assets/*

          echo "✅ Successfully synced public release with tag: $SAFE_TARGET_TAG"

  # ====================================================================
  # JOB 3: Distribute the notification to Telegram
  # ====================================================================
  send_to_telegram:
    name: 3. Send Release to Telegram
    # ★★★ This job now depends on sync_to_public completing successfully
    needs: [build_and_release, sync_to_public]
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate gh CLI with PAT
        run: echo "${{ secrets.MY_PAT }}" | gh auth login --with-token

      - name: Fetch, Download, and Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Get the original tag from the first job
          SOURCE_TAG: ${{ needs.build_and_release.outputs.release_tag }}
          # Get the "safe" tag from the second job for the URL
          SAFE_TAG: ${{ needs.sync_to_public.outputs.safe_release_tag }}
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO_URL: "https://github.com/choicenew/yourcallrule"
        run: |
          set -e

          # --- A. 获取私有仓库中 Release 的详细信息 ---
          # 我们不再需要猜测最新标签，而是直接使用从上一步传递过来的精确标签
          RELEASE_DETAILS_JSON=$(gh release view "$SOURCE_TAG" --repo "$SOURCE_REPO" --json name,body)
          BODY=$(echo "$RELEASE_DETAILS_JSON" | jq -r '.body')

          # --- B. 下载附件 ---
          APK_FILENAME="app-arm64-v8a-release.apk"
          mkdir -p release_assets
          (gh release download "$SOURCE_TAG" --repo "$SOURCE_REPO" --pattern "$APK_FILENAME" --dir release_assets) || echo "Warning: Failed to download APK. Will skip sending the file."

          APK_PATH="release_assets/$APK_FILENAME"
          
          # --- C. 构建消息 (您的原始逻辑) ---
          RELEASE_URL="${TARGET_REPO_URL}/releases/tag/${SAFE_TAG}"
          
          CLEAN_BODY=$(echo "$BODY" | sed '/^\*\*Full Changelog\*\*:/,$d')

          MESSAGE="🚀 *New Release Available: \`${SAFE_TAG}\`*"
          MESSAGE+=$'\n\n'
          MESSAGE+="*What's New:*"
          MESSAGE+=$'\n'
          MESSAGE+="$CLEAN_BODY"
          MESSAGE+=$'\n\n'
          MESSAGE+="[View Full Release on GitHub](${RELEASE_URL})"

          COMMUNITY_MESSAGE=$'\n\n---\n*Community contributions are welcome!*\nWe invite you to PR [plugins](https://github.com/choicenew/yourcallrule/tree/main/plugins) and help improve [translations](https://github.com/choicenew/yourcallrule/tree/main/lib/l10n).'
          MESSAGE+="$COMMUNITY_MESSAGE"
          
          # --- D. 发送消息和文件 (您的原始逻辑) ---
          echo "Sending message to Telegram..."
          curl -s -f -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"

          if [ -f "$APK_PATH" ]; then
            echo "Sending APK file to Telegram..."
            (curl -s -f -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${APK_PATH}" \
              -F "caption=Direct download for \`${SAFE_TAG}\` (arm64-v8a)" \
              -F "parse_mode=Markdown") || echo "Warning: Failed to send APK file, but continuing."
          else
            echo "Warning: APK file was not found at '$APK_PATH'. Skipping file send."
          fi

          echo "✅ Telegram notification process completed."
name: Auto i18n Check & Translate

on:
  push:
  workflow_dispatch: # 支持在 GitHub Web 界面上点击“Run workflow”手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  i18n-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout 代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. 执行云端智能去重、差量检修与多 Provider AI 翻译
        env:
          # 支持配置多 Provider 数组 JSON（AI_PROVIDERS），或单 Provider 环境变量（AI_PROVIDER_URL / AI_TRANSLATE_KEY）
          AI_PROVIDERS: ${{ secrets.AI_PROVIDERS }}
          AI_PROVIDER_URL: ${{ secrets.AI_PROVIDER_URL }}
          AI_TRANSLATE_KEY: ${{ secrets.AI_TRANSLATE_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }} # 可选，没有可不填
        run: |
          python scripts/i18n_pipeline.py

      - name: 5. 编译生成 AppLocalizations 代码
        run: |
          flutter gen-l10n

      - name: 6. 机器人直接提交与推送变更 (github-actions[bot])
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/l10n/
          if git diff --cached --quiet; then
            echo "✅ 经检查，没有发现任何需要提交的本地化变动。"
          else
            git commit -m "style(i18n): 自动去重、修补与 AI 增量翻译多语言 ARB [skip ci]"
            git push
          fi

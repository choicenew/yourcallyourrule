name: Manual Build & Multi-Channel Release

on:
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build and Release Android
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 job 写入权限，用于创建 Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取所有 git 历史，用于生成 release notes

      - name: Extract version from pubspec.yaml
        id: meta
        run: |
          echo "version=v$(grep 'version: ' pubspec.yaml | sed 's/version: //')" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4' # 保持您原来的 Flutter 版本不变
          channel: 'stable'
          cache: true
      
      - name: Get Flutter packages
        run: flutter pub get
      
      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env
        
      - name: Generate Envied variables
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=key.jks" >> android/key.properties
      
      - name: Build and Sign AAB and APKs
        run: |
          flutter build appbundle --release
          flutter build apk --split-per-abi --release

      # ==========================================================
      # 发布步骤
      # ==========================================================

      # --- 1. 发布到私有 GitHub Release (AAB + 所有 APK) ---
      - name: Publish to Private GitHub Release (Current Repo)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.meta.outputs.version }}
          name: "Internal Build ${{ steps.meta.outputs.version }}"
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk
            # 修正1: 将 APK 路径从旧的 'apk/release' 改为日志中显示的 'flutter-apk'

      # --- 2. 发布到公开 GitHub Release (所有 APK) ---
      - name: Publish to Public GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.MY_PAT }}
          repo: choicenew/yourcallrule # 修正2: 参数名从 'repository' 改为 'repo'
          tag: ${{ steps.meta.outputs.version }}
          name: "Release ${{ steps.meta.outputs.version }}"
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: "build/app/outputs/flutter-apk/*.apk" # 修正1: 同上，修正 APK 路径

      # --- 3. 发布到 Telegram (arm64-v8a APK) ---
      - name: Deploy to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 **New Build Available: ${{ steps.meta.outputs.version }}**
            A new version of YourApp is ready for testing. Download the APK below.
          document: "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" # 修正1: 同上，修正 APK 路径

      # --- 4. 发布到 Google Play (仅 AAB) ---
      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.yours.yourcallyourrule
          releaseFiles: "build/app/outputs/bundle/release/app-release.aab"
          track: production
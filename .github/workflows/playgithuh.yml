name: Manual Build & Multi-Channel Release

on:
  workflow_dispatch:

jobs:
  build_and_release:
    name: Build and Release Android
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 job 写入权限，用于在本仓库创建 Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          VERSION_STRING=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "version=v$VERSION_STRING" >> $GITHUB_OUTPUT
          echo "version_code=$(echo $VERSION_STRING | sed 's/.*+//')" >> $GITHUB_OUTPUT

      - name: Extract Latest Commit Message
        id: commit_message
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      
      - name: Get Flutter packages
        run: flutter pub get
      
      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env
        
      - name: Generate Envied variables
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Decode keystore and create key.properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=key.jks" >> android/key.properties
      
      - name: Build and Sign AAB and APKs
        run: |
          flutter build appbundle --release
          flutter build apk --split-per-abi --release

      # ==========================================================
      # 发布步骤 (已全部设置为独立运行，互不影响)
      # ==========================================================

      # --- 1. 发布到私有 GitHub Release ---
      - name: Publish to Private GitHub Release (Current Repo)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.meta.outputs.version }}
          name: "Internal Build ${{ steps.meta.outputs.version }}"
          body: |
            **✨ What's New:**
            
            ${{ steps.commit_message.outputs.message }}
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk

      # --- 2. 发布到公开 GitHub Release ---
      - name: Publish to Public GitHub Release
        uses: ncipollo/release-action@v1
        # 关键修正1: 即使此步骤失败，也继续执行
        continue-on-error: true 
        with:
          token: ${{ secrets.MY_PAT }} # 确保这个 PAT 有 repo 权限
          repo: choicenew/yourcallrule
          tag: ${{ steps.meta.outputs.version }}
          name: "Release ${{ steps.meta.outputs.version }}"
          body: |
            **✨ What's New:**

            ${{ steps.commit_message.outputs.message }}
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: "build/app/outputs/flutter-apk/*.apk"

      # --- 3. 发布到 Telegram ---
      - name: Send Telegram Message with Update Notes
        uses: appleboy/telegram-action@master
        # 关键修正2: 即使此步骤失败，也继续执行
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 **New Release Available: `${{ steps.meta.outputs.version }}`**

            **✨ What's New:**
            ```
            ${{ steps.commit_message.outputs.message }}
            ```

            [View Full Release on GitHub](https://github.com/choicenew/yourcallrule/releases/tag/${{ steps.meta.outputs.version }})

      - name: Attempt to Send APK to Telegram
        uses: appleboy/telegram-action@master
        # 这个之前已经加了，保持即可
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          caption: "Direct download for `${{ steps.meta.outputs.version }}` (arm64-v8a)."

      # --- 4. 发布到 Google Play ---
      - name: Create Google Play Release Notes
        id: create_notes # 给这个步骤一个 id，方便后面引用
        run: |
          mkdir -p release_notes/en-US
          echo "${{ steps.commit_message.outputs.message }}" > release_notes/en-US/${{ steps.meta.outputs.version_code }}.txt

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        # 关键修正3: 即使此步骤失败，也继续执行
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.yours.yourcallyourrule
          releaseFiles: "build/app/outputs/bundle/release/app-release.aab"
          track: production
          releaseNotesDirectory: release_notes
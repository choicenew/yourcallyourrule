name: Manual Build & Multi-Channel Release

on:
  workflow_dispatch:

  # 新增：当有代码推送到 main 分支时，检查是否需要运行
  push:
    branches:
      - drift  # 这里改成你的主分支名字，通常是 main 或者 master    

jobs:
  build_and_release:
    # 关键在这里！添加 if 条件判断
    # 只有当最新的 commit message 包含 'update version' 时，才执行下面的步骤
        # 在原有条件的基础上，增加对仓库名称的判断
    if: >-
      contains(github.event.head_commit.message, 'update version') &&
      github.repository == 'choicenew/yourcallyourrule'

    name: Build and Release Android
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 job 写入权限，用于在本仓库创建 Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # ▼▼▼▼▼▼▼▼ 修改了这里 ▼▼▼▼▼▼▼▼
      - name: Configure Swap Space
        run: |
          # 1. 停止当前正在使用的 Swap (解决 Text file busy)
          sudo swapoff -a || true
          
          # 2. 创建 8GB 交换空间
          sudo dd if=/dev/zero of=/swapfile bs=1G count=8 status=progress
          
          # 3. 设置安全权限并格式化
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          
          # 4. 重新启用
          sudo swapon /swapfile
          
          # 5. 打印状态以供检查
          free -h
      # ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false 
          dotnet: true   
          haskell: true  
          large-packages: true 
          docker-images: true  
          swap-storage: false # 保持 false，不要让这个插件删除了我们刚建好的 Swap

      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          VERSION_STRING=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "version=v$VERSION_STRING" >> $GITHUB_OUTPUT
          echo "version_code=$(echo $VERSION_STRING | sed 's/.*+//')" >> $GITHUB_OUTPUT

      - name: Extract Latest Commit Message
        id: commit_message
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle Properties
        run: |
          mkdir -p ~/.gradle/
          # 保持之前的优化：限制堆内存，禁用并行
          echo "org.gradle.jvmargs=-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          echo "kotlin.daemon.jvm.options=-Xmx1024M" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      
      - name: Get Flutter packages
        run: flutter pub get
      
      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env
        
      - name: Generate Envied variables
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Decode keystore and create key.properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=key.jks" >> android/key.properties
      
      - name: Build AAB
        run: flutter build appbundle --release

      - name: Setup Bundletool
        run: |
          wget https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar

      - name: Generate Universal APK from AAB
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks=android/app/key.jks \
            --ks-pass=pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            --key-pass=pass:${{ secrets.ANDROID_KEY_PASSWORD }}
          unzip -p app.apks universal.apk > app-release-universal.apk

      - name: Publish to Private GitHub Release (Current Repo)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.meta.outputs.version }}
          name: "Internal Build ${{ steps.meta.outputs.version }}"
          body: |
            **✨ What's New:**
            ${{ steps.commit_message.outputs.message }}
            *(APK extracted from AAB via Bundletool)*
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: |
            build/app/outputs/bundle/release/app-release.aab
            app-release-universal.apk
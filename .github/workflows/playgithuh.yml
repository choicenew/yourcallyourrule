name: Manual Build & Multi-Channel Release

on:
  workflow_dispatch:

  # 新增：当有代码推送到 main 分支时，检查是否需要运行
  push:
    branches:
      - drift  # 这里改成你的主分支名字，通常是 main 或者 master    

jobs:
  build_and_release:
    # 关键在这里！添加 if 条件判断
    # 只有当最新的 commit message 包含 'update version' 时，才执行下面的步骤
        # 在原有条件的基础上，增加对仓库名称的判断.
    if: >-
      contains(github.event.head_commit.message, 'update version') &&
      github.repository == 'choicenew/yourcallyourrule'

    name: Build and Release Android
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 job 写入权限，用于在本仓库创建 Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # ==============================================
      # 修复核心 1: 手动创建 Swap 交换空间
      # GitHub Runner 只有 7GB 内存，编译 Release 包容易爆内存 (Error 143)。
      # 这里创建一个 6GB 的虚拟内存文件，防止崩溃。
      # ==============================================
      - name: Enable Swap Space (防止内存溢出)
        run: |
          sudo fallocate -l 6G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Swap enabled:"
          sudo swapon --show

      # ==============================================
      # 修复核心 2: 修改清理策略
      # ==============================================
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false 
          dotnet: true   
          haskell: true  
          large-packages: true 
          docker-images: true  
          swap-storage: false # <--- 关键！改为 false。绝对不要删除 Swap，我们需要它救命！

      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          VERSION_STRING=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "version=v$VERSION_STRING" >> $GITHUB_OUTPUT
          echo "version_code=$(echo $VERSION_STRING | sed 's/.*+//')" >> $GITHUB_OUTPUT

      - name: Extract Latest Commit Message
        id: commit_message
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ==============================================
      # 修复核心 3: 优化 Gradle 内存配置
      # ==============================================
      - name: Setup Gradle Properties
        run: |
          mkdir -p ~/.gradle/
          # 限制 Gradle 堆内存为 3GB (留出 4GB 给系统和其他进程)
          echo "org.gradle.jvmargs=-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          # 禁用守护进程 (CI 不需要)
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          # <--- 关键修改：禁用并行编译。虽然慢一点，但能大幅降低内存峰值，防止崩溃。
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          # 限制 Kotlin 编译器的内存使用
          echo "kotlin.daemon.jvm.options=-Xmx1024M" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      
      - name: Get Flutter packages
        run: flutter pub get
      
      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env
        
      - name: Generate Envied variables
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Decode keystore and create key.properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=key.jks" >> android/key.properties
      
      # 开始构建 AAB
      - name: Build AAB
        run: flutter build appbundle --release

      - name: Setup Bundletool
        run: |
          wget https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar

      - name: Generate Universal APK from AAB
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks=android/app/key.jks \
            --ks-pass=pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            --key-pass=pass:${{ secrets.ANDROID_KEY_PASSWORD }}
          unzip -p app.apks universal.apk > app-release-universal.apk
          echo "✅ APK generated successfully: app-release-universal.apk"

      - name: Publish to Private GitHub Release (Current Repo)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.meta.outputs.version }}
          name: "Internal Build ${{ steps.meta.outputs.version }}"
          body: |
            **✨ What's New:**
            ${{ steps.commit_message.outputs.message }}
            *(APK extracted from AAB via Bundletool)*
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: |
            build/app/outputs/bundle/release/app-release.aab
            app-release-universal.apk
name: Manual Build & Multi-Channel Release

on:
  workflow_dispatch:

  # 新增：当有代码推送到 main 分支时，检查是否需要运行
  push:
    branches:
      - drift  # 这里改成你的主分支名字，通常是 main 或者 master    

jobs:
  build_and_release:
    # 关键在这里！添加 if 条件判断
    # 只有当最新的 commit message 包含 'update version' 时，才执行下面的步骤
        # 在原有条件的基础上，增加对仓库名称的判断
    if: >-
      contains(github.event.head_commit.message, 'update version') &&
      github.repository == 'choicenew/yourcallyourrule'
    name: Build and Release Android
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 job 写入权限，用于在本仓库创建 Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      # ==============================================
      # 新增：清理磁盘空间步骤
      # ==============================================
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false # 千万不要清理 Android，我们需要它！
          dotnet: true   # 清理 .NET
          haskell: true  # 清理 Haskell
          large-packages: true # 清理大文件包
          docker-images: true  # 清理 Docker 镜像
          swap-storage: false # 建议这里改为 false，因为 Swap 太慢导致了超时，不如直接限制内存
      # ==============================================
      
      - name: Extract metadata from pubspec.yaml
        id: meta
        run: |
          VERSION_STRING=$(grep 'version: ' pubspec.yaml | sed 's/version: //')
          echo "version=v$VERSION_STRING" >> $GITHUB_OUTPUT
          echo "version_code=$(echo $VERSION_STRING | sed 's/.*+//')" >> $GITHUB_OUTPUT
      - name: Extract Latest Commit Message
        id: commit_message
        run: |
          echo "message<<EOF" >> $GITHUB_OUTPUT
          git log -1 --pretty=%B >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ==============================================
      # 2. 限制 Gradle 内存 (解决 Error 143 / 编译慢)
      # ==============================================
      - name: Setup Gradle Properties
        run: |
          mkdir -p ~/.gradle/
          # 限制堆内存为 3GB，防止 R8 编译器把内存撑爆
          echo "org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          # 禁用守护进程，CI环境不需要
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.configureondemand=true" >> ~/.gradle/gradle.properties
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true
      
      - name: Get Flutter packages
        run: flutter pub get
      
      - name: Create .env file for build
        run: |
          echo "CF_WORKER_URL=${{ secrets.CF_WORKER_URL }}" >> .env
          echo "WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}" >> .env
        
      - name: Generate Envied variables
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Decode keystore and create key.properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.jks
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" >> android/key.properties
          echo "storeFile=key.jks" >> android/key.properties
      
      - name: Build and Sign AAB and APKs
        run: |
          flutter build appbundle --release
          flutter build apk --split-per-abi --release
      # ==========================================================
      # 发布步骤 (已全部设置为独立运行，互不影响)
      # ==========================================================

      # --- 1. 发布到私有 GitHub Release ---
      - name: Publish to Private GitHub Release (Current Repo)
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.meta.outputs.version }}
          name: "Internal Build ${{ steps.meta.outputs.version }}"
          body: |
            **✨ What's New:**
            
            ${{ steps.commit_message.outputs.message }}
          generateReleaseNotes: true
          allowUpdates: true
          artifacts: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk

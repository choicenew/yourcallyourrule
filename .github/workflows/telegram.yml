# This file must be in the PUBLIC repository: choicenew/yourcallrule

name: Send Telegram Notification

on:
  release:
    types: [published]

jobs:
  send-notification:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    
    steps:
      - name: Prepare and Send Notification
        env:
          # ★★★ 注意: 您需要将这些 Secrets 添加到您的【公开仓库】中 ★★★
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          TAG="${{ github.event.release.tag_name }}"
          BODY="${{ github.event.release.body }}"
          APK_NAME="app-arm64-v8a-release.apk"
          
          echo "Downloading $APK_NAME from release $TAG..."
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh release download "$TAG" --pattern "$APK_NAME" --repo ${{ github.repository }}

          BODY_ESCAPED=$(echo "$BODY" | sed -e 's/_/\\_/g' -e 's/\*/\\*/g' -e 's/\[/\\[/g' -e 's/]/\\-/g' -e 's/(/\\(/g' -e 's/)/\\)/g' -e 's/~/\\~/g' -e 's/`/\\`/g' -e 's/>/\\>/g' -e 's/#/\\#/g' -e 's/+/\\+/g' -e 's/-/\\-/g' -e 's/=/\\=/g' -e 's/|/\\|/g' -e 's/{/\\{/g' -e 's/}/\\}/g' -e 's/\./\\./g' -e 's/!/\!/g')
          MESSAGE="🚀 *New Release Available: \`${TAG}\`*%0A%0A"
          MESSAGE+="$BODY_ESCAPED%0A%0A"
          MESSAGE+="[View Full Release on GitHub](${{ github.event.release.html_url }})"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}" -d "parse_mode=MarkdownV2" -d "disable_web_page_preview=true"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" -F "chat_id=${TELEGRAM_CHAT_ID}" -F "document=@${APK_NAME}" -F "caption=Direct download for \`${TAG}\` (arm64-v8a)" -F "parse_mode=MarkdownV2"

          echo "✅ Telegram notification and file sent successfully!"
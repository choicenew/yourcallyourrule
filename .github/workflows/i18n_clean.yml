name: i18n Clean Unused Keys

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：preview 只打印清单（安全），apply 真正修改 ARB 文件（会自动在仓库内备份并提交）"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - apply
      create_pr:
        description: "apply 模式下是否创建 Pull Request 提交修改 + 备份"
        required: false
        default: true
        type: boolean
      pr_branch_name:
        description: "PR 分支名"
        required: false
        default: "chore/i18n-clean-unused-keys"

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  clean:
    name: Clean unused translation keys (double-scan safe)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for create-pr)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify cleaner script
        run: |
          test -f "scripts/i18n_cleaner.py" || { echo "scripts/i18n_cleaner.py not found"; exit 1; }

      - name: Dry-run preview (always)
        run: |
          echo "=== 第一轮：dry-run 预览，打印将会删除的键 ==="
          python scripts/i18n_cleaner.py

      - name: Apply cleanup + 本地仓库内永久化备份（mode == apply）
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          echo "=== 第二轮：apply 模式，执行清理并在仓库内生成永久化备份 ==="
          python scripts/i18n_cleaner.py --apply --nobackup

      - name: 在仓库内生成永久化备份压缩包（apply）
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          TS="$(date +%Y%m%d_%H%M%S)"
          OUT_DIR="_l10n_permanent_backups"
          mkdir -p "$OUT_DIR"
          OUT_FILE="$OUT_DIR/l10n_backup_${TS}_run${GITHUB_RUN_ID}_att${GITHUB_RUN_ATTEMPT}.zip"
          echo "备份时间戳=$TS  输出=$OUT_FILE"
          (cd lib && zip -r "../$OUT_FILE" l10n -x "*.DS_Store")
          echo "已生成备份大小: $(du -h "$OUT_FILE" | cut -f1)"
          (cd "$OUT_DIR" && sha256sum "$(basename "$OUT_FILE")" > "$(basename "$OUT_FILE").sha256")
          echo "备份校验文件: $OUT_FILE.sha256"
          cat "$OUT_FILE.sha256"
          echo "PERM_BACKUP_FILE=$OUT_FILE" >> "$GITHUB_ENV"
          echo "PERM_BACKUP_SHASUM=$OUT_FILE.sha256" >> "$GITHUB_ENV"

      - name: 可选：作为 Release Asset 再留一份永久备份（apply）
        if: ${{ github.event.inputs.mode == 'apply' }}
        continue-on-error: true
        run: |
          TAG="i18n-clean-backup-$(date +%Y%m%d-%H%M%S)"
          echo "若发布 Release：tag=$TAG  asset=$PERM_BACKUP_FILE"
          gh release create "$TAG" \
            "$PERM_BACKUP_FILE" \
            "$PERM_BACKUP_SHASUM" \
            --title "i18n l10n backup $(date +%F_%T)" \
            --notes "i18n_cleaner 清理前整份 l10n 目录的永久化备份。\n校验文件：${PERM_BACKUP_SHASUM}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 仅上传执行记录辅助 Artifact（短期 7 天）
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: i18n-clean-run-log
          path: |
            i18n_reports/06_清理执行记录.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Show git diff + git status（apply）
        if: ${{ github.event.inputs.mode == 'apply' }}
        run: |
          echo "=== 工作区变更清单 ==="
          git status --short || true
          echo
          echo "=== ARB 修改差异摘要 ==="
          git --no-pager diff --stat -- "lib/l10n/*.arb" || true

      - name: Create Pull Request
        if: ${{ github.event.inputs.mode == 'apply' && github.event.inputs.create_pr == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.event.inputs.pr_branch_name || 'chore/i18n-clean-unused-keys' }}
          base: ${{ github.head_ref || github.ref_name }}
          add-paths: |
            lib/l10n/**
            _l10n_permanent_backups/**
            i18n_reports/06_清理执行记录.md
          commit-message: |
            chore(l10n): remove unused keys + keep permanent backup zip
          title: "chore(l10n): 清理未使用翻译键（含整份 l10n 永久化备份 zip 已提交进仓库）"
          body: |
            ## 本 PR 包含
            1. `lib/l10n/*.arb`：删除脚本判定 100% 未使用的翻译键
            2. `_l10n_permanent_backups/`：清理前整份 l10n 目录的 zip
            3. `i18n_reports/06_清理执行记录.md`：本次执行明细
          labels: |
            l10n
            automated pr
          draft: false

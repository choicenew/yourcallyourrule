name: Apksigner Verify AAB with upup-company/apksigner-android (with artifact and release)

on:
  workflow_dispatch:

jobs:
  test-apksigner:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17' 

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;33.0.2 platform-tools 

      - name: Download Sample AAB Bundle
        run: wget https://github.com/haygcao/yourcallyourruletranslation/releases/download/test/app-release-after-signing.aab

      - name: Apksigner Android
        uses: upup-company/apksigner-android@v1
        with:
          releaseDirectory: .
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }} 
          alias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Check Verification Result 
        run: if [ $? -eq 0 ]; then echo "AAB bundle signature verified successfully!"; else echo "AAB bundle signature verification failed!"; fi  

      - name: Install dependencies
        run: sudo apt-get install tree -y

      - name: Generate Checksums
        run: |
          tree .
          md5sum app-release-after-signing.aab >> RELEASE.md5sum
          sha256sum app-release-after-signing.aab >> RELEASE.sha256sum

      # Upload AAB and checksums as artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: app-release-aab
          path: |
            app-release-after-signing.aab
            RELEASE.md5sum
            RELEASE.sha256sum

  upload:
    runs-on: ubuntu-latest
    needs:
      - test-apksigner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          name: app-release-aab
          path: ./app-release-aab
      


      - name: Upload Release Binaries 
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.MY_PAT }}
          tag: v2.9 
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          allowUpdates: true
          artifacts: app-release-aab/*

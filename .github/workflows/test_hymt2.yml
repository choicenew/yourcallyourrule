name: Test Hy-MT2 AngelSlim Model (Pure YML Test)

on:
  workflow_dispatch:
  # [DISABLED] 已停用自动触发翻译测试流程
  # push:
  #   branches:
  #     - main
  #     - elite-ui

jobs:
  test-hymt2:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate
          python -m pip install git+https://github.com/tencent/AngelSlim.git

      - name: 4. Pure Inline Python Test for Hy-MT2
        run: |
          python -c "
          import torch
          import angelslim
          from transformers import AutoModelForCausalLM, AutoTokenizer

          print('=== Loading AngelSlim/HY-1.8B-2Bit Model ===')
          model = AutoModelForCausalLM.from_pretrained(
              'AngelSlim/HY-1.8B-2Bit',
              device_map='cpu',
              trust_remote_code=True,
              torch_dtype=torch.float32,
              low_cpu_mem_usage=True
          )
          tokenizer = AutoTokenizer.from_pretrained('AngelSlim/HY-1.8B-2Bit')

          prompt = 'Translate to Chinese: Hello, world!'
          inputs = tokenizer(prompt, return_tensors='pt')
          outputs = model.generate(**inputs, max_new_tokens=64)
          result = tokenizer.decode(outputs[0], skip_special_tokens=True)
          print('=== Translation Result ===')
          print(result)
          "

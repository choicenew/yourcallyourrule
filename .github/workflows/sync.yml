# .github/workflows/2-public-distribution.yml

name: 2. Public Distribution (Smart Rerun)

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  distribute:
    name: Distribute to Public Channels
    runs-on: ubuntu-latest
    permissions:
      contents: read 

    steps:
      # --- 步骤 1: 智能获取目标 Release 标签 ---
      # 这个步骤在当前（私有）仓库中运行
      - name: Get Target Release Tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TARGET_TAG="${{ github.event.release.tag_name }}"
            echo "Triggered by new release in THIS repository: ${TARGET_TAG}"
          else
            echo "Manual trigger. Finding the latest release in THIS repository..."
            # gh release list --repo ${{ github.repository }}  <-- 自动使用当前仓库名
            TARGET_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
            if [[ -z "$TARGET_TAG" ]]; then
              echo "::error::Could not find any releases in THIS repository."
              exit 1
            fi
            echo "Found latest release to process: ${TARGET_TAG}"
          fi
          echo "tag=${TARGET_TAG}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      # --- 步骤 2: 下载指定 Release 的所有附件 ---
      # 这个步骤也在当前（私有）仓库中运行，下载私有 Release 的附件
      - name: Download all assets from release '${{ steps.vars.outputs.tag }}'
        uses: dsaltares/fetch-release-assets@v1.1.1 
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.vars.outputs.tag }}
          out-path: 'build_artifacts'

      # --- 步骤 3: 获取指定 Release 的 Body (更新说明) ---
      # 这个步骤同样在当前（私有）仓库中运行
      - name: Get Release Body
        id: get_release_body
        run: |
          BODY_CONTENT=$(gh release view ${{ steps.vars.outputs.tag }} --json body --jq .body)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 发布到公开 GitHub Release ---
      # 这是唯一一步需要指定公开仓库名的步骤
      - name: Publish to Public GitHub Release (choicenew/yourcallrule)
        uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          token: ${{ secrets.MY_PAT }}
          repo: choicenew/yourcallrule # <-- 明确指定目标是公开仓库
          tag: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          body: ${{ steps.get_release_body.outputs.body }}
          allowUpdates: true
          artifacts: "build_artifacts/*.apk"
            
      # --- 后续所有步骤都与仓库名无关 ---
      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 **New Release Available: `${{ steps.vars.outputs.tag }}`**
            **✨ What's New:**
            ```
            ${{ steps.get_release_body.outputs.body }}
            ```
            [View Public Release on GitHub](https://github.com/choicenew/yourcallrule/releases/tag/${{ steps.vars.outputs.tag }})

      - name: Create Google Play Release Notes File
        run: |
          VERSION_CODE=$(echo "${{ steps.vars.outputs.tag }}" | sed 's/.*+//')
          mkdir -p release_notes/en-US
          echo "${{ steps.get_release_body.outputs.body }}" > release_notes/en-US/$VERSION_CODE.txt

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.yours.yourcallrule
          releaseFiles: "build_artifacts/app-release.aab"
          track: production
          releaseNotesDirectory: release_notes
# .github/workflows/2-public-distribution.yml

name: 2. Public Distribution (Smart Rerun)

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  distribute:
    name: Distribute to Public Channels
    runs-on: ubuntu-latest
    permissions:
      contents: read # 赋予 GITHUB_TOKEN 读取私有 Release 的权限

    steps:
      # --- 步骤 1: 智能获取目标 Release 标签 ---
      # 这个步骤在当前（私有）仓库中运行，所以使用 ${{ github.repository }}
      - name: Get Target Release Tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TARGET_TAG="${{ github.event.release.tag_name }}"
          else
            TARGET_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          fi
          echo "tag=${TARGET_TAG}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      # --- 步骤 2: 下载附件 ---
      # 从当前（私有）仓库的 Release 中下载，所以使用 ${{ github.repository }}
      - name: Download all assets from Private Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build_artifacts
          gh release download ${{ steps.vars.outputs.tag }} --repo ${{ github.repository }} --dir build_artifacts

      # --- 步骤 3: 在公开仓库创建或更新 Release ---
      - name: Create or Update Public Release in [choicenew/yourcallrule]
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }} # 使用有跨仓库权限的 PAT
        run: |
          # 明确定义目标仓库
          TARGET_REPO="choicenew/yourcallrule"
          TAG="${{ steps.vars.outputs.tag }}"

          # 从当前（私有）仓库 `${{ github.repository }}` 获取标题和内容
          echo "Fetching release notes from source repo: ${{ github.repository }}"
          TITLE=$(gh release view $TAG --repo ${{ github.repository }} --json name --jq .name)
          BODY=$(gh release view $TAG --repo ${{ github.repository }} --json body --jq .body)
          
          # 检查目标仓库 $TARGET_REPO 中 release 是否存在
          echo "Checking for existing release in target repo: $TARGET_REPO"
          EXISTING_RELEASE=$(gh release view $TAG --repo $TARGET_REPO --json id --jq .id 2>/dev/null)
          
          cd build_artifacts
          
          if [[ -z "$EXISTING_RELEASE" ]]; then
            echo "Release '$TAG' not found in $TARGET_REPO. Creating..."
            gh release create $TAG \
              --repo $TARGET_REPO \
              --title "$TITLE" \
              --notes "$BODY" \
              *.apk
          else
            echo "Release '$TAG' found in $TARGET_REPO. Updating assets..."
            gh release upload $TAG \
              --repo $TARGET_REPO \
              --clobber \
              *.apk
          fi

      # --- 步骤 4: 发布到 Telegram ---
      # 链接指向公开仓库
      - name: Send Telegram Message
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 **New Release Available: `${{ steps.vars.outputs.tag }}`**
            [View Public Release on GitHub](https://github.com/choicenew/yourcallrule/releases/tag/${{ steps.vars.outputs.tag }})

      # --- 步骤 5: 发布到 Google Play ---
      - name: Get Release Body for Google Play
        id: get_body_for_play
        run: |
          BODY=$(gh release view ${{ steps.vars.outputs.tag }} --repo ${{ github.repository }} --json body --jq .body)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Google Play Release Notes File
        run: |
          VERSION_CODE=$(echo "${{ steps.vars.outputs.tag }}" | sed 's/.*+//')
          mkdir -p release_notes/en-US
          echo "${{ steps.get_body_for_play.outputs.body }}" > release_notes/en-US/$VERSION_CODE.txt

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          # 修正：使用正确的包名 (请您最后确认一下这个是否正确)
          packageName: com.yours.yourcallyourrule 
          releaseFiles: "build_artifacts/app-release.aab"
          track: production
          releaseNotesDirectory: release_notes
# .github/workflows/2-public-distribution.yml

name: 2. Public Distribution

on:
  release:
    types: [published] # 当私有 Release 被发布时自动触发
  workflow_dispatch:   # 允许手动触发

jobs:
  distribute:
    name: Distribute to Public Channels
    runs-on: ubuntu-latest
    permissions:
      contents: read # 只需要读取私有 Release 的权限

    steps:
      # --- 步骤 1: 确定要分发的 Release 标签 ---
      # 这个步骤非常智能：如果是 release 事件触发，就用事件的 tag；如果是手动触发，就自动找最新的 tag。
      - name: Get Target Release Tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TARGET_TAG="${{ github.event.release.tag_name }}"
          else
            echo "Manual trigger detected. Fetching the latest release tag..."
            TARGET_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          fi
          
          if [[ -z "$TARGET_TAG" ]]; then
            echo "::error::Could not determine the target release tag."
            exit 1
          fi

          echo "Target Release Tag: $TARGET_TAG"
          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # --- 步骤 2: 从私有 Release 下载所有构建产物 ---
      - name: Download all artifacts from Private Release
        run: |
          mkdir -p build_artifacts
          echo "Downloading assets for tag ${{ steps.vars.outputs.tag }} from ${{ github.repository }}..."
          gh release download ${{ steps.vars.outputs.tag }} --repo ${{ github.repository }} --dir build_artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 步骤 3: 获取 Release 的详细信息 (标题和内容) ---
      - name: Get Release Title and Body
        id: release_info
        run: |
          # 使用 GITHUB_TOKEN 从私有仓库获取信息
          TITLE=$(gh release view ${{ steps.vars.outputs.tag }} --repo ${{ github.repository }} --json name --jq .name)
          BODY=$(gh release view ${{ steps.vars.outputs.tag }} --repo ${{ github.repository }} --json body --jq .body)
          VERSION_CODE=$(echo "${{ steps.vars.outputs.tag }}" | sed 's/.*+//')
          
          echo "title<<EOF" >> $GITHUB_OUTPUT
          echo "$TITLE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # 分发到各个渠道 (每个步骤都独立，失败不影响其他)
      # ==========================================================

      # --- 渠道 1: 发布到公开 GitHub Release ---
      - name: Publish to Public GitHub Release (choicenew/yourcallrule)
        uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          token: ${{ secrets.MY_PAT }} # 使用有跨仓库权限的 PAT
          repository: choicenew/yourcallrule
          tag: ${{ steps.vars.outputs.tag }}
          name: "Release ${{ steps.vars.outputs.tag }}"
          body: ${{ steps.release_info.outputs.body }}
          allowUpdates: true
          # 从下载的文件夹中上传 APKs
          artifacts: "build_artifacts/*.apk"
          
      # --- 渠道 2: 发布到 Telegram ---
      - name: Send Release Notes to Telegram
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 **New Release Available: `${{ steps.vars.outputs.tag }}`**

            **✨ What's New:**
            ```
            ${{ steps.release_info.outputs.body }}
            ```
            [View Full Release on GitHub](https://github.com/choicenew/yourcallrule/releases/tag/${{ steps.vars.outputs.tag }})

      - name: Send APK to Telegram
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: "build_artifacts/app-arm64-v8a-release.apk"
          caption: "Direct download for `${{ steps.vars.outputs.tag }}` (arm64-v8a)."
          
      # --- 渠道 3: 发布到 Google Play ---
      - name: Create Google Play Release Notes
        run: |
          mkdir -p release_notes/en-US
          echo "${{ steps.release_info.outputs.body }}" > release_notes/en-US/${{ steps.release_info.outputs.version_code }}.txt

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        continue-on-error: true
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          # 关键确认: 请务必确保这个包名是您 Google Play Console 中的真实包名
          packageName: com.yours.yourcallyourrule 
          releaseFiles: "build_artifacts/app-release.aab"
          track: production
          releaseNotesDirectory: release_notes
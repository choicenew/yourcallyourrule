flutter_native_splash:
  # 背景颜色
  color: "#FFFFFF"
  # 或者使用背景图片
  # background_image: "assets/background.png"
  
  # 图片 - 应用logo
  image: assets/app_logo.png
  
  # 图片的大小，单位是px
  # 默认为原始图片大小的一半
  # 如果图片太大或太小，可以调整这个值
  branding: assets/app_logo.png
  branding_mode: bottom
  
  # 可以添加品牌文本
  branding_dark: assets/app_logo.png
  
  # Android 12 特定配置
  android_12:
    # 图片
    image: assets/app_logo.png
    # 图标背景颜色
    icon_background_color: "#FFFFFF"
    # 图片的大小，单位是px
    # 默认为原始图片大小的一半
    # 如果图片太大或太小，可以调整这个值
    # image_size: 100
    
  # 设置启动屏幕的持续时间（毫秒）
  # 默认为0，表示不延迟
  # 设置为3000毫秒（3秒）以确保启动屏幕有足够时间显示
  android_screen_orientation: portrait
  fullscreen: true
  
  # 设置web的启动屏幕
  web: false
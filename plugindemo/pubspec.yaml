name: plugindemo
description: "A standalone demo app for the plugin feature."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_inappwebview: ^6.1.5
  path_provider: ^2.1.4
  path: ^1.7.0
  file_picker: ^10.2.1
  uuid: ^4.5.1
  flutter_riverpod: ^3.0.0
  logger: ^2.6.1
  intl: 0.20.2
  dio: ^5.8.0+1
  shared_preferences: ^2.3.2
  html: ^0.15.5
  http: ^1.3.0
  drift: 2.29.0
  sqlite3_flutter_libs: ^0.5.0
  flutter_colorpicker: ^1.1.0
  riverpod_annotation: ^4.0.1
  csv: ^6.0.0
  go_router: ^17.0.1
  flutter_js:
    path: ../临时参考/flutter_js-master
  native_dio_adapter: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.7.1
  drift_dev: 2.29.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

name: plugindemo
description: "A standalone demo app for the plugin feature."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  flutter_inappwebview: ^6.2.0-beta.3
  path_provider: ^2.1.6
  path: ^1.7.0
  file_picker: ^13.1.0
  uuid: ^4.6.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.0
  logger: ^2.8.0
  intl: ^0.20.3
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  html: ^0.15.5
  http: ^1.3.0
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.5.0
  flutter_colorpicker: ^1.1.0
  csv: ^8.0.0
  go_router: ^18.1.0
  flutter_js: ^0.8.7
  native_dio_adapter: ^1.8.0
  ua_client_hints: ^1.7.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  material_ui: any
  cupertino_ui: any
  yaml: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.35.1
  riverpod_generator: ^4.0.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

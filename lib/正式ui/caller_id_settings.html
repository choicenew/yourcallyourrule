<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>来电识别设置 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #9C27B0;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #9C27B0;
        }
        .color-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .color-circle.selected {
            border-color: #673AB7;
        }
        .caller-preview {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-primary text-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="flex items-center">
                        <i class="fas fa-arrow-left text-white mr-4"></i>
                        <i class="fas fa-id-card text-white text-xl mr-2"></i>
                        <span class="text-xl font-bold">来电识别设置</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="bg-white text-primary px-4 py-2 rounded-full hover:bg-opacity-90 transition">
                        <i class="fas fa-save mr-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mx-auto px-4 py-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 左侧设置面板 -->
            <div class="space-y-6">
                <!-- 来电显示开关 -->
                <div class="bg-white rounded-xl shadow-md p-4 mb-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-lg font-semibold">启用自定义来电显示</h2>
                            <p class="text-gray-600 text-sm">开启后将使用自定义样式显示来电信息</p>
                        </div>
                        <div class="relative inline-block w-14 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="callerid-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer right-8" checked>
                            <label for="callerid-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                        </div>
                    </div>
                </div>

                <!-- 样式设置 -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
                    <div class="p-4 border-b border-gray-100 bg-gray-50">
                        <h3 class="font-semibold">显示样式设置</h3>
                    </div>
                    <div class="p-4 space-y-6">
                        <!-- 显示模式 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">显示模式</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition cursor-pointer">
                                    <input type="radio" name="display-mode" class="mr-3" checked>
                                    <div>
                                        <div class="font-medium">浮窗模式</div>
                                        <div class="text-xs text-gray-600">在屏幕上方显示浮动窗口</div>
                                    </div>
                                </label>
                                <label class="flex items-center p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition cursor-pointer">
                                    <input type="radio" name="display-mode" class="mr-3">
                                    <div>
                                        <div class="font-medium">全屏模式</div>
                                        <div class="text-xs text-gray-600">替换系统来电界面</div>
                                    </div>
                                </label>
                            </div>
                        </div>

                        <!-- 主题颜色 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">主题颜色</label>
                            <div class="flex space-x-3">
                                <div class="color-circle" style="background-color: #FFB74D;"></div>
                                <div class="color-circle" style="background-color: #93CB80;"></div>
                                <div class="color-circle" style="background-color: #039BE5;"></div>
                                <div class="color-circle" style="background-color: #E53935;"></div>
                                <div class="color-circle selected" style="background-color: #9C27B0;"></div>
                                <div class="color-circle" style="background-color: #673AB7;"></div>
                                <div class="color-circle bg-gradient-to-r from-purple-500 to-pink-500"></div>
                                <div class="color-circle bg-gradient-to-r from-cyan-500 to-blue-500"></div>
                            </div>
                        </div>

                        <!-- 透明度 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">背景透明度: <span id="opacityValue">80%</span></label>
                            <input type="range" min="0" max="100" value="80" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                        </div>

                        <!-- 圆角大小 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">圆角大小: <span id="radiusValue">中等</span></label>
                            <div class="flex space-x-3">
                                <label class="flex flex-col items-center">
                                    <input type="radio" name="corner-radius" class="mb-2">
                                    <div class="w-12 h-6 bg-gray-200 rounded-sm"></div>
                                    <span class="text-xs mt-1">无</span>
                                </label>
                                <label class="flex flex-col items-center">
                                    <input type="radio" name="corner-radius" class="mb-2">
                                    <div class="w-12 h-6 bg-gray-200 rounded-md"></div>
                                    <span class="text-xs mt-1">小</span>
                                </label>
                                <label class="flex flex-col items-center">
                                    <input type="radio" name="corner-radius" class="mb-2" checked>
                                    <div class="w-12 h-6 bg-gray-200 rounded-lg"></div>
                                    <span class="text-xs mt-1">中</span>
                                </label>
                                <label class="flex flex-col items-center">
                                    <input type="radio" name="corner-radius" class="mb-2">
                                    <div class="w-12 h-6 bg-gray-200 rounded-xl"></div>
                                    <span class="text-xs mt-1">大</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 内容设置 -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
                    <div class="p-4 border-b border-gray-100 bg-gray-50">
                        <h3 class="font-semibold">内容设置</h3>
                    </div>
                    <div class="p-4 space-y-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="font-medium">显示联系人头像</div>
                                <div class="text-sm text-gray-600">如果联系人有头像则显示</div>
                            </div>
                            <div class="relative inline-block w-12 align-middle select-none">
                                <input type="checkbox" name="toggle" id="avatar-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7" checked>
                                <label for="avatar-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="font-medium">显示号码归属地</div>
                                <div class="text-sm text-gray-600">显示电话号码的归属地信息</div>
                            </div>
                            <div class="relative inline-block w-12 align-middle select-none">
                                <input type="checkbox" name="toggle" id="location-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7" checked>
                                <label for="location-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="font-medium">显示标记信息</div>
                                <div class="text-sm text-gray-600">显示号码的标记信息（如骚扰电话）</div>
                            </div>
                            <div class="relative inline-block w-12 align-middle select-none">
                                <input type="checkbox" name="toggle" id="tag-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7" checked>
                                <label for="tag-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="font-medium">显示拦截按钮</div>
                                <div class="text-sm text-gray-600">在来电界面显示快速拦截按钮</div>
                            </div>
                            <div class="relative inline-block w-12 align-middle select-none">
                                <input type="checkbox" name="toggle" id="block-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7" checked>
                                <label for="block-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 高级设置 -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
                    <div class="p-4 border-b border-gray-100 bg-gray-50">
                        <h3 class="font-semibold">高级设置</h3>
                    </div>
                    <div class="p-4 space-y-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <div class="font-medium">自动隐藏</div>
                                <div class="text-sm text-gray-600">5秒后自动隐藏浮窗</div>
                            </div>
                            <div class="relative inline-block w-12 align-middle select-none">
                                <input type="checkbox" name="toggle" id="autohide-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer right-7">
                                <label for="autohide-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer"></label>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">浮窗位置</label>
                            <select class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                <option>顶部居中</option>
                                <option>顶部靠左</option>
                                <option>顶部靠右</option>
                                <option>中部居中</option>
                                <option>底部居中</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">浮窗大小</label>
                            <select class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                                <option>小</option>
                                <option selected>中</option>
                                <option>大</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧预览面板 -->
            <div class="bg-gray-800 rounded-xl p-4 shadow-md h-[600px] relative">
                <div class="text-center text-white mb-4">预览效果</div>
                <!-- 手机状态栏 -->
                <div class="bg-black bg-opacity-80 text-white p-2 flex justify-between items-center text-xs rounded-t-xl">
                    <div>10:30</div>
                    <div class="flex space-x-1">
                        <i class="fas fa-wifi"></i>
                        <i class="fas fa-signal"></i>
                        <i class="fas fa-battery-three-quarters"></i>
                    </div>
                </div>
                
                <!-- 来电显示预览 -->
                <div id="callerIdPreview" class="caller-preview bg-primary bg-opacity-80 p-4 text-white absolute top-[20%] left-[10%] right-[10%] rounded-xl shadow-lg">
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center mr-3">
                            <i class="fas fa-user text-primary text-xl"></i>
                        </div>
                        <div>
                            <h3 class="font-semibold">未知号码</h3>
                            <p class="text-sm opacity-90">+86 138****1234</p>
                            <div class="flex items-center mt-1">
                                <i class="fas fa-map-marker-alt text-xs mr-1"></i>
                                <span class="text-xs">北京市</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 flex">
                        <span class="text-xs bg-white bg-opacity-20 px-2 py-1 rounded-full mr-2">可疑号码</span>
                        <span class="text-xs bg-white bg-opacity-20 px-2 py-1 rounded-full">推销电话</span>
                    </div>
                    <div class="flex justify-between mt-3">
                        <button class="bg-red-500 text-white px-3 py-1 rounded-full text-sm shadow-sm">
                            <i class="fas fa-ban mr-1"></i> 拒接
                        </button>
                        <button class="bg-secondary text-white px-3 py-1 rounded-full text-sm shadow-sm hover:bg-secondary/90 transition-colors">
                            <i class="fas fa-phone-alt mr-1"></i> 接听
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-md border-t border-gray-200">
        <div class="container mx-auto">
            <div class="flex justify-around items-center py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="rules_management.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-list-alt text-xl"></i>
                    <span class="text-xs mt-1">规则</span>
                </a>
                <a href="call_history.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">历史</span>
                </a>
                <a href="settings.html" class="flex flex-col items-center text-primary">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 颜色选择逻辑
            const colorCircles = document.querySelectorAll('.color-circle');
            const callerIdPreview = document.getElementById('callerIdPreview');
            
            colorCircles.forEach(circle => {
                circle.addEventListener('click', function() {
                    // 移除所有选中状态
                    colorCircles.forEach(c => c.classList.remove('selected'));
                    // 添加当前选中状态
                    this.classList.add('selected');
                    
                    // 获取选中的颜色
                    const style = window.getComputedStyle(this);
                    let color = style.backgroundColor;
                    
                    // 如果是渐变色，需要特殊处理
                    if (this.classList.contains('bg-gradient-to-r')) {
                        if (this.style.backgroundImage.includes('purple')) {
                            // 更新预览的渐变色为紫色到粉色
                            callerIdPreview.style.background = 'linear-gradient(to right, rgb(168, 85, 247), rgb(236, 72, 153))';
                        } else {
                            // 更新预览的渐变色为青色到蓝色
                            callerIdPreview.style.background = 'linear-gradient(to right, rgb(6, 182, 212), rgb(59, 130, 246))';
                        }
                    } else {
                        // 更新预览的背景色
                        callerIdPreview.style.background = color;
                    }
                });
            });
            
            // 透明度滑块
            const opacitySlider = document.querySelector('input[type="range"]');
            const opacityValue = document.getElementById('opacityValue');
            
            opacitySlider.addEventListener('input', function() {
                const opacity = this.value / 100;
                opacityValue.textContent = `${this.value}%`;
                callerIdPreview.style.opacity = opacity;
            });
            
            // 圆角选择
            const radiusInputs = document.querySelectorAll('input[name="corner-radius"]');
            const radiusValue = document.getElementById('radiusValue');
            const radiusValues = ['无', '小', '中', '大'];
            const radiusSizes = ['0px', '8px', '16px', '24px'];
            
            radiusInputs.forEach((input, index) => {
                input.addEventListener('change', function() {
                    if (this.checked) {
                        radiusValue.textContent = radiusValues[index];
                        callerIdPreview.style.borderRadius = radiusSizes[index];
                    }
                });
            });
            
            // 开关逻辑
            const callerIdToggle = document.getElementById('callerid-toggle');
            const settingsSections = document.querySelectorAll('.bg-white.rounded-xl.shadow-md.overflow-hidden.mb-6');
            const previewPanel = document.querySelector('.bg-gray-800.rounded-xl');
            
            callerIdToggle.addEventListener('change', function() {
                const isEnabled = this.checked;
                settingsSections.forEach(section => {
                    section.style.opacity = isEnabled ? '1' : '0.5';
                    section.style.pointerEvents = isEnabled ? 'auto' : 'none';
                });
                previewPanel.style.opacity = isEnabled ? '1' : '0.5';
                callerIdPreview.style.display = isEnabled ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>

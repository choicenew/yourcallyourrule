<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
    <style>
        .chart-container {
            @apply bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="settings.html" class="text-gray-600 hover:text-primary mr-2">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <i class="fas fa-chart-bar text-primary text-xl"></i>
                    <h1 class="text-xl font-semibold text-dark">数据统计</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <select class="border rounded-md px-3 py-1 text-sm">
                        <option>最近7天</option>
                        <option>最近30天</option>
                        <option>自定义范围</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="chart-container">
                <h3 class="text-lg font-medium mb-4">拦截趋势</h3>
                <canvas id="interceptionTrend"></canvas>
            </div>
            <div class="chart-container">
                <h3 class="text-lg font-medium mb-4">拦截类型分布</h3>
                <canvas id="interceptionType"></canvas>
            </div>
        </div>
    </main>

    <script>
        // 示例图表数据
        new Chart(document.getElementById('interceptionTrend'), {
            type: 'line',
            data: {
                labels: ['周一','周二','周三','周四','周五','周六','周日'],
                datasets: [{
                    label: '拦截次数',
                    data: [12, 19, 3, 5, 2, 3, 8],
                    borderColor: '#FFB74D',
                    tension: 0.4
                }]
            }
        });

        new Chart(document.getElementById('interceptionType'), {
            type: 'doughnut',
            data: {
                labels: ['广告推销', '诈骗电话', '快递外卖', '其他'],
                datasets: [{
                    data: [45, 30, 15, 10],
                    backgroundColor: ['#FFB74D', '#6D4C41', '#FF7043', '#E53935']
                }]
            }
        });
    </script>
</body>
</html>

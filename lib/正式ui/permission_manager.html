<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权限管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">
    <div class="app-frame rounded-3xl shadow-xl max-w-2xl mx-auto">
        <!-- 头部 -->
        <div class="bg-white shadow-md">
            <div class="container mx-auto px-4 py-4">
                <div class="flex items-center space-x-4">
                    <a href="settings.html" class="text-gray-600">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <h1 class="text-xl font-semibold">应用权限管理</h1>
                </div>
            </div>
        </div>

        <!-- 权限列表 -->
        <div class="p-6 space-y-4">
            <!-- 通讯录权限 -->
            <div class="bg-white rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-address-book text-primary text-xl"></i>
                    <div>
                        <h3 class="font-medium">通讯录访问</h3>
                        <p class="text-sm text-gray-500">用于来电识别和规则匹配</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-success text-sm">已授权</span>
                    <button class="w-8 h-8 bg-danger/10 text-danger rounded-full">
                        <i class="fas fa-ban"></i>
                    </button>
                </div>
            </div>

            <!-- 短信权限 -->
            <div class="bg-white rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-comment-sms text-primary text-xl"></i>
                    <div>
                        <h3 class="font-medium">短信读取</h3>
                        <p class="text-sm text-gray-500">用于短信过滤和规则应用</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-danger text-sm">未授权</span>
                    <button class="w-8 h-8 bg-success/10 text-success rounded-full">
                        <i class="fas fa-check"></i>
                    </button>
                </div>
            </div>

            <!-- 电话权限 -->
            <div class="bg-white rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-phone-volume text-primary text-xl"></i>
                    <div>
                        <h3 class="font-medium">电话管理</h3>
                        <p class="text-sm text-gray-500">拦截和接听来电</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-warning text-sm">部分授权</span>
                    <button class="w-8 h-8 bg-primary/10 text-primary rounded-full">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>

            <!-- 存储权限 -->
            <div class="bg-white rounded-xl p-4 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-database text-primary text-xl"></i>
                    <div>
                        <h3 class="font-medium">本地存储</h3>
                        <p class="text-sm text-gray-500">规则配置和备份文件存储</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-success text-sm">已授权</span>
                    <button class="w-8 h-8 bg-danger/10 text-danger rounded-full">
                        <i class="fas fa-ban"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 权限说明 -->
        <div class="p-6">
            <div class="bg-info/10 text-info p-4 rounded-xl text-sm">
                <i class="fas fa-info-circle mr-2"></i>
                权限设置变更可能需要重新启动应用才能生效
            </div>
        </div>
    </div>
</body>
</html>

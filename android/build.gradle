// 解决 AGP 9.0+ 废弃 'proguard-android.txt' 问题，兼容所有 Pub.dev 三方插件（如 flutter_inappwebview_android）
// 第一重防线：在所有子项目评估之前，通过 Gradle 生命周期钩子自动将 'proguard-android.txt' 修正为 'proguard-android-optimize.txt'
gradle.beforeProject { p ->
    if (p != rootProject && p.buildFile.exists()) {
        try {
            def text = p.buildFile.text
            if (text.contains("proguard-android.txt")) {
                p.buildFile.text = text.replace("proguard-android.txt", "proguard-android-optimize.txt")
            }
        } catch (ignored) {
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        exclude group: 'org.chromium.net', module: 'cronet-shared'
    }
}
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)

    plugins.withId('com.android.library') {
        // 第二重防线：当三方 Android Library 插件加载后，对 android Extension 的 getDefaultProguardFile 进行 MetaClass 拦截
        try {
            def androidExt = project.extensions.findByName('android')
            if (androidExt != null) {
                def baseClass = androidExt.getClass()
                def originalMethod = baseClass.getMethod("getDefaultProguardFile", java.lang.String.class)
                androidExt.metaClass.getDefaultProguardFile = { name ->
                    def targetName = (name == 'proguard-android.txt') ? 'proguard-android-optimize.txt' : name
                    return originalMethod.invoke(delegate, targetName)
                }
            }
        } catch (ignored) {
        }

        androidComponents {
            finalizeDsl { extension ->
                extension.compileSdk = 37
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = "17"
        targetCompatibility = "17"
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}

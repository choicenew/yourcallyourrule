// 解决 AGP 9.0+ 拦截并替换废弃的 'proguard-android.txt'，兼容所有 Pub.dev 三方插件（如 flutter_inappwebview_android）
try {
    def baseClass = Class.forName("com.android.build.gradle.BaseExtension")
    def originalMethod = baseClass.getMethod("getDefaultProguardFile", java.lang.String.class)
    baseClass.metaClass.getDefaultProguardFile = { name ->
        def targetName = (name == 'proguard-android.txt') ? 'proguard-android-optimize.txt' : name
        return originalMethod.invoke(delegate, targetName)
    }
} catch (ignored) {
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        exclude group: 'org.chromium.net', module: 'cronet-shared'
    }
}
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)

    plugins.withId('com.android.library') {
        androidComponents {
            finalizeDsl { extension ->
                extension.compileSdk = 37
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = "17"
        targetCompatibility = "17"
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}

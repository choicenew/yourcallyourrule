plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id "dev.flutter.flutter-gradle-plugin"
    // 官方依据：在 AGP 9.0 且 builtInKotlin=true 模式下，禁止手动应用 Kotlin 插件，否则会报错冲突
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}


android {
    namespace = "com.yours.yourcallyourrule"
    compileSdk 37
    ndkVersion flutter.ndkVersion

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            } else {
                def localStoreFile = localProperties.getProperty('key.storeFile')
                if (localStoreFile != null) {
                    storeFile file(localStoreFile)
                    storePassword localProperties.getProperty('key.storePassword')
                    keyAlias localProperties.getProperty('key.keyAlias')
                    keyPassword localProperties.getProperty('key.keyPassword')
                }
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        // 核心事实依据：设置 targetCompatibility 为 17
        // 在 builtInKotlin=true 下，Kotlin 的 jvmTarget 将会自动跟随这个值
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.yours.yourcallyourrule"
        minSdk 30
        targetSdk 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        
        manifestPlaceholders += [
                'appAuthRedirectScheme': 'com.yours.yourcallyourrule'
        ]
    }

    packaging {
        excludes += 'META-INF/DEPENDENCIES'
        excludes += 'META-INF/LICENSE*'
        excludes += 'META-INF/NOTICE*'
        excludes += 'META-INF/ASL2.0'
        pickFirsts += 'lib/x86/libopenh264.so'
        pickFirsts += 'lib/x86_64/libopenh264.so'
        pickFirsts += 'lib/armeabi-v7a/libopenh264.so'
        pickFirsts += 'lib/arm64-v8a/libopenh264.so'
        pickFirsts += 'lib/arm64-v8a/libc++_shared.so'
        pickFirsts += 'lib/armeabi-v7a/libc++_shared.so'
        pickFirsts += 'lib/x86_64/libc++_shared.so'
        pickFirsts += 'lib/x86/libc++_shared.so'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }
    }
}

// 遵循 AGP 9.0 官方标准
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
*/
    
    namespace = "com.yours.yourcallyourrule"
    compileSdk 36
    ndkVersion = '28.0.12433566 rc1'

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        multiDexEnabled true //local notification
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.yours.yourcallyourrule"
        minSdk 30
        targetSdk 36
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders += [
                'appAuthRedirectScheme': 'com.yours.yourcallyourrule'
        ]
    }
    // 一个更健壮的配置，可以预防多种常见的重复文件问题
    packaging {
        excludes += 'META-INF/DEPENDENCIES'
        excludes += 'META-INF/LICENSE'
        excludes += 'META-INF/LICENSE.txt'
        excludes += 'META-INF/license.txt'
        excludes += 'META-INF/NOTICE'
        excludes += 'META-INF/NOTICE.txt'
        excludes += 'META-INF/notice.txt'
        excludes += 'META-INF/ASL2.0'
        excludes += 'META-INF/*.kotlin_module'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
                  minifyEnabled true
      shrinkResources true
    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
           signingConfig signingConfigs.release

            minifyEnabled true
            shrinkResources true

          proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildToolsVersion '36.0.0'
}

flutter {
    source = "../.."
}

dependencies {

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'  // 指定 Kotlin
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'

    implementation 'androidx.window:window:1.4.0'//local notification
    implementation 'androidx.window:window-java:1.4.0'//local notification
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' //local notification
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.android.gms:play-services-ads:24.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
}
plugins {
    id "com.android.application"
    id "kotlin-android"

    id "dev.flutter.flutter-gradle-plugin"

}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}


android {
/*
    signingConfigs {
        release {
            storeFile file('C:\\Users\\Ngokel\\Desktop\\en\\test\\sign\\upload_keystore.jks')
            storePassword 'slroeeb@gmail.com'
            keyAlias 'yourcallyourrule'
            keyPassword 'slroeeb@gmail.com'
        }
    }
*/

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    
    namespace = "com.yours.yourcallyourrule"
    compileSdk 35
    ndkVersion = '27.1.12297006'

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        multiDexEnabled true //local notification
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.yours.yourcallyourrule"
        minSdk 30
        targetSdk 34
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders += [
                'appAuthRedirectScheme': 'com.yours.yourcallyourrule'
        ]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
           signingConfig signingConfigs.release

            minifyEnabled true
            shrinkResources true

          proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildToolsVersion '34.0.0'
}

flutter {
    source = "../.."
}

dependencies {

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'  // 指定 Kotlin
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'

    implementation 'androidx.window:window:1.4.0'//local notification
    implementation 'androidx.window:window-java:1.4.0'//local notification
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' //local notification
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.android.gms:play-services-ads:24.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
}
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通话记录 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9C27B0',  // 紫色主题
                        secondary: '#673AB7',
                        accent: '#E040FB',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
    <style>
        .timeline-item {
            position: relative;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -4px;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #e5e7eb;
        }
        .call-card {
            @apply bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-primary text-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <a href="index.html" class="text-gray-600 hover:text-primary mr-2">
                        <i class="fas fa-arrow-left text-xl"></i>
                    </a>
                    <i class="fas fa-history text-primary text-xl"></i>
                    <h1 class="text-xl font-semibold text-dark">通话记录</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-gray-600 hover:text-primary transition">
                        <i class="fas fa-filter"></i>
                    </button>
                    <button class="text-gray-600 hover:text-primary transition">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 标签页 -->
    <div class="bg-white border-b">
        <div class="container mx-auto px-4">
            <div class="flex overflow-x-auto">
                <button class="py-3 px-4 border-b-2 border-primary text-primary font-medium whitespace-nowrap">
                    全部
                </button>
                <button class="py-3 px-4 border-b-2 border-transparent text-gray-500 font-medium whitespace-nowrap">
                    已接通
                </button>
                <button class="py-3 px-4 border-b-2 border-transparent text-gray-500 font-medium whitespace-nowrap">
                    未接来电
                </button>
                <button class="py-3 px-4 border-b-2 border-transparent text-gray-500 font-medium whitespace-nowrap">
                    已拦截
                </button>
                <button class="py-3 px-4 border-b-2 border-transparent text-gray-500 font-medium whitespace-nowrap">
                    已拨出
                </button>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-6">
        <!-- 统计卡片 -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white rounded-xl p-4 shadow-sm">
                <div class="text-center">
                    <div class="text-2xl font-bold text-danger">128</div>
                    <div class="text-sm text-gray-600">已拦截</div>
                </div>
            </div>
            <div class="bg-white rounded-xl p-4 shadow-sm">
                <div class="text-center">
                    <div class="text-2xl font-bold text-success">256</div>
                    <div class="text-sm text-gray-600">已接通</div>
                </div>
            </div>
        </div>

        <!-- 时间轴布局 -->
        <div class="relative pl-8 border-l-2 border-gray-200 ml-4">
            <!-- 日期分组 -->
            <div class="text-sm text-gray-600 mb-2">今天</div>

            <!-- 通话记录项 -->
            <div class="relative mb-8 timeline-item">
                <div class="absolute w-3 h-3 bg-primary rounded-full -left-1.5 top-5"></div>
                <div class="call-card">
                    <div class="flex justify-between items-start">
                        <div class="flex items-start space-x-4">
                            <div class="bg-danger bg-opacity-10 p-3 rounded-full">
                                <i class="fas fa-ban text-danger"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold">+86 13800138000</h3>
                                <p class="text-sm text-gray-600">骚扰电话</p>
                                <p class="text-xs text-gray-400 mt-1">14:30</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-danger text-sm">已拦截</span>
                            <div class="flex mt-2 space-x-2">
                                <button class="text-gray-400 hover:text-primary transition">
                                    <i class="fas fa-info-circle"></i>
                                </button>
                                <button class="text-gray-400 hover:text-danger transition">
                                    <i class="fas fa-ban"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="relative mb-8 timeline-item">
                <div class="absolute w-3 h-3 bg-primary rounded-full -left-1.5 top-5"></div>
                <div class="call-card">
                    <div class="flex justify-between items-start">
                        <div class="flex items-start space-x-4">
                            <div class="bg-success bg-opacity-10 p-3 rounded-full">
                                <i class="fas fa-phone text-success"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold">+86 13900139000</h3>
                                <p class="text-sm text-gray-600">未知号码</p>
                                <p class="text-xs text-gray-400 mt-1">13:45</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-success text-sm">已接通</span>
                            <div class="flex mt-2 space-x-2">
                                <button class="text-gray-400 hover:text-primary transition">
                                    <i class="fas fa-info-circle"></i>
                                </button>
                                <button class="text-gray-400 hover:text-danger transition">
                                    <i class="fas fa-ban"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="relative mb-8 timeline-item">
                <div class="absolute w-3 h-3 bg-primary rounded-full -left-1.5 top-5"></div>
                <div class="call-card">
                    <div class="flex justify-between items-start">
                        <div class="flex items-start space-x-4">
                            <div class="bg-info bg-opacity-10 p-3 rounded-full">
                                <i class="fas fa-phone-alt text-info"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold">张三</h3>
                                <p class="text-sm text-gray-600">+86 13700137000</p>
                                <p class="text-xs text-gray-400 mt-1">10:15</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-info text-sm">已拨出</span>
                            <div class="flex mt-2 space-x-2">
                                <button class="text-gray-400 hover:text-primary transition">
                                    <i class="fas fa-info-circle"></i>
                                </button>
                                <button class="text-gray-400 hover:text-success transition">
                                    <i class="fas fa-phone"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 日期分组 -->
            <div class="text-sm text-gray-600 mb-2 mt-6">昨天</div>

            <div class="relative mb-8 timeline-item">
                <div class="absolute w-3 h-3 bg-primary rounded-full -left-1.5 top-5"></div>
                <div class="call-card">
                    <div class="flex justify-between items-start">
                        <div class="flex items-start space-x-4">
                            <div class="bg-warning bg-opacity-10 p-3 rounded-full">
                                <i class="fas fa-phone-slash text-warning"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold">李四</h3>
                                <p class="text-sm text-gray-600">+86 13600136000</p>
                                <p class="text-xs text-gray-400 mt-1">昨天 18:30</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-warning text-sm">未接来电</span>
                            <div class="flex mt-2 space-x-2">
                                <button class="text-gray-400 hover:text-primary transition">
                                    <i class="fas fa-info-circle"></i>
                                </button>
                                <button class="text-gray-400 hover:text-success transition">
                                    <i class="fas fa-phone"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="relative mb-8 timeline-item">
                <div class="absolute w-3 h-3 bg-primary rounded-full -left-1.5 top-5"></div>
                <div class="call-card">
                    <div class="flex justify-between items-start">
                        <div class="flex items-start space-x-4">
                            <div class="bg-danger bg-opacity-10 p-3 rounded-full">
                                <i class="fas fa-ban text-danger"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold">+86 10086</h3>
                                <p class="text-sm text-gray-600">电信诈骗</p>
                                <p class="text-xs text-gray-400 mt-1">昨天 15:20</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-danger text-sm">已拦截</span>
                            <div class="flex mt-2 space-x-2">
                                <button class="text-gray-400 hover:text-primary transition">
                                    <i class="fas fa-info-circle"></i>
                                </button>
                                <button class="text-gray-400 hover:text-danger transition">
                                    <i class="fas fa-ban"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 日期分组 -->
            <div class="text-sm text-gray-600 mb-2 mt-6">更早</div>

            <div class="relative mb-8 timeline-item">
                <div class="absolute w-3 h-3 bg-primary rounded-full -left-1.5 top-5"></div>
                <div class="call-card">
                    <div class="flex justify-between items-start">
                        <div class="flex items-start space-x-4">
                            <div class="bg-success bg-opacity-10 p-3 rounded-full">
                                <i class="fas fa-phone text-success"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold">王五</h3>
                                <p class="text-sm text-gray-600">+86 13500135000</p>
                                <p class="text-xs text-gray-400 mt-1">7月19日 09:45</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-success text-sm">已接通</span>
                            <div class="flex mt-2 space-x-2">
                                <button class="text-gray-400 hover:text-primary transition">
                                    <i class="fas fa-info-circle"></i>
                                </button>
                                <button class="text-gray-400 hover:text-success transition">
                                    <i class="fas fa-phone"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 加载更多 -->
        <div class="text-center mt-4 mb-20">
            <button class="text-primary hover:text-opacity-80 transition">
                加载更多 <i class="fas fa-chevron-down ml-1"></i>
            </button>
        </div>
    </main>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-md border-t border-gray-200">
        <div class="container mx-auto">
            <div class="flex justify-around items-center py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="rules.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-list-alt text-xl"></i>
                    <span class="text-xs mt-1">规则</span>
                </a>
                <a href="call_history.html" class="flex flex-col items-center text-primary">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">历史</span>
                </a>
                <a href="settings.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

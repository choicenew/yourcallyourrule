<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - Your Call Your Rule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB74D',
                        secondary: '#6D4C41',
                        accent: '#FF7043',
                        danger: '#E53935',
                        success: '#43A047',
                        warning: '#FFB300',
                        info: '#039BE5',
                        light: '#F5F5F5',
                        dark: '#212121'
                    }
                }
            }
        }
    </script>
    <style>
        .settings-card {
            @apply bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #FFB74D;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #FFB74D;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <!-- 顶部导航栏 -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-cog text-primary text-xl"></i>
                    <h1 class="text-xl font-semibold text-dark">设置</h1>
                </div>
                <a href="index.html" class="text-primary hover:text-opacity-80">
                    <i class="fas fa-times text-xl"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-8">
        <!-- 用户信息 -->
        <section class="mb-8 settings-card">
            <div class="flex items-center">
                <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mr-4">
                    <span class="text-white text-2xl font-bold">U</span>
                </div>
                <div>
                    <h3 class="text-lg font-medium text-dark">用户名</h3>
                    <p class="text-secondary text-sm">user@example.com</p>
                </div>
                <a href="#" class="ml-auto text-primary">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </div>
        </section>

        <!-- 功能设置 -->
        <h3 class="text-lg font-medium text-dark mb-4">功能设置</h3>
        <div class="space-y-4 mb-8">
            <!-- 来电设置 -->
            <a href="call_settings.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-phone text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">来电设置</h4>
                    <p class="text-sm text-gray-500">来电识别、过滤和拦截设置</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </a>

            <!-- 短信设置 -->
            <a href="sms_management.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-sms text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">短信设置</h4>
                    <p class="text-sm text-gray-500">短信过滤和关键词拦截</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </a>

            <!-- 规则管理 -->
            <a href="rules_management.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-purple-500 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-list-alt text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">规则管理</h4>
                    <p class="text-sm text-gray-500">黑白名单和拦截规则设置</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </a>

            <!-- 联系人管理 -->
            <a href="contacts_management.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-address-book text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">联系人管理</h4>
                    <p class="text-sm text-gray-500">管理联系人和订阅</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </a>

            <!-- 通话记录 -->
            <a href="call_history.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-cyan-500 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-history text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">通话记录</h4>
                    <p class="text-sm text-gray-500">查看和管理通话历史</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </a>

            <!-- 插件管理 -->
            <a href="plugin_management.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-puzzle-piece text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">插件管理</h4>
                    <p class="text-sm text-gray-500">管理和配置插件</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </a>
        </div>

        <!-- 系统设置 -->
        <h3 class="text-lg font-medium text-dark mb-4">系统设置</h3>
        <div class="space-y-4 mb-8">
            <!-- 语言设置 -->
            <a href="language_settings.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-teal-500 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-language text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">语言设置</h4>
                    <p class="text-sm text-gray-500">更改应用语言</p>
                </div>
                <div class="ml-auto flex items-center">
                    <span class="text-sm text-gray-500 mr-2">简体中文</span>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </div>
            </a>

            <!-- 云同步 -->
            <a href="cloud_sync.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-blue-400 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-cloud-upload-alt text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">云同步</h4>
                    <p class="text-sm text-gray-500">同步设置和数据</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </a>

            <!-- 通知设置 -->
            <div class="settings-card flex items-center justify-between p-4">
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-red-400 rounded-full flex items-center justify-center mr-4">
                        <i class="fas fa-bell text-white"></i>
                    </div>
                    <div>
                        <h4 class="font-medium text-dark">通知设置</h4>
                        <p class="text-sm text-gray-500">管理应用通知</p>
                    </div>
                </div>
                <div class="relative inline-block w-12 align-middle select-none">
                    <input type="checkbox" id="notifications" checked class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-2 appearance-none cursor-pointer right-0">
                    <label for="notifications" class="toggle-label block overflow-hidden h-6 rounded-full bg-primary cursor-pointer"></label>
                </div>
            </div>

            <!-- 深色模式 -->
            <div class="settings-card flex items-center justify-between p-4">
                <div class="flex items-center">
                    <div class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center mr-4">
                        <i class="fas fa-moon text-white"></i>
                    </div>
                    <div>
                        <h4 class="font-medium text-dark">深色模式</h4>
                        <p class="text-sm text-gray-500">切换深色/浅色主题</p>
                    </div>
                </div>
                <div class="relative inline-block w-12 align-middle select-none">
                    <input type="checkbox" id="dark-mode" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-2 appearance-none cursor-pointer right-0">
                    <label for="dark-mode" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                </div>
            </div>
        </div>

        <!-- 关于和帮助 -->
        <h3 class="text-lg font-medium text-dark mb-4">关于和帮助</h3>
        <div class="space-y-4 mb-20">
            <!-- 关于我们 -->
            <a href="about.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-gray-500 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-info-circle text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">关于我们</h4>
                    <p class="text-sm text-gray-500">应用信息和版本</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </a>

            <!-- 帮助中心 -->
            <a href="help.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-question-circle text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">帮助中心</h4>
                    <p class="text-sm text-gray-500">常见问题和支持</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </a>

            <!-- 隐私政策 -->
            <a href="privacy.html" class="settings-card flex items-center p-4">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-shield-alt text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-dark">隐私政策</h4>
                    <p class="text-sm text-gray-500">了解我们如何保护您的数据</p>
                </div>
                <i class="fas fa-chevron-right text-gray-400 ml-auto"></i>
            </a>

            <!-- 退出登录 -->
            <button class="settings-card w-full flex items-center p-4 text-left">
                <div class="w-10 h-10 bg-red-500 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-sign-out-alt text-white"></i>
                </div>
                <div>
                    <h4 class="font-medium text-danger">退出登录</h4>
                </div>
            </button>
        </div>
    </main>

    <!-- 底部导航栏 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white shadow-md border-t border-gray-200">
        <div class="container mx-auto">
            <div class="flex justify-around items-center py-3">
                <a href="index.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">首页</span>
                </a>
                <a href="rules_management.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-list-alt text-xl"></i>
                    <span class="text-xs mt-1">规则</span>
                </a>
                <a href="call_history.html" class="flex flex-col items-center text-gray-500 hover:text-primary transition">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">历史</span>
                </a>
                <a href="settings.html" class="flex flex-col items-center text-primary">
                    <i class="fas fa-cog text-xl"></i>
                    <span class="text-xs mt-1">设置</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

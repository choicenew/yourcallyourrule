name: pyro_sms_ui
description: UI screens, settings panels, evidence viewers, L10n localizations, and protected app selector sheets for Pyro SMS Package Suite.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pyro_sms_protocol:
    path: ../pyro_sms_protocol
  pyro_sms_hub:
    path: ../pyro_sms_hub
  pyro_sms_driver_notification_listener:
    path: ../pyro_sms_driver_notification_listener

dev_dependencies:
  flutter_test:
    sdk: flutter

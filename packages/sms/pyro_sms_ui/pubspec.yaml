name: pyro_sms_ui
description: UI screens, settings panels, evidence viewers, L10n localizations, and Riverpod 3.0 state providers for Pyro SMS Package Suite.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  pyro_sms_protocol:
    path: ../pyro_sms_protocol
  pyro_sms_hub:
    path: ../pyro_sms_hub

dev_dependencies:
  flutter_test:
    sdk: flutter

name: pyro_sms_connector
description: Assembly and auto-registration facade connector for Pyro SMS Package Suite.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  pyro_sms_protocol:
    path: ../pyro_sms_protocol
  pyro_sms_hub:
    path: ../pyro_sms_hub
  pyro_sms_driver_openphish:
    path: ../pyro_sms_driver_openphish
  pyro_sms_driver_otp_guard:
    path: ../pyro_sms_driver_otp_guard
  pyro_sms_driver_keyword_bloom_filter:
    path: ../pyro_sms_driver_keyword_bloom_filter
  pyro_sms_driver_bot_automation:
    path: ../pyro_sms_driver_bot_automation
  pyro_sms_driver_telephony_fallback:
    path: ../pyro_sms_driver_telephony_fallback
  pyro_sms_driver_notification_listener:
    path: ../pyro_sms_driver_notification_listener

dev_dependencies:
  flutter_test:
    sdk: flutter

name: pyro_sms_driver_telephony_fallback
description: Native Telephony BroadcastReceiver and SMS ContentProvider fallback shim driver for high-permission/sideloaded installations.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  pyro_sms_protocol:
    path: ../pyro_sms_protocol
  pyro_sms_hub:
    path: ../pyro_sms_hub

flutter:
  plugin:
    platforms:
      android:
        package: com.pyro.sms_telephony_fallback
        pluginClass: TelephonyFallbackPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter

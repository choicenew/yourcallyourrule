name: pyro_sync_supabase
description: Database-agnostic Supabase synchronization package. Supports Drift, Isar, SQLFlite, and custom databases through abstract interfaces.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  pyro_sync_protocol:
    path: ../pyro_sync_protocol
  pyro_supabase:
    path: '../../infra/pyro_supabase'

  material_ui: any
  postgres: ^3.4.5
  supabase_flutter: ^2.8.3
  flutter_riverpod: ^3.0.3
  riverpod: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.8

flutter:
  generate: true

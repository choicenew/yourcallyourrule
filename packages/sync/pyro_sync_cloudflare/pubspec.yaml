name: pyro_sync_cloudflare
description: Cloudflare Worker 与 D1/KV 增量网络同步适配器微包 (Cloudflare Network Sync Adapter)
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  meta: ^1.15.0
  pyro_sync_protocol:
    path: ../pyro_sync_protocol
  pyro_cloudflare:
    path: '../../infra/pyro_cloudflare'

  material_ui: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.8

flutter:
  generate: true

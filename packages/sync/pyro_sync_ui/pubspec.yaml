name: pyro_sync_ui
description: Self-registering sync settings page, status widgets, and L10n for Pyro Sync domain.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pyro_sync_protocol:
    path: ../pyro_sync_protocol
  pyro_sync_hub:
    path: ../pyro_sync_hub

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true

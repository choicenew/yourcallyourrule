name: pyro_sync_syncitron
description: A syncitron adapter package implementing a transition zone using Isar for 0-aware business data.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  pyro_sync_protocol:
    path: ../pyro_sync_protocol
  pyro_sync_hub:
    path: ../pyro_sync_hub
  syncitron: ^0.5.3


  material_ui: any
  pyro_sync_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  isar_community_generator: ^3.4.1

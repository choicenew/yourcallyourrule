name: pyro_platform_http_adapter
description: Standalone cross-platform Dio HttpClientAdapter & HttpOverrides with WinHttp Schannel TLS and NativeAdapter support.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  http: ^1.2.2
  win_http: ^0.2.1
  native_dio_adapter: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

name: pyro_metadata_service
description: A decoupled metadata enrichment orchestrator for Pyro ecosystem.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

resolution: workspace

dependencies:
  meta: ^1.15.0
  http: ^1.2.2
  pyro_fetch_protocol:
    path: ../pyro_fetch_protocol
  pyro_source_hub:
    path: ../../source/pyro_source_hub
  pyro_media_models:
    path: ../../media/pyro_media_models
  pyro_worker_protocol:
    path: ../pyro_worker_protocol

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.8
  flutter_test:
    sdk: flutter

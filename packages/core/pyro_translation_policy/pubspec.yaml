name: pyro_translation_policy
description: Independent policy decision and fallback cascade engine for Pyro translation ecosystem.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.5
  pyro_api_translate:
    path: ../pyro_api_translate
  pyro_translation_cache:
    path: ../pyro_translation_cache
  pyro_edge_ai_infra:
    path: ../../ai/pyro_edge_ai_infra
  pyro_edge_ai_translate:
    path: ../../ai/pyro_edge_ai_translate

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

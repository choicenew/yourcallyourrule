name: phone_location
description: 电话号码归属地解析与地名管理包 (Phone Location Subsystem)
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  pyro_phone_location_protocol: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  riverpod_generator: ^3.0.3
  freezed: ^4.0.2
  json_serializable: ^6.14.1

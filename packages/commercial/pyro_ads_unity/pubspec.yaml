name: pyro_ads_unity
description: Standalone Unity LevelPlay ad driver adapter for Pyro Ads Suite.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pyro_ads_protocol:
    path: ../pyro_ads_protocol
  unity_levelplay_mediation: ^9.3.0

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

name: pyro_app_launch_guard
description: Decoupled app launch pipeline guard, privacy/onboarding gate, and app-open ad waterfall controller for Pyro Workspace.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pyro_ads_protocol:
    path: ../pyro_ads_protocol
  pyro_ads_hub:
    path: ../pyro_ads_hub
  pyro_commercial_hub:
    path: ../pyro_commercial_hub

  material_ui: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

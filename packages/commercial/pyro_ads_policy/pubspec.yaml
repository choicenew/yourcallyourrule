name: pyro_ads_policy
description: Standalone commercial ad policy manager and tier arbitration engine for Pyro Ads Suite.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pyro_ads_protocol:
    path: ../pyro_ads_protocol
  pyro_ads_hub:
    path: ../pyro_ads_hub
  pyro_config_remote:
    path: '../../config/pyro_config_remote'

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

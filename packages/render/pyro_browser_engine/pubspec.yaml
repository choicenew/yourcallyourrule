name: pyro_browser_engine
description: A headless, pure Dart browser engine for Pyromagma. Handles JS injection, selection bridging, and intelligent DOM extraction without any UI dependencies.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  pyro_action_hub:
    path: ../../action/pyro_action_hub
  pyro_action_protocol:
    path: ../../action/pyro_action_protocol
  pyro_api_translate:
    path: ../../core/pyro_api_translate
  pyro_dictionary:
    path: ../../tools/pyro_dictionary

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

name: pyro_render_wallpaper
description: Content render package for Wallpapers in Pyro.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pyro_render_protocol:
    path: ../pyro_render_protocol
  pyro_media_models:
    path: ../../media/pyro_media_models
  pyro_media_mapper:
    path: ../../media/pyro_media_mapper
  pyro_action_protocol:
    path: ../../action/pyro_action_protocol
  pyro_action_hub:
    path: ../../action/pyro_action_hub
  pyro_wallpaper_ui:
    path: ../../wallpaper/pyro_wallpaper_ui
  pyro_wallpaper_platform:
    path: ../../wallpaper/pyro_wallpaper_platform
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.0
  flutter_localizations:
    sdk: flutter
  intl: any

  material_ui: any
  pyro_render_hub:
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  riverpod_generator: ^3.0.3

flutter:
  generate: true

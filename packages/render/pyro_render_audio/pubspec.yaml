name: pyro_render_audio
description: Content render package for Audio streams and podcasts in Pyro.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  pyro_render_protocol:
    path: ../pyro_render_protocol
  pyro_render_ad_protocol:
    path: ../pyro_render_ad_protocol
  pyro_media_models:
    path: ../../media/pyro_media_models
  pyro_media_mapper:
    path: ../../media/pyro_media_mapper
  pyro_action_protocol:
    path: ../../action/pyro_action_protocol
  pyro_action_hub:
    path: ../../action/pyro_action_hub
  pyro_source_match:
    path: ../../source/pyro_source_match

  material_ui: any
  riverpod_annotation: any
  flutter_riverpod: any
  pyro_render_hub:
  pyro_viewer_hub:
  pyro_viewer_protocol:
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true

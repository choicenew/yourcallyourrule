name: pyro_render_comic
description: Content render package for Comics in Pyro.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pyro_render_protocol:
    path: ../pyro_render_protocol
  pyro_media_models:
    path: ../../media/pyro_media_models
  pyro_media_mapper:
    path: ../../media/pyro_media_mapper
  pyro_action_protocol:
    path: ../../action/pyro_action_protocol
  pyro_action_hub:
    path: ../../action/pyro_action_hub
  pyro_viewer_hub:
    path: ../../viewers/pyro_viewer_hub
  pyro_source_download_engine:
    path: ../../source/pyro_source_download_engine
  pyro_source_download_ui:
    path: ../../source/pyro_source_download_ui
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.0
  flutter_localizations:
    sdk: flutter
  intl: any

  material_ui: any
  pyro_render_hub:
  pyro_viewer_protocol:
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  riverpod_generator: ^3.0.3

flutter:
  generate: true

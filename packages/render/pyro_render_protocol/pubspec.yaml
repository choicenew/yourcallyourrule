name: pyro_render_protocol
description: Pure contract and signature layer for Pyro Render Protocol.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  pyro_media_models:
    path: ../../media/pyro_media_models
  pyro_media_mapper:
    path: ../../media/pyro_media_mapper

  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true


name: pyro_render_paper
description: Content render package for Academic Papers and Research Publications in Pyro.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pyro_render_protocol:
    path: ../pyro_render_protocol
  pyro_media_models:
    path: ../../media/pyro_media_models
  pyro_media_mapper:
    path: ../../media/pyro_media_mapper
  pyro_action_protocol:
    path: ../../action/pyro_action_protocol
  pyro_action_hub:
    path: ../../action/pyro_action_hub
  pyro_edge_ai_orchestrator:
    path: ../../ai/pyro_edge_ai_orchestrator
  pyro_edge_ai_infra:
    path: ../../ai/pyro_edge_ai_infra
  pyro_media_protocol:
    path: ../../media/pyro_media_protocol
  pyro_annotation:
    path: ../../notes/pyro_annotation
  pyro_viewer_hub:
    path: ../../viewers/pyro_viewer_hub
  pyro_api_translate:
    path: ../../core/pyro_api_translate
  pyro_translation_cache:
    path: ../../core/pyro_translation_cache
  auto_size_text: ^3.0.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  mime: ^2.0.0
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.0
  flutter_localizations:
    sdk: flutter
  intl: any

  material_ui: any
  pyro_viewer_protocol:
  meta: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  pyro_render_hub:
    path: ../pyro_render_hub
  build_runner: ^2.4.14
  riverpod_generator: ^3.0.3

flutter:
  generate: true

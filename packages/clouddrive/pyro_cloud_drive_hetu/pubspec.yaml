name: pyro_cloud_drive_hetu
description: Hetu Script Bridge for Cloud Drive system.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  hetu_script:
    git:
      url: https://github.com/hetu-script/hetu-script.git
      path: packages/hetu_script

  pyro_cloud_drive_protocol:
    path: ../pyro_cloud_drive_protocol
  pyro_cloud_drive_hub:
    path: ../pyro_cloud_drive_hub
  pyro_hetu_script_engine:
    path: ../../core/pyro_hetu_script_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - lib/assets/

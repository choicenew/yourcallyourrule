name: pyro_cloud_drive_crypto
description: A package providing cryptographic utility functions for Cloud Drive data encryption.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.10.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  encrypt: ^5.0.3
  flutter_secure_storage: ^11.2.0
  pyro_worker_protocol:
    path: '../../core/pyro_worker_protocol'
  pyro_cloud_drive_protocol:
    path: ../pyro_cloud_drive_protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

name: pyro_config_local
description: Local SharedPreferences Storage and JSON Snapshot Backup Implementation.
version: 0.2.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pyro_config_protocol:
    path: ../pyro_config_protocol
  shared_preferences: ^2.5.3
  flutter_riverpod: '>=3.0.0'
  riverpod_annotation: '>=3.0.0'
  path_provider: ^2.1.5

  material_ui: any
  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: '>=3.0.0'

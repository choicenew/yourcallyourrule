name: pyro_l10n
description: Advanced Standalone L10n, Dynamic Text Localizer, Fallback Cascade Resolver & Formatting Package.
version: 0.3.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  pyro_config_protocol:
    path: ../pyro_config_protocol
  flutter_riverpod: ^3.0.3
  shared_preferences: ^2.5.3
  intl:

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

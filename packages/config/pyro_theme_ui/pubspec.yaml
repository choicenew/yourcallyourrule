name: pyro_theme_ui
description: Reusable Theme Settings & Customization UI Package with Built-in Multi-Language L10n
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.3
  pyro_theme:
    path: ../pyro_theme
  flex_color_scheme: ^9.0.0
  glassmorphism: ^3.0.0

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true

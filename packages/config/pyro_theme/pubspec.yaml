name: pyro_theme
description: Advanced FlexColorScheme, Dynamic Color, High Contrast, and Design Tokens Theme Package.
version: 0.2.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.10.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pyro_config_protocol:
    path: ../pyro_config_protocol
  flutter_riverpod: ^3.0.3
  flex_color_scheme: ^9.0.0
  dynamic_color: ^2.1.0
  glassmorphism: ^3.0.0
  shared_preferences: ^2.5.3

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

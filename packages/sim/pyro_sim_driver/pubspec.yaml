name: pyro_sim_driver
description: Native Android SubscriptionManager & iOS CoreTelephony driver for SIM Package Suite.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  pyro_sim_protocol:
    path: ../pyro_sim_protocol
  pyro_sim_hub:
    path: ../pyro_sim_hub

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pyro.sim
        pluginClass: SimDriverPlugin
      ios:
        pluginClass: PyroSimDriverPlugin
